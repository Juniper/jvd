/*
 * Topic: Policy that accepts BGP routes with next-hop self and rejects everything else
 * Seen on:
 *   Junos: external-gw_mx
 *   EVO: (none)
 * Count:
 *   external-gw_mx 1
 *   total 1
 * Pair with: none
 * Peers with: n/a
 * Variables (example values from external-gw_mx):
 *   $POLICY_NAME  e.g. AllRoutes
 *   $TERM_NAME_1  e.g. 1
 *   $TERM_NAME_2  e.g. 2
 */
policy-options {
    policy-statement $POLICY_NAME {
        term $TERM_NAME_1 {
            from protocol bgp;
            then {
                next-hop self;
                accept;
            }
        }
        term $TERM_NAME_2 {
            then reject;
        }
    }
}
