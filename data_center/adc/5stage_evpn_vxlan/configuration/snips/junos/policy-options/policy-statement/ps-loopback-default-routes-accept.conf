/*
 * Topic: Export policy that accepts the loopback and the IPv4 and IPv6 default routes (static or BGP)
 * Seen on:
 *   Junos: external-gw_mx
 *   EVO: (none)
 * Count:
 *   external-gw_mx 1
 *   total 1
 * Pair with: none
 * Peers with: n/a
 * Variables (example values from external-gw_mx):
 *   $BGP_EXPORT_POL  e.g. RoutesToFabric
 *   $TERM_NAME_1     e.g. 1
 *   $TERM_NAME_2     e.g. 2
 *   $TERM_NAME_3     e.g. 3
 *   $TERM_NAME_4     e.g. 4
 */
policy-options {
    policy-statement $BGP_EXPORT_POL {
        term $TERM_NAME_1 {
            from interface lo0.0;
            then accept;
        }
        term $TERM_NAME_2 {
            from {
                protocol [ static bgp ];
                route-filter 0.0.0.0/0 exact;
            }
            then accept;
        }
        term $TERM_NAME_3 {
            from {
                protocol [ static bgp ];
                rib inet6.0;
                route-filter ::/0 exact;
            }
            then accept;
        }
        term $TERM_NAME_4 {
            then reject;
        }
    }
}
