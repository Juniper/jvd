/*
 * Topic: VLAN logical interface with IPv4 and IPv6 addresses
 * Seen on:
 *   Junos: external-gw_mx
 *   EVO: (none)
 * Count:
 *   external-gw_mx 11
 *   total 11
 * Pair with: none
 * Peers with: n/a
 * Variables (example values from external-gw_mx):
 *   $IFD         e.g. xe-0/0/7:0
 *   $UNIT        e.g. 399
 *   $VLAN        e.g. 399
 *   $AC_ADDR_V4  e.g. 10.204.0.1/31
 *   $AC_ADDR_V6  e.g. 2001:db8:dc4:10:204::5/127
 */
interfaces {
    $IFD {
        unit $UNIT {
            vlan-id $VLAN;
            family inet {
                address $AC_ADDR_V4;
            }
            family inet6 {
                address $AC_ADDR_V6;
            }
        }
    }
}
