/*
 * Topic: PIM with a local rendezvous point, on all interfaces
 * Seen on:
 *   Junos: external-gw_mx
 *   EVO: (none)
 * Count:
 *   external-gw_mx 1
 *   total 1
 * Pair with: none
 * Variables (example values from external-gw_mx):
 *   $PIM_RP_V4  e.g. 100.100.100.100
 */
protocols {
    pim {
        rp {
            local {
                address $PIM_RP_V4;
            }
        }
        interface all;
    }
}
