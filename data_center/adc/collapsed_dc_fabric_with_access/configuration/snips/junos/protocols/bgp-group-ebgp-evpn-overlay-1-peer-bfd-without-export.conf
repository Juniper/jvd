/*
 * Topic: EBGP EVPN overlay group to the peer loopback (multihop TTL 1, no next-hop change) without an export policy, BFD at 3000 ms and multiple-AS multipath
 * Seen on:
 *   Junos: access1_ex4400-48mp access2_ex4400-48mp
 *   EVO: (none)
 * Count:
 *   access1_ex4400-48mp 1
 *   access2_ex4400-48mp 1
 *   total 2
 * Pair with: none
 * Peers with:
 *   [access1_ex4400-48mp] <-> [access2_ex4400-48mp]
 * Variables (example values from access1_ex4400-48mp):
 *   $BGP_GROUP        e.g. l3clos-a-evpn
 *   $OVERLAY_PEER_V4  e.g. 192.168.253.3
 *   $DESCRIPTION      e.g. facing_dc3-rack-001-access2-evpn-overlay
 *   $LOOPBACK_V4      e.g. 192.168.253.2
 *   $ASN_FABRIC_PEER  e.g. 64803
 */
protocols {
    bgp {
        group $BGP_GROUP {
            type external;
            multihop {
                ttl 1;
                no-nexthop-change;
            }
            family evpn {
                signaling {
                    loops 2;
                }
            }
            multipath {
                multiple-as;
            }
            bfd-liveness-detection {
                minimum-interval 3000;
                multiplier 3;
            }
            neighbor $OVERLAY_PEER_V4 {
                description $DESCRIPTION;
                local-address $LOOPBACK_V4;
                family evpn {
                    signaling;
                }
                peer-as $ASN_FABRIC_PEER;
            }
            vpn-apply-export;
        }
    }
}
