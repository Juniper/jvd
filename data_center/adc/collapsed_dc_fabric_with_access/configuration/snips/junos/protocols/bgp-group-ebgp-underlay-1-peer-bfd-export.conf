/*
 * Topic: EBGP underlay group with one directly connected peer, a group export policy also applied to VPN routes, BFD at 1000 ms and multiple-AS multipath
 * Seen on:
 *   Junos: access1_ex4400-48mp access2_ex4400-48mp
 *   EVO: (none)
 * Count:
 *   access1_ex4400-48mp 1
 *   access2_ex4400-48mp 1
 *   total 2
 * Pair with: none
 * Peers with:
 *   [access1_ex4400-48mp] <-> [access2_ex4400-48mp]
 * Variables (example values from access1_ex4400-48mp):
 *   $BGP_GROUP          e.g. l3clos-a
 *   $BGP_EXPORT_POL     e.g. BGP-AOS-Policy
 *   $UNDERLAY_PEER_V4   e.g. 10.0.3.4
 *   $DESCRIPTION        e.g. facing_dc3-rack-001-access2
 *   $UNDERLAY_LOCAL_V4  e.g. 10.0.3.5
 *   $ASN_FABRIC_PEER    e.g. 64803
 */
protocols {
    bgp {
        group $BGP_GROUP {
            type external;
            export $BGP_EXPORT_POL;
            multipath {
                multiple-as;
            }
            bfd-liveness-detection {
                minimum-interval 1000;
                multiplier 3;
            }
            neighbor $UNDERLAY_PEER_V4 {
                description $DESCRIPTION;
                local-address $UNDERLAY_LOCAL_V4;
                family inet {
                    unicast;
                }
                peer-as $ASN_FABRIC_PEER;
            }
            vpn-apply-export;
        }
    }
}
