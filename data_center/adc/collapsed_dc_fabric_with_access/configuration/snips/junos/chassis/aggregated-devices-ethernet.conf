/*
 * Topic: Aggregated Ethernet device-count for the chassis
 * Seen on:
 *   Junos: access1_ex4400-48mp access2_ex4400-48mp leaf1_qfx5120-48y leaf2_qfx5120-48y
 *   EVO: (none)
 * Count:
 *   access1_ex4400-48mp 1
 *   access2_ex4400-48mp 1
 *   leaf1_qfx5120-48y 1
 *   leaf2_qfx5120-48y 1
 *   total 4
 * Pair with: none
 * Peers with: n/a
 * Variables (example values from access1_ex4400-48mp):
 *   $AE_DEVICE_COUNT  e.g. 3
 */
chassis {
    aggregated-devices {
        ethernet {
            device-count $AE_DEVICE_COUNT;
        }
    }
}
