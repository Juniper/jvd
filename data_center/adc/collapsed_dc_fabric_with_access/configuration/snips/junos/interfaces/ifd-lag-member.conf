/*
 * Topic: Aggregated Ethernet member link with a description
 * Seen on:
 *   Junos: access1_ex4400-48mp access2_ex4400-48mp
 *   EVO: (none)
 * Count:
 *   access1_ex4400-48mp 2
 *   access2_ex4400-48mp 2
 *   total 4
 * Pair with: none
 * Peers with: n/a
 * Variables (example values from access1_ex4400-48mp):
 *   $IFD          e.g. mge-0/0/41
 *   $DESCRIPTION  e.g. facing_dc3-rack-001-access2:mge-0/0/41
 *   $AE_BUNDLE    e.g. ae3
 */
interfaces {
    $IFD {
        description $DESCRIPTION;
        ether-options {
            802.3ad $AE_BUNDLE;
        }
    }
}
