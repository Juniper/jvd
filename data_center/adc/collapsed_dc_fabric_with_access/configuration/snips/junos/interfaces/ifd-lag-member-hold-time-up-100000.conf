/*
 * Topic: Aggregated Ethernet member link with a description and a hold-up timer of 100000 ms
 * Seen on:
 *   Junos: access1_ex4400-48mp access2_ex4400-48mp leaf1_qfx5120-48y leaf2_qfx5120-48y
 *   EVO: (none)
 * Count:
 *   access1_ex4400-48mp 3
 *   access2_ex4400-48mp 3
 *   leaf1_qfx5120-48y 2
 *   leaf2_qfx5120-48y 2
 *   total 10
 * Pair with: none
 * Peers with: n/a
 * Variables (example values from access1_ex4400-48mp):
 *   $IFD          e.g. mge-0/0/44
 *   $DESCRIPTION  e.g. facing_dc3-rack-001-leaf1:xe-0/0/16
 *   $AE_BUNDLE    e.g. ae1
 */
interfaces {
    $IFD {
        description $DESCRIPTION;
        hold-time up 100000 down 0;
        ether-options {
            802.3ad $AE_BUNDLE;
        }
    }
}
