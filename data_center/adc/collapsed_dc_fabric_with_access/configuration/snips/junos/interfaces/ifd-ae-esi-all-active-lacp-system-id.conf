/*
 * Topic: Aggregated Ethernet interface for an ESI-LAG: all-active Ethernet segment, active LACP with a fixed system ID and a 9216-byte MTU
 * Seen on:
 *   Junos: access1_ex4400-48mp access2_ex4400-48mp leaf1_qfx5120-48y leaf2_qfx5120-48y
 *   EVO: (none)
 * Count:
 *   access1_ex4400-48mp 2
 *   access2_ex4400-48mp 2
 *   leaf1_qfx5120-48y 1
 *   leaf2_qfx5120-48y 1
 *   total 6
 * Pair with: none
 * Variables (example values from access1_ex4400-48mp):
 *   $AE_BUNDLE    e.g. ae1
 *   $DESCRIPTION  e.g. facing_dc3-rack-001-leaf-pair1
 *   $ESI          e.g. 00:02:00:00:00:00:02:00:00:02
 *   $LACP_SYS_ID  e.g. 02:00:00:00:00:02
 */
interfaces {
    $AE_BUNDLE {
        description $DESCRIPTION;
        mtu 9216;
        esi {
            $ESI;
            all-active;
        }
        aggregated-ether-options {
            lacp {
                active;
                system-id $LACP_SYS_ID;
            }
        }
    }
}
