/*
 * Topic: Loopback unit with one IPv4 address
 * Seen on:
 *   Junos: access1_ex4400-48mp access2_ex4400-48mp leaf1_qfx5120-48y leaf2_qfx5120-48y
 *   EVO: (none)
 * Count:
 *   access1_ex4400-48mp 1
 *   access2_ex4400-48mp 1
 *   leaf1_qfx5120-48y 3
 *   leaf2_qfx5120-48y 3
 *   total 8
 * Pair with: none
 * Peers with: n/a
 * Variables (example values from access1_ex4400-48mp):
 *   $UNIT             e.g. 0
 *   $LOOPBACK_V4_PFX  e.g. 192.168.253.2/32
 */
interfaces {
    lo0 {
        unit $UNIT {
            family inet {
                address $LOOPBACK_V4_PFX;
            }
        }
    }
}
