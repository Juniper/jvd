/*
 * Topic: Aggregated Ethernet interface with a description, a 9216-byte MTU and active LACP
 * Seen on:
 *   Junos: access1_ex4400-48mp access2_ex4400-48mp
 *   EVO: (none)
 * Count:
 *   access1_ex4400-48mp 1
 *   access2_ex4400-48mp 1
 *   total 2
 * Pair with: none
 * Variables (example values from access1_ex4400-48mp):
 *   $AE_BUNDLE    e.g. ae3
 *   $DESCRIPTION  e.g. "VRF default to dc3_rack_001_access2"
 */
interfaces {
    $AE_BUNDLE {
        description $DESCRIPTION;
        mtu 9216;
        aggregated-ether-options {
            lacp {
                active;
            }
        }
    }
}
