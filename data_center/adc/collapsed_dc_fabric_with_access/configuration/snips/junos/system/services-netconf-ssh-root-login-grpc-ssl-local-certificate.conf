/*
 * Topic: NETCONF over SSH, SSH with root login, and a gRPC extension service over SSL on port 32767 in the management instance, using a local certificate
 * Seen on:
 *   Junos: access1_ex4400-48mp access2_ex4400-48mp leaf1_qfx5120-48y leaf2_qfx5120-48y
 *   EVO: (none)
 * Count:
 *   access1_ex4400-48mp 1
 *   access2_ex4400-48mp 1
 *   leaf1_qfx5120-48y 1
 *   leaf2_qfx5120-48y 1
 *   total 4
 * Pair with: none
 * Variables (example values from access1_ex4400-48mp):
 *   $LOCAL_CERT  e.g. aos_grpc
 */
system {
    services {
        netconf {
            ssh;
        }
        ssh {
            root-login allow;
        }
        extension-service {
            request-response {
                grpc {
                    ssl {
                        port 32767;
                        local-certificate $LOCAL_CERT;
                    }
                    routing-instance mgmt_junos;
                }
            }
        }
    }
}
