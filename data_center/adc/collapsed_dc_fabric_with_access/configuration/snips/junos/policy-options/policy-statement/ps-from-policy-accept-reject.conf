/*
 * Topic: Policy that accepts the routes another policy accepts and rejects everything else
 * Seen on:
 *   Junos: access1_ex4400-48mp access2_ex4400-48mp
 *   EVO: (none)
 * Count:
 *   access1_ex4400-48mp 1
 *   access2_ex4400-48mp 1
 *   total 2
 * Pair with: none
 * Peers with: n/a
 * Variables (example values from access1_ex4400-48mp):
 *   $BGP_EXPORT_POL  e.g. BGP-AOS-Policy
 *   $TERM_NAME_1     e.g. BGP-AOS-Policy-10
 *   $POLICY_NAME     e.g. AllPodNetworks
 *   $TERM_NAME_2     e.g. BGP-AOS-Policy-100
 */
policy-options {
    policy-statement $BGP_EXPORT_POL {
        term $TERM_NAME_1 {
            from policy $POLICY_NAME;
            then accept;
        }
        term $TERM_NAME_2 {
            then reject;
        }
    }
}
