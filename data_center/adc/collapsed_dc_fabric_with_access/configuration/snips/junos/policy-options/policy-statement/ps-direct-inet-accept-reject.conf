/*
 * Topic: Policy that accepts direct IPv4 routes and rejects everything else
 * Seen on:
 *   Junos: access1_ex4400-48mp access2_ex4400-48mp
 *   EVO: (none)
 * Count:
 *   access1_ex4400-48mp 1
 *   access2_ex4400-48mp 1
 *   total 2
 * Pair with: none
 * Peers with: n/a
 * Variables (example values from access1_ex4400-48mp):
 *   $POLICY_NAME  e.g. AllPodNetworks
 *   $TERM_NAME_1  e.g. AllPodNetworks-10
 *   $TERM_NAME_2  e.g. AllPodNetworks-100
 */
policy-options {
    policy-statement $POLICY_NAME {
        term $TERM_NAME_1 {
            from {
                family inet;
                protocol direct;
            }
            then accept;
        }
        term $TERM_NAME_2 {
            then reject;
        }
    }
}
