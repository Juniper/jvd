 * Seen on:
 *   Junos: leaf1_qfx5120-48y leaf2_qfx5120-48y
 *   EVO: (none)
 * Count:
 *   leaf1_qfx5120-48y 1
 *   leaf2_qfx5120-48y 1
 *   total 2
 * Pair with: none
 * Peers with: n/a
 * Variables (example values from leaf1_qfx5120-48y):
 *   $AE_DEVICE_COUNT  e.g. 1
