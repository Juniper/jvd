/*
 * Topic: Loopback unit with one IPv4 address
 * Seen on:
 *   Junos: leaf1_qfx5120-48y leaf2_qfx5120-48y
 *   EVO: (none)
 * Count:
 *   leaf1_qfx5120-48y 3
 *   leaf2_qfx5120-48y 3
 *   total 6
 * Pair with: none
 * Peers with: n/a
 * Variables (example values from leaf1_qfx5120-48y):
 *   $UNIT             e.g. 2
 *   $LOOPBACK_V4_PFX  e.g. 192.168.13.2/32
 */
interfaces {
    lo0 {
        unit $UNIT {
            family inet {
                address $LOOPBACK_V4_PFX;
            }
        }
    }
}
