/*
 * Topic: RSTP with bridge priority 0, two edge interfaces and BPDU block on edge
 * Seen on:
 *   Junos: leaf1_qfx5120-48y leaf2_qfx5120-48y
 *   EVO: (none)
 * Count:
 *   leaf1_qfx5120-48y 1
 *   leaf2_qfx5120-48y 1
 *   total 2
 * Pair with: none
 * Variables (example values from leaf1_qfx5120-48y):
 *   $AC_INTF_1  e.g. xe-0/0/5
 *   $AC_INTF_2  e.g. ae1
 */
protocols {
    rstp {
        bridge-priority 0;
        interface $AC_INTF_1 {
            edge;
        }
        interface $AC_INTF_2 {
            edge;
        }
        bpdu-block-on-edge;
    }
}
