routing-options {
    router-id 192.168.254.14;
    autonomous-system 65113;
    graceful-restart;
    forwarding-table {
        export PFE-LB;
        ecmp-fast-reroute;
    }
}
protocols {
    bgp {
        group l3clos-a {
            type external;
            export BGP-AOS-Policy;
            multipath {
                multiple-as;
            }
            bfd-liveness-detection {
                minimum-interval 1000;
                multiplier 3;
            }
            neighbor 10.0.2.40 {
                description facing_dc2-esi-sub-001-access1;
                local-address 10.0.2.41;
                family inet {
                    unicast;
                }
                peer-as 65112;
            }
            vpn-apply-export;
        }
        group l3clos-a-evpn {
            type external;
            multihop {
                ttl 1;
                no-nexthop-change;
            }
            family evpn {
                signaling {
                    loops 2;
                }
            }
            multipath {
                multiple-as;
            }
            bfd-liveness-detection {
                minimum-interval 3000;
                multiplier 3;
            }
            neighbor 192.168.254.13 {
                description facing_dc2-esi-sub-001-access1-evpn-overlay;
                local-address 192.168.254.14;
                family evpn {
                    signaling;
                }
                peer-as 65112;
            }
            vpn-apply-export;
        }
        enable-oc-attr-set;
        log-updown;
        graceful-restart {
            dont-help-shared-fate-bfd-down;
        }
        multipath;
    }
    evpn {
        no-core-isolation;
    }
    l2-learning {
        telemetry {
            enable-remote-entries;
        }
    }
    lldp {
        port-id-subtype interface-name;
        port-description-type interface-description;
        neighbour-port-info-display port-id;
        interface all;
    }
    rstp {
        interface ae2 {
            edge;
        }
        interface ae3 {
            edge;
        }
        bpdu-block-on-edge;
    }
}
