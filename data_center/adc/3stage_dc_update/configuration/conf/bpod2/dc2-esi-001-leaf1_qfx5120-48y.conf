    bgp {
        group l3clos-l {
            type external;
            multipath {
                multiple-as;
            }
            bfd-liveness-detection {
                minimum-interval 1000;
                multiplier 3;
            }
            neighbor fdf6:ed70:1fac:f2d2::4 {
                description facing_spine1;
                local-address fdf6:ed70:1fac:f2d2::5;
                family inet6 {
                    unicast;
                }
                export ( LEAF_TO_SPINE_FABRIC_OUT && BGP-AOS-Policy );
                peer-as 65100;
            }
            neighbor fdf6:ed70:1fac:f2d2::18 {
                description facing_spine2;
                local-address fdf6:ed70:1fac:f2d2::19;
                family inet6 {
                    unicast;
                }
                export ( LEAF_TO_SPINE_FABRIC_OUT && BGP-AOS-Policy );
                peer-as 65101;
            }
            neighbor 10.0.2.4 {
                description facing_spine1;
                local-address 10.0.2.5;
                family inet {
                    unicast;
                }
                export ( LEAF_TO_SPINE_FABRIC_OUT && BGP-AOS-Policy );
                peer-as 65100;
            }
            neighbor 10.0.2.24 {
                description facing_spine2;
                local-address 10.0.2.25;
                family inet {
                    unicast;
                }
                export ( LEAF_TO_SPINE_FABRIC_OUT && BGP-AOS-Policy );
                peer-as 65101;
            }
            vpn-apply-export;
        }
        group l3clos-l-evpn {
            type external;
            multihop {
                ttl 1;
                no-nexthop-change;
            }
            family evpn {
                signaling {
                    loops 2;
                }
            }
            multipath {
                multiple-as;
            }
            bfd-liveness-detection {
                minimum-interval 3000;
                multiplier 3;
            }
            neighbor 192.168.254.1 {
                description facing_spine1-evpn-overlay;
                local-address 192.168.254.5;
                family evpn {
                    signaling;
                }
                export ( LEAF_TO_SPINE_EVPN_OUT && EVPN_EXPORT );
                peer-as 65100;
            }
            neighbor 192.168.254.2 {
                description facing_spine2-evpn-overlay;
                local-address 192.168.254.5;
                family evpn {
                    signaling;
                }
                export ( LEAF_TO_SPINE_EVPN_OUT && EVPN_EXPORT );
                peer-as 65101;
            }
            vpn-apply-export;
        }
        enable-oc-attr-set;
        log-updown;
        graceful-restart {
            dont-help-shared-fate-bfd-down;
        }
        multipath;
    }
    l2-learning {
        telemetry {
            enable-remote-entries;
        }
    }
    lldp {
        port-id-subtype interface-name;
        port-description-type interface-description;
        neighbour-port-info-display port-id;
        interface all;
    }
    sflow {
        polling-interval 10;
        sample-rate {
            ingress 1024;
            egress 1024;
        }
        source-ip 10.216.32.220;
        collector 10.219.1.2 {
            udp-port 6343;
        }
        interfaces xe-0/0/0.0;
        interfaces xe-0/0/2.0;
        interfaces et-0/0/46.0;
        interfaces et-0/0/47.0;
    }
    rstp {
        bridge-priority 0;
        interface ae1 {
            edge;
        }
        interface ae2 {
            edge;
        }
        bpdu-block-on-edge;
    }
