## Last commit: 2026-10-07 10:58:50 PDT by root
version 25.2R2-S2.2;
groups {
    PROTECT_RE_CONFIGLET {
        interfaces {
            lo0 {
                unit 0 {
                    family inet {
                        filter {
                            input cpp-filter;
                        }
                    }
                    family inet6 {
                        filter {
                            input cpp-filter-ipv6;
                        }
                    }
                }
            }
        }
        policy-options {
            prefix-list BGP_NEIGHBORS_V4 {
                apply-path "protocols bgp group <*> neighbor <*>";
            }
            prefix-list BGP_VRF_NEIGHBOURS_V4 {
                apply-path "routing-instances <*> protocols bgp group <*> neighbor <*>";
            }
            prefix-list REMOTE_MGMT_NETS_V4 {
                10.0.0.0/8;
                66.0.0.0/8;
                172.0.0.0/8;
                192.0.0.0/8;
            }
            prefix-list DNS_SERVERS_V4 {
                apply-path "system name-server <*>";
            }
            prefix-list NTP_SERVERS_V4 {
                apply-path "system ntp server <*>";
            }
            prefix-list NTP_SERVERS_PEERS {
                apply-path "system ntp peer <*>";
            }
            prefix-list LOOPBACKS_V4 {
                apply-path "interfaces lo0 unit 0 family inet address <*>";
            }
            prefix-list LOCAL_IPV4 {
                apply-path "interfaces <*> unit <*> family inet address <*>";
            }
        }
        firewall {
            family inet {
                filter cpp-filter {
                    term bgp {
                        from {
                            source-prefix-list {
                                BGP_NEIGHBORS_V4;
                                BGP_VRF_NEIGHBOURS_V4;
                            }
                            protocol tcp;
                            destination-port 179;
                        }
                        then {
                            count cpp_bgp_accept;
                            accept;
                        }
                    }
                    term ssh {
                        from {
                            source-prefix-list {
                                REMOTE_MGMT_NETS_V4;
                            }
                            protocol tcp;
                            destination-port ssh;
                        }
                        then {
                            count cpp_ssh_accept;
                            accept;
                        }
                    }
                    term no_icmp_fragments_v4 {
                        from {
                            is-fragment;
                            protocol icmp;
                        }
                        then {
                            count no_icmp_fragments_v4;
                            log;
                            discard;
                        }
                    }
                    term icmp {
                        from {
                            protocol icmp;
                            icmp-type [ echo-request echo-reply unreachable time-exceeded ];
                        }
                        then {
                            policer 5MB_CP_POLICER;
                            count cpp_icmp_accept;
                            accept;
                        }
                    }
                    term dns {
                        from {
                            source-prefix-list {
                                DNS_SERVERS_V4;
                            }
                            protocol [ udp tcp ];
                            source-port domain;
                        }
                        then {
                            policer 1MB_CP_POLICER;
                            count cpp_dns_accept;
                            accept;
                        }
                    }
                    term ntp {
                        from {
                            source-prefix-list {
                                NTP_SERVERS_PEERS;
                                NTP_SERVERS_V4;
                            }
                            protocol udp;
                            destination-port ntp;
                        }
                        then accept;
                    }
                    term dhcp {
                        from {
                            protocol udp;
                            source-port dhcp;
                            destination-port dhcp;
                        }
                        then {
                            policer 5MB_CP_POLICER;
                            count dhcp_accept;
                            accept;
                        }
                    }
                    term netconf_grpc {
                        from {
                            source-prefix-list {
                                REMOTE_MGMT_NETS_V4;
                            }
                            protocol tcp;
                            destination-port [ 830 50051 32767 ];
                        }
                        then {
                            count cpp_netconf_grpc_accept;
                            accept;
                        }
                    }
                    term bfd {
                        from {
                            source-prefix-list {
                                BGP_NEIGHBORS_V4;
                                BGP_VRF_NEIGHBOURS_V4;
                            }
                            protocol udp;
                            destination-port [ 3784 3785 4784 ];
                        }
                        then {
                            count cpp_bfd_accept;
                            accept;
                        }
                    }
                    term bfd-rep {
                        from {
                            source-prefix-list {
                                BGP_NEIGHBORS_V4;
                                BGP_VRF_NEIGHBOURS_V4;
                            }
                            protocol udp;
                            source-port [ 3784 3785 4784 ];
                        }
                        then {
                            count cpp_bfd_rep_accept;
                            accept;
                        }
                    }
                    term snmp {
                        from {
                            source-prefix-list {
                                REMOTE_MGMT_NETS_V4;
                            }
                            destination-prefix-list {
                                LOCAL_IPV4;
                            }
                            protocol udp;
                            destination-port snmp;
                        }
                        then {
                            policer 5MB_CP_POLICER;
                            count cpp_snmp_accept;
                            accept;
                        }
                    }
                    term ospf {
                        from {
                            protocol ospf;
                        }
                        then {
                            count cpp_ospf_accept;
                            accept;
                        }
                    }
                    term tcp-established {
                        from {
                            protocol tcp;
                            tcp-established;
                        }
                        then {
                            count cpp_tcp_established_accept;
                            accept;
                        }
                    }
                    term synflood {
                        from {
                            source-prefix-list {
                                REMOTE_MGMT_NETS_V4;
                            }
                            protocol tcp;
                            tcp-flags "(syn & !ack) | fin | rst";
                        }
                        then {
                            policer 1MB_CP_POLICER;
                            accept;
                        }
                    }
                    term discard-rest {
                        then {
                            count cpp_discard_rest;
                            discard;
                        }
                    }
                }
            }
            family inet6 {
                filter cpp-filter-ipv6 {
                    term ssh {
                        from {
                            next-header tcp;
                            destination-port ssh;
                        }
                        then {
                            count cpp_ssh_accept_v6;
                            accept;
                        }
                    }
                    term icmp6 {
                        from {
                            next-header icmp6;
                            icmp-type [ echo-request echo-reply time-exceeded membership-query membership-report neighbor-advertisement neighbor-solicit router-advertisement router-solicit packet-too-big parameter-problem ];
                        }
                        then {
                            policer 5MB_CP_POLICER;
                            count cpp_icmp_accept_v6;
                        }
                    }
                    term bgp {
                        from {
                            next-header tcp;
                            destination-port bgp;
                        }
                        then {
                            count cpp_bgp_accept_v6;
                            accept;
                        }
                    }
                    term dns {
                        from {
                            next-header udp;
                            destination-port 53;
                        }
                        then {
                            count cpp_dns_accept_v6;
                            accept;
                        }
                    }
                    term dns-rep {
                        from {
                            next-header udp;
                            source-port 53;
                        }
                        then {
                            count cpp_dns_rep_accept_v6;
                            accept;
                        }
                    }
                    term ntp {
                        from {
                            next-header udp;
                            destination-port ntp;
                        }
                        then {
                            count cpp_ntp_accept_v6;
                            accept;
                        }
                    }
                    term ntp-rep {
                        from {
                            next-header udp;
                            source-port ntp;
                        }
                        then {
                            count cpp_ntp_rep_accept_v6;
                            accept;
                        }
                    }
                    term dhcp {
                        from {
                            next-header udp;
                            destination-port [ 546 547 ];
                        }
                        then {
                            count cpp_dhcp_accept_v6;
                            accept;
                        }
                    }
                    term dhcpv6-from-server {
                        from {
                            next-header udp;
                            source-port 547;
                        }
                        then {
                            count cpp_dhcp_from_server_accept_v6;
                            accept;
                        }
                    }
                    term netconf {
                        from {
                            next-header tcp;
                            destination-port 830;
                        }
                        then {
                            count cpp_netconf_accept_v6;
                            accept;
                        }
                    }
                    term bfd {
                        from {
                            next-header udp;
                            destination-port [ 3784 4784 3785 ];
                        }
                        then {
                            count cpp_bfd_accept_v6;
                            accept;
                        }
                    }
                    term bfd-rep {
                        from {
                            next-header udp;
                            source-port [ 3784 3785 4784 ];
                        }
                        then {
                            count cpp_bfd_rep_accept_v6;
                            accept;
                        }
                    }
                    term snmp {
                        from {
                            next-header udp;
                            destination-port snmp;
                        }
                        then {
                            count cpp_snmp_accept_v6;
                            accept;
                        }
                    }
                    term ospf {
                        from {
                            next-header ospf;
                        }
                        then {
                            count cpp_ospf_accept_v6;
                            accept;
                        }
                    }
                    term openssl {
                        from {
                            next-header tcp;
                            destination-port 32767;
                        }
                        then {
                            count cpp_openssl_accept_v6;
                            accept;
                        }
                    }
                    term tcp-established {
                        from {
                            next-header tcp;
                            tcp-established;
                        }
                        then {
                            count cpp_tcp_established_accept_v6;
                            accept;
                        }
                    }
                    term discard-rest {
                        then {
                            count cpp_discard_rest_v6;
                            discard;
                        }
                    }
                }
            }
            policer 5MB_CP_POLICER {
                if-exceeding {
                    bandwidth-limit 5m;
                    burst-size-limit 1m;
                }
                then discard;
            }
            policer 1MB_CP_POLICER {
                if-exceeding {
                    bandwidth-limit 1m;
                    burst-size-limit 200k;
                }
                then discard;
            }
        }
    }
}
apply-groups PROTECT_RE_CONFIGLET;
