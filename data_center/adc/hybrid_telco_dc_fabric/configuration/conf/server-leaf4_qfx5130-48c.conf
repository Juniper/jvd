protocols {
    router-advertisement {
        interface et-0/0/54.0 {
            max-advertisement-interval 30;
            min-advertisement-interval 10;
        }
        interface et-0/0/55.0 {
            max-advertisement-interval 30;
            min-advertisement-interval 10;
        }
    }
    bgp {
        group l3clos-l {
            type external;
            multipath {
                multiple-as;
            }
            bfd-liveness-detection {
                minimum-interval 1000;
                multiplier 3;
            }
            neighbor 2001:2001:2001:2001::6 {
                description facing_spine1;
                local-address 2001:2001:2001:2001::7;
                family inet {
                    unicast {
                        extended-nexthop;
                    }
                }
                family inet6 {
                    unicast;
                }
                export ( LEAF_TO_SPINE_FABRIC_OUT && BGP-AOS-Policy );
                peer-as 100;
            }
            neighbor 2001:2001:2001:2001::16 {
                description facing_spine2;
                local-address 2001:2001:2001:2001::17;
                family inet {
                    unicast {
                        extended-nexthop;
                    }
                }
                family inet6 {
                    unicast;
                }
                export ( LEAF_TO_SPINE_FABRIC_OUT && BGP-AOS-Policy );
                peer-as 101;
            }
            vpn-apply-export;
        }
        group l3clos-l-evpn {
            type external;
            multihop {
                ttl 1;
                no-nexthop-change;
            }
            family evpn {
                signaling {
                    loops 2;
                }
            }
            multipath {
                multiple-as;
            }
            bfd-liveness-detection {
                minimum-interval 3000;
                multiplier 3;
            }
            neighbor fd86:8ff:73b0:22de:: {
                description facing_spine1-evpn-overlay;
                local-address fd86:8ff:73b0:22de::5;
                family evpn {
                    signaling;
                }
                export ( LEAF_TO_SPINE_EVPN_OUT && EVPN_EXPORT );
                peer-as 100;
            }
            neighbor fd86:8ff:73b0:22de::1 {
                description facing_spine2-evpn-overlay;
                local-address fd86:8ff:73b0:22de::5;
                family evpn {
                    signaling;
                }
                export ( LEAF_TO_SPINE_EVPN_OUT && EVPN_EXPORT );
                peer-as 101;
            }
            vpn-apply-export;
        }
        enable-oc-attr-set;
        log-updown;
        graceful-restart {
            dont-help-shared-fate-bfd-down;
        }
        multipath;
    }
    l2-learning {
        telemetry {
            enable-remote-entries;
        }
        crb-proxy-mac {
            family {
                inet {
                    02:fc:00:00:00:02;
                }
                inet6 {
                    02:fc:00:00:00:02;
                }
            }
        }
    }
    lldp {
        port-id-subtype interface-name;
        port-description-type interface-description;
        neighbour-port-info-display port-id;
        interface all;
    }
    rstp {
        bridge-priority 0;
        interface et-0/0/50 {
            edge;
        }
        interface ae2 {
            edge;
        }
        bpdu-block-on-edge;
    }
}
