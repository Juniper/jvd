/*
 * Topic: VLAN-tagged unit with a description, an IPv4 address and a family MTU
 * Seen on:
 *   Junos: dc1-dc3_type2_seamless/dc3_leaf1_qfx5120-48y dc1-dc3_type2_seamless/dc3_leaf2_qfx5120-48y
 *   EVO: (none)
 * Count:
 *   dc1-dc3_type2_seamless/dc3_leaf1_qfx5120-48y 1
 *   dc1-dc3_type2_seamless/dc3_leaf2_qfx5120-48y 1
 *   total 2
 * Pair with: none
 * Peers with: n/a
 * Variables (example values from dc1-dc3_type2_seamless/dc3_leaf1_qfx5120-48y):
 *   $AC_INTF      e.g. xe-0/0/12
 *   $UNIT         e.g. 3100
 *   $DESCRIPTION  e.g. "VRF default to DC3-DC1-link1"
 *   $VLAN         e.g. 3100
 *   $MTU          e.g. 9100
 *   $AC_ADDR_V4   e.g. 172.27.0.2/24
 */
interfaces {
    $AC_INTF {
        unit $UNIT {
            description $DESCRIPTION;
            vlan-id $VLAN;
            family inet {
                mtu $MTU;
                address $AC_ADDR_V4;
            }
        }
    }
}
