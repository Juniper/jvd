/*
 * Topic: IRB unit with IPv4 and IPv6 gateway addresses, a 9000-byte family MTU, a MAC address and no DHCP flooding
 * Seen on:
 *   Junos: dc1-dc2_ott/dc2_esi-leaf1_qfx5120-48y dc1-dc2_ott/dc2_esi-leaf2_qfx5120-48y dc1-dc2_ott/dc2_server-leaf1_qfx5120-48y dc1-dc3_type2_seamless/dc1_leaf1_qfx5120-48y dc1-dc3_type2_seamless/dc1_leaf2_qfx5120-48y dc1-dc3_type2_seamless/dc1_leaf3_qfx5120-48y
 *   EVO: (none)
 * Count:
 *   dc1-dc2_ott/dc2_esi-leaf1_qfx5120-48y 2
 *   dc1-dc2_ott/dc2_esi-leaf2_qfx5120-48y 2
 *   dc1-dc2_ott/dc2_server-leaf1_qfx5120-48y 2
 *   dc1-dc3_type2_seamless/dc1_leaf1_qfx5120-48y 2
 *   dc1-dc3_type2_seamless/dc1_leaf2_qfx5120-48y 2
 *   dc1-dc3_type2_seamless/dc1_leaf3_qfx5120-48y 2
 *   total 12
 * Pair with: none
 * Peers with: n/a
 * Variables (example values from dc1-dc2_ott/dc2_esi-leaf1_qfx5120-48y):
 *   $IRB_UNIT     e.g. 400
 *   $IRB_ADDR     e.g. 10.0.0.1/24
 *   $IRB_ADDR_V6  e.g. 2001:db8:dc1:10:00:00::1/96
 *   $IRB_MAC      e.g. 00:1c:73:00:00:01
 */
interfaces {
    irb {
        unit $IRB_UNIT {
            family inet {
                mtu 9000;
                address $IRB_ADDR;
            }
            family inet6 {
                mtu 9000;
                address $IRB_ADDR_V6;
            }
            mac $IRB_MAC;
            no-dhcp-flood;
        }
    }
}
