/*
 * Topic: Described tagged routed unit with an IPv4 address
 * Seen on:
 *   Junos: dc1-dc3_type2_seamless/dc3_leaf1_qfx5120-48y dc1-dc3_type2_seamless/dc3_leaf2_qfx5120-48y
 *   EVO: (none)
 * Count:
 *   dc1-dc3_type2_seamless/dc3_leaf1_qfx5120-48y 2
 *   dc1-dc3_type2_seamless/dc3_leaf2_qfx5120-48y 2
 *   total 4
 * Pair with: none
 * Peers with: n/a
 * Variables (example values from dc1-dc3_type2_seamless/dc3_leaf1_qfx5120-48y):
 *   $IFD          e.g. xe-0/0/10
 *   $UNIT         e.g. 199
 *   $DESCRIPTION  e.g. "VRF red to dc3_rack_001_sys004"
 *   $VLAN         e.g. 199
 *   $AC_ADDR_V4   e.g. 10.200.2.0/31
 */
interfaces {
    $IFD {
        unit $UNIT {
            description $DESCRIPTION;
            vlan-id $VLAN;
            family inet {
                address $AC_ADDR_V4;
            }
        }
    }
}
