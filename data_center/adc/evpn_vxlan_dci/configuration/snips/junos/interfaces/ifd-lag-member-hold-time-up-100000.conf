/*
 * Topic: Aggregated Ethernet member link with a description and a hold-up timer of 100000 ms
 * Seen on:
 *   Junos: dc1-dc3_type2_seamless/dc3_leaf1_qfx5120-48y dc1-dc3_type2_seamless/dc3_leaf2_qfx5120-48y
 *   EVO: (none)
 * Count:
 *   dc1-dc3_type2_seamless/dc3_leaf1_qfx5120-48y 1
 *   dc1-dc3_type2_seamless/dc3_leaf2_qfx5120-48y 1
 *   total 2
 * Pair with: none
 * Peers with: n/a
 * Variables (example values from dc1-dc3_type2_seamless/dc3_leaf1_qfx5120-48y):
 *   $IFD          e.g. xe-0/0/11
 *   $DESCRIPTION  e.g. to.dc3-rack-001-sys001
 *   $AE_BUNDLE    e.g. ae1
 */
interfaces {
    $IFD {
        description $DESCRIPTION;
        hold-time up 100000 down 0;
        ether-options {
            802.3ad $AE_BUNDLE;
        }
    }
}
