/*
 * Topic: Spine eBGP underlay group with five leaf peers, each in its own AS, over IPv4 and IPv6, BFD and a two-policy export chain
 * Seen on:
 *   Junos: dc1-dc2_ott/dc2_spine1_qfx5120-48y-8c dc1-dc2_ott/dc2_spine2_qfx5120-48y-8c
 *   EVO: (none)
 * Count:
 *   dc1-dc2_ott/dc2_spine1_qfx5120-48y-8c 1
 *   dc1-dc2_ott/dc2_spine2_qfx5120-48y-8c 1
 *   total 2
 * Pair with: none
 * Variables (example values from dc1-dc2_ott/dc2_spine1_qfx5120-48y-8c):
 *   $BGP_GROUP            e.g. l3clos-s
 *   $UNDERLAY_PEER_V6_1   e.g. fdf6:ed70:1fac:f2d1::1
 *   $DESCRIPTION_1        e.g. facing_dc2-borderleaf-001-leaf1
 *   $UNDERLAY_LOCAL_V6_1  e.g. fdf6:ed70:1fac:f2d1::
 *   $BGP_EXPORT_POL_1     e.g. SPINE_TO_LEAF_FABRIC_OUT
 *   $BGP_EXPORT_POL_2     e.g. BGP-AOS-Policy
 *   $ASN_FABRIC_PEER_1    e.g. 65105
 *   $UNDERLAY_PEER_V6_2   e.g. fdf6:ed70:1fac:f2d1::3
 *   $DESCRIPTION_2        e.g. facing_dc2-borderleaf-001-leaf2
 *   $UNDERLAY_LOCAL_V6_2  e.g. fdf6:ed70:1fac:f2d1::2
 *   $ASN_FABRIC_PEER_2    e.g. 65106
 *   $UNDERLAY_PEER_V6_3   e.g. fdf6:ed70:1fac:f2d1::5
 *   $DESCRIPTION_3        e.g. facing_dc2-esi-001-leaf1
 *   $UNDERLAY_LOCAL_V6_3  e.g. fdf6:ed70:1fac:f2d1::4
 *   $ASN_FABRIC_PEER_3    e.g. 65103
 *   $UNDERLAY_PEER_V6_4   e.g. fdf6:ed70:1fac:f2d1::7
 *   $DESCRIPTION_4        e.g. facing_dc2-esi-001-leaf2
 *   $UNDERLAY_LOCAL_V6_4  e.g. fdf6:ed70:1fac:f2d1::6
 *   $ASN_FABRIC_PEER_4    e.g. 65104
 *   $UNDERLAY_PEER_V6_5   e.g. fdf6:ed70:1fac:f2d1::9
 *   $DESCRIPTION_5        e.g. facing_dc2-single-001-leaf1
 *   $UNDERLAY_LOCAL_V6_5  e.g. fdf6:ed70:1fac:f2d1::8
 *   $ASN_FABRIC_PEER_5    e.g. 65102
 *   $UNDERLAY_PEER_V4_1   e.g. 10.0.2.1
 *   $UNDERLAY_LOCAL_V4_1  e.g. 10.0.2.0
 *   $UNDERLAY_PEER_V4_2   e.g. 10.0.2.3
 *   $UNDERLAY_LOCAL_V4_2  e.g. 10.0.2.2
 *   $UNDERLAY_PEER_V4_3   e.g. 10.0.2.5
 *   $UNDERLAY_LOCAL_V4_3  e.g. 10.0.2.4
 *   $UNDERLAY_PEER_V4_4   e.g. 10.0.2.7
 *   $UNDERLAY_LOCAL_V4_4  e.g. 10.0.2.6
 *   $UNDERLAY_PEER_V4_5   e.g. 10.0.2.9
 *   $UNDERLAY_LOCAL_V4_5  e.g. 10.0.2.8
 */
protocols {
    bgp {
        group $BGP_GROUP {
            type external;
            multipath {
                multiple-as;
            }
            bfd-liveness-detection {
                minimum-interval 1000;
                multiplier 3;
            }
            neighbor $UNDERLAY_PEER_V6_1 {
                description $DESCRIPTION_1;
                local-address $UNDERLAY_LOCAL_V6_1;
                family inet6 {
                    unicast;
                }
                export ( $BGP_EXPORT_POL_1 && $BGP_EXPORT_POL_2 );
                peer-as $ASN_FABRIC_PEER_1;
            }
            neighbor $UNDERLAY_PEER_V6_2 {
                description $DESCRIPTION_2;
                local-address $UNDERLAY_LOCAL_V6_2;
                family inet6 {
                    unicast;
                }
                export ( $BGP_EXPORT_POL_1 && $BGP_EXPORT_POL_2 );
                peer-as $ASN_FABRIC_PEER_2;
            }
            neighbor $UNDERLAY_PEER_V6_3 {
                description $DESCRIPTION_3;
                local-address $UNDERLAY_LOCAL_V6_3;
                family inet6 {
                    unicast;
                }
                export ( $BGP_EXPORT_POL_1 && $BGP_EXPORT_POL_2 );
                peer-as $ASN_FABRIC_PEER_3;
            }
            neighbor $UNDERLAY_PEER_V6_4 {
                description $DESCRIPTION_4;
                local-address $UNDERLAY_LOCAL_V6_4;
                family inet6 {
                    unicast;
                }
                export ( $BGP_EXPORT_POL_1 && $BGP_EXPORT_POL_2 );
                peer-as $ASN_FABRIC_PEER_4;
            }
            neighbor $UNDERLAY_PEER_V6_5 {
                description $DESCRIPTION_5;
                local-address $UNDERLAY_LOCAL_V6_5;
                family inet6 {
                    unicast;
                }
                export ( $BGP_EXPORT_POL_1 && $BGP_EXPORT_POL_2 );
                peer-as $ASN_FABRIC_PEER_5;
            }
            neighbor $UNDERLAY_PEER_V4_1 {
                description $DESCRIPTION_1;
                local-address $UNDERLAY_LOCAL_V4_1;
                family inet {
                    unicast;
                }
                export ( $BGP_EXPORT_POL_1 && $BGP_EXPORT_POL_2 );
                peer-as $ASN_FABRIC_PEER_1;
            }
            neighbor $UNDERLAY_PEER_V4_2 {
                description $DESCRIPTION_2;
                local-address $UNDERLAY_LOCAL_V4_2;
                family inet {
                    unicast;
                }
                export ( $BGP_EXPORT_POL_1 && $BGP_EXPORT_POL_2 );
                peer-as $ASN_FABRIC_PEER_2;
            }
            neighbor $UNDERLAY_PEER_V4_3 {
                description $DESCRIPTION_3;
                local-address $UNDERLAY_LOCAL_V4_3;
                family inet {
                    unicast;
                }
                export ( $BGP_EXPORT_POL_1 && $BGP_EXPORT_POL_2 );
                peer-as $ASN_FABRIC_PEER_3;
            }
            neighbor $UNDERLAY_PEER_V4_4 {
                description $DESCRIPTION_4;
                local-address $UNDERLAY_LOCAL_V4_4;
                family inet {
                    unicast;
                }
                export ( $BGP_EXPORT_POL_1 && $BGP_EXPORT_POL_2 );
                peer-as $ASN_FABRIC_PEER_4;
            }
            neighbor $UNDERLAY_PEER_V4_5 {
                description $DESCRIPTION_5;
                local-address $UNDERLAY_LOCAL_V4_5;
                family inet {
                    unicast;
                }
                export ( $BGP_EXPORT_POL_1 && $BGP_EXPORT_POL_2 );
                peer-as $ASN_FABRIC_PEER_5;
            }
            vpn-apply-export;
        }
    }
}
