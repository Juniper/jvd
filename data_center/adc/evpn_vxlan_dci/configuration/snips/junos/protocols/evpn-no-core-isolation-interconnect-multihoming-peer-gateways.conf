/*
 * Topic: EVPN without core isolation, with the loopbacks of the two local DCI gateways as interconnect multihoming peers
 * Seen on:
 *   Junos: dc1-dc3_type2_seamless/dc3_leaf1_qfx5120-48y dc1-dc3_type2_seamless/dc3_leaf2_qfx5120-48y
 *   EVO: (none)
 * Count:
 *   dc1-dc3_type2_seamless/dc3_leaf1_qfx5120-48y 1
 *   dc1-dc3_type2_seamless/dc3_leaf2_qfx5120-48y 1
 *   total 2
 * Pair with: none
 * Variables (example values from dc1-dc3_type2_seamless/dc3_leaf1_qfx5120-48y):
 *   $INTERCONNECT_PEER_GW_1  e.g. 192.168.253.0
 *   $INTERCONNECT_PEER_GW_2  e.g. 192.168.253.1
 */
protocols {
    evpn {
        no-core-isolation;
        interconnect-multihoming-peer-gateways [ $INTERCONNECT_PEER_GW_1 $INTERCONNECT_PEER_GW_2 ];
    }
}
