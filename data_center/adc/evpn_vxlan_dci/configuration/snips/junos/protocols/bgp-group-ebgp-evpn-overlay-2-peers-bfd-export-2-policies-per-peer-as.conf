 *   EVO: (none)
 * Count:
 *   dc1-dc2_ott/dc1_esi-leaf1_qfx5120-48y 1
 *   dc1-dc2_ott/dc1_esi-leaf2_qfx5120-48y 1
 *   dc1-dc2_ott/dc1_server-leaf1_qfx5120-48y 1
 *   dc1-dc2_ott/dc2_esi-leaf1_qfx5120-48y 1
 *   dc1-dc2_ott/dc2_esi-leaf2_qfx5120-48y 1
 *   dc1-dc2_ott/dc2_server-leaf1_qfx5120-48y 1
 *   dc1-dc3_type2_seamless/dc1_leaf1_qfx5120-48y 1
 *   dc1-dc3_type2_seamless/dc1_leaf2_qfx5120-48y 1
 *   dc1-dc3_type2_seamless/dc1_leaf3_qfx5120-48y 1
 *   dc1-dc4_type2_type5_seamless/dc1_leaf1_qfx5120-48y 1
 *   dc1-dc4_type2_type5_seamless/dc1_leaf2_qfx5120-48y 1
 *   dc1-dc4_type2_type5_seamless/dc1_leaf3_qfx5120-48y 1
 *   dc1-dc4_type2_type5_seamless/dc4_compute-leaf1_qfx5120-48ym 1
 *   dc1-dc4_type2_type5_seamless/dc4_compute-leaf2_qfx5120-48ym 1
 *   total 14
 * Pair with: none
 * Variables (example values from dc1-dc2_ott/dc1_esi-leaf1_qfx5120-48y):
 *   $BGP_GROUP          e.g. l3clos-l-evpn
 *   $OVERLAY_PEER_V4_1  e.g. 192.168.255.0
 *   $DESCRIPTION_1      e.g. facing_spine1-evpn-overlay
 *   $LOOPBACK_V4        e.g. 192.168.255.4
 *   $BGP_EXPORT_POL_1   e.g. LEAF_TO_SPINE_EVPN_OUT
 *   $BGP_EXPORT_POL_2   e.g. EVPN_EXPORT
 *   $ASN_FABRIC_PEER_1  e.g. 64512
 *   $OVERLAY_PEER_V4_2  e.g. 192.168.255.1
 *   $DESCRIPTION_2      e.g. facing_spine2-evpn-overlay
 *   $ASN_FABRIC_PEER_2  e.g. 64513
 */
protocols {
    bgp {
        group $BGP_GROUP {
            type external;
            multihop {
                ttl 1;
                no-nexthop-change;
            }
            family evpn {
                signaling {
                    loops 2;
                }
            }
            multipath {
                multiple-as;
            }
            bfd-liveness-detection {
                minimum-interval 3000;
                multiplier 3;
            }
            neighbor $OVERLAY_PEER_V4_1 {
                description $DESCRIPTION_1;
                local-address $LOOPBACK_V4;
                family evpn {
                    signaling;
                }
                export ( $BGP_EXPORT_POL_1 && $BGP_EXPORT_POL_2 );
                peer-as $ASN_FABRIC_PEER_1;
            }
            neighbor $OVERLAY_PEER_V4_2 {
                description $DESCRIPTION_2;
                local-address $LOOPBACK_V4;
                family evpn {
                    signaling;
                }
                export ( $BGP_EXPORT_POL_1 && $BGP_EXPORT_POL_2 );
                peer-as $ASN_FABRIC_PEER_2;
            }
            vpn-apply-export;
        }
    }
}
