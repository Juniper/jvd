/*
 * Topic: Spine eBGP EVPN overlay group with five leaf loopback peers, each in its own AS, BFD and one export policy
 * Seen on:
 *   Junos: dc1-dc2_ott/dc2_spine1_qfx5120-48y-8c dc1-dc2_ott/dc2_spine2_qfx5120-48y-8c
 *   EVO: (none)
 * Count:
 *   dc1-dc2_ott/dc2_spine1_qfx5120-48y-8c 1
 *   dc1-dc2_ott/dc2_spine2_qfx5120-48y-8c 1
 *   total 2
 * Pair with: none
 * Peers with:
 *   [dc1-dc2_ott/dc2_borderleaf1_qfx5700] <-> [dc1-dc2_ott/dc2_spine1_qfx5120-48y-8c]
 *   [dc1-dc2_ott/dc2_borderleaf1_qfx5700] <-> [dc1-dc2_ott/dc2_spine2_qfx5120-48y-8c]
 *   [dc1-dc2_ott/dc2_borderleaf2_qfx5700] <-> [dc1-dc2_ott/dc2_spine1_qfx5120-48y-8c]
 *   [dc1-dc2_ott/dc2_borderleaf2_qfx5700] <-> [dc1-dc2_ott/dc2_spine2_qfx5120-48y-8c]
 *   [dc1-dc2_ott/dc2_esi-leaf1_qfx5120-48y] <-> [dc1-dc2_ott/dc2_spine1_qfx5120-48y-8c]
 *   [dc1-dc2_ott/dc2_esi-leaf1_qfx5120-48y] <-> [dc1-dc2_ott/dc2_spine2_qfx5120-48y-8c]
 *   [dc1-dc2_ott/dc2_esi-leaf2_qfx5120-48y] <-> [dc1-dc2_ott/dc2_spine1_qfx5120-48y-8c]
 *   [dc1-dc2_ott/dc2_esi-leaf2_qfx5120-48y] <-> [dc1-dc2_ott/dc2_spine2_qfx5120-48y-8c]
 *   [dc1-dc2_ott/dc2_server-leaf1_qfx5120-48y] <-> [dc1-dc2_ott/dc2_spine1_qfx5120-48y-8c]
 *   [dc1-dc2_ott/dc2_server-leaf1_qfx5120-48y] <-> [dc1-dc2_ott/dc2_spine2_qfx5120-48y-8c]
 * Variables (example values from dc1-dc2_ott/dc2_spine1_qfx5120-48y-8c):
 *   $BGP_GROUP          e.g. l3clos-s-evpn
 *   $OVERLAY_PEER_V4_1  e.g. 192.168.254.2
 *   $DESCRIPTION_1      e.g. facing_dc2-borderleaf-001-leaf1-evpn-overlay
 *   $LOOPBACK_V4        e.g. 192.168.254.0
 *   $BGP_EXPORT_POL     e.g. SPINE_TO_LEAF_EVPN_OUT
 *   $ASN_FABRIC_PEER_1  e.g. 65105
 *   $OVERLAY_PEER_V4_2  e.g. 192.168.254.3
 *   $DESCRIPTION_2      e.g. facing_dc2-borderleaf-001-leaf2-evpn-overlay
 *   $ASN_FABRIC_PEER_2  e.g. 65106
 *   $OVERLAY_PEER_V4_3  e.g. 192.168.254.4
 *   $DESCRIPTION_3      e.g. facing_dc2-esi-001-leaf1-evpn-overlay
 *   $ASN_FABRIC_PEER_3  e.g. 65103
 *   $OVERLAY_PEER_V4_4  e.g. 192.168.254.5
 *   $DESCRIPTION_4      e.g. facing_dc2-esi-001-leaf2-evpn-overlay
 *   $ASN_FABRIC_PEER_4  e.g. 65104
 *   $OVERLAY_PEER_V4_5  e.g. 192.168.254.6
 *   $DESCRIPTION_5      e.g. facing_dc2-single-001-leaf1-evpn-overlay
 *   $ASN_FABRIC_PEER_5  e.g. 65102
 */
protocols {
    bgp {
        group $BGP_GROUP {
            type external;
            multihop {
                ttl 1;
                no-nexthop-change;
            }
            family evpn {
                signaling {
                    loops 2;
                }
            }
            multipath {
                multiple-as;
            }
            bfd-liveness-detection {
                minimum-interval 3000;
                multiplier 3;
            }
            neighbor $OVERLAY_PEER_V4_1 {
                description $DESCRIPTION_1;
                local-address $LOOPBACK_V4;
                family evpn {
                    signaling;
                }
                export ( $BGP_EXPORT_POL );
                peer-as $ASN_FABRIC_PEER_1;
            }
            neighbor $OVERLAY_PEER_V4_2 {
                description $DESCRIPTION_2;
                local-address $LOOPBACK_V4;
                family evpn {
                    signaling;
                }
                export ( $BGP_EXPORT_POL );
                peer-as $ASN_FABRIC_PEER_2;
            }
            neighbor $OVERLAY_PEER_V4_3 {
                description $DESCRIPTION_3;
                local-address $LOOPBACK_V4;
                family evpn {
                    signaling;
                }
                export ( $BGP_EXPORT_POL );
                peer-as $ASN_FABRIC_PEER_3;
            }
            neighbor $OVERLAY_PEER_V4_4 {
                description $DESCRIPTION_4;
                local-address $LOOPBACK_V4;
                family evpn {
                    signaling;
                }
                export ( $BGP_EXPORT_POL );
                peer-as $ASN_FABRIC_PEER_4;
            }
            neighbor $OVERLAY_PEER_V4_5 {
                description $DESCRIPTION_5;
                local-address $LOOPBACK_V4;
                family evpn {
                    signaling;
                }
                export ( $BGP_EXPORT_POL );
                peer-as $ASN_FABRIC_PEER_5;
            }
            vpn-apply-export;
        }
    }
}
