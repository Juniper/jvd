routing-instances {
    $INSTANCE_NAME {
        instance-type vrf;
        routing-options {
            rib $INSTANCE_NAME.inet6.0 {
                multipath;
            }
            graceful-restart;
            multipath;
            auto-export;
        }
        protocols {
            evpn {
                ip-prefix-routes {
                    advertise direct-nexthop;
                    encapsulation vxlan;
                    vni $VNI;
                    export $IP_PREFIX_EXPORT_POL;
                }
            }
        }
        forwarding-options {
            dhcp-relay {
                forward-only;
                server-group {
                    red {
                        $DHCP_SERVER_V4;
                    }
                }
                group $DHCP_RELAY_GROUP {
                    active-server-group red;
                    relay-option-82 {
                        server-id-override;
                    }
                }
            }
        }
        interface $IRB_IFL_1;
        interface $IRB_IFL_2;
        interface $IRB_IFL_3;
        interface $IRB_IFL_4;
        interface $IRB_IFL_5;
        interface $IRB_IFL_6;
        interface $IRB_IFL_7;
        interface $IRB_IFL_8;
        interface $IRB_IFL_9;
        interface $IRB_IFL_10;
        interface $IRB_IFL_11;
        interface $IRB_IFL_12;
        interface $IRB_IFL_13;
        interface $IRB_IFL_14;
        interface $IRB_IFL_15;
        interface $IRB_IFL_16;
        interface $IRB_IFL_17;
        interface $IRB_IFL_18;
        interface $IRB_IFL_19;
        interface $IRB_IFL_20;
        interface $LOOPBACK_IFL;
        route-distinguisher $LOOPBACK_V4:2;
        vrf-target target:20001:1;
    }
}
