/*
 * Topic: Border EVPN Type 5 VRF with eBGP (IPv4) to the external router, ten IRB units and a loopback unit (red tenant)
 * Seen on:
 *   Junos: dc1-dc3_type2_seamless/dc3_leaf1_qfx5120-48y dc1-dc3_type2_seamless/dc3_leaf2_qfx5120-48y
 *   EVO: (none)
 * Count:
 *   dc1-dc3_type2_seamless/dc3_leaf1_qfx5120-48y 1
 *   dc1-dc3_type2_seamless/dc3_leaf2_qfx5120-48y 1
 *   total 2
 * Pair with: none
 * Variables (example values from dc1-dc3_type2_seamless/dc3_leaf1_qfx5120-48y):
 *   $INSTANCE_NAME         e.g. red
 *   $BGP_GROUP             e.g. l3rtr
 *   $CE_PEER_V4            e.g. 10.200.2.1
 *   $DESCRIPTION           e.g. facing_dc3-rack-001-sys004
 *   $PE_LOCAL_V4           e.g. 10.200.2.0
 *   $BGP_IMPORT_POL        e.g. RoutesFromExt-red-external_router
 *   $BGP_EXPORT_POL        e.g. RoutesToExt-red-external_router
 *   $ASN_CUSTOMER          e.g. 65000
 *   $VNI                   e.g. 13100
 *   $IP_PREFIX_EXPORT_POL  e.g. BGP-AOS-Policy-red
 *   $AC_IFL                e.g. xe-0/0/10.199
 *   $IRB_IFL_1             e.g. irb.400
 *   $IRB_IFL_2             e.g. irb.401
 *   $IRB_IFL_3             e.g. irb.402
 *   $IRB_IFL_4             e.g. irb.403
 *   $IRB_IFL_5             e.g. irb.404
 *   $IRB_IFL_6             e.g. irb.405
 *   $IRB_IFL_7             e.g. irb.406
 *   $IRB_IFL_8             e.g. irb.407
 *   $IRB_IFL_9             e.g. irb.408
 *   $IRB_IFL_10            e.g. irb.409
 *   $LOOPBACK_IFL          e.g. lo0.2
 *   $LOOPBACK_V4           e.g. 192.168.253.0
 */
routing-instances {
    $INSTANCE_NAME {
        instance-type vrf;
        routing-options {
            rib $INSTANCE_NAME.inet6.0 {
                multipath;
            }
            graceful-restart;
            multipath;
            auto-export;
        }
        protocols {
            bgp {
                group $BGP_GROUP {
                    type external;
                    multihop {
                        ttl 1;
                    }
                    family inet {
                        unicast {
                            loops 2;
                        }
                    }
                    family inet6 {
                        unicast {
                            loops 2;
                        }
                    }
                    multipath {
                        multiple-as;
                    }
                    neighbor $CE_PEER_V4 {
                        description $DESCRIPTION;
                        multihop {
                            ttl 2;
                        }
                        local-address $PE_LOCAL_V4;
                        import ( $BGP_IMPORT_POL );
                        family inet {
                            unicast;
                        }
                        export ( $BGP_EXPORT_POL );
                        peer-as $ASN_CUSTOMER;
                    }
                }
                graceful-restart {
                    dont-help-shared-fate-bfd-down;
                }
            }
            evpn {
                ip-prefix-routes {
                    advertise direct-nexthop;
                    encapsulation vxlan;
                    vni $VNI;
                    export $IP_PREFIX_EXPORT_POL;
                }
            }
        }
        interface $AC_IFL;
        interface $IRB_IFL_1;
        interface $IRB_IFL_2;
        interface $IRB_IFL_3;
        interface $IRB_IFL_4;
        interface $IRB_IFL_5;
        interface $IRB_IFL_6;
        interface $IRB_IFL_7;
        interface $IRB_IFL_8;
        interface $IRB_IFL_9;
        interface $IRB_IFL_10;
        interface $LOOPBACK_IFL;
        route-distinguisher $LOOPBACK_V4:3100;
        vrf-target target:13100:1;
    }
}
