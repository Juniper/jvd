/*
 * Topic: EVPN Type 5 VRF with DHCP relay (loopback as relay source), ten IRB units and a loopback unit (blue tenant)
 * Seen on:
 *   Junos: dc1-dc3_type2_seamless/dc1_leaf1_qfx5120-48y dc1-dc3_type2_seamless/dc1_leaf2_qfx5120-48y dc1-dc3_type2_seamless/dc1_leaf3_qfx5120-48y
 *   EVO: (none)
 * Count:
 *   dc1-dc3_type2_seamless/dc1_leaf1_qfx5120-48y 1
 *   dc1-dc3_type2_seamless/dc1_leaf2_qfx5120-48y 1
 *   dc1-dc3_type2_seamless/dc1_leaf3_qfx5120-48y 1
 *   total 3
 * Pair with: none
 * Variables (example values from dc1-dc3_type2_seamless/dc1_leaf1_qfx5120-48y):
 *   $INSTANCE_NAME         e.g. blue
 *   $VNI                   e.g. 20002
 *   $IP_PREFIX_EXPORT_POL  e.g. BGP-AOS-Policy-blue
 *   $DHCP_RELAY_GROUP      e.g. blue
 *   $IRB_IFL_1             e.g. irb.1400
 *   $LOOPBACK_IFL          e.g. lo0.2
 *   $IRB_IFL_2             e.g. irb.1401
 *   $IRB_IFL_3             e.g. irb.1402
 *   $IRB_IFL_4             e.g. irb.1403
 *   $IRB_IFL_5             e.g. irb.1404
 *   $IRB_IFL_6             e.g. irb.1405
 *   $IRB_IFL_7             e.g. irb.1406
 *   $IRB_IFL_8             e.g. irb.1407
 *   $IRB_IFL_9             e.g. irb.1408
 *   $IRB_IFL_10            e.g. irb.1409
 *   $LOOPBACK_V4           e.g. 192.168.255.6
 */
routing-instances {
    $INSTANCE_NAME {
        instance-type vrf;
        routing-options {
            rib $INSTANCE_NAME.inet6.0 {
                multipath;
            }
            graceful-restart;
            multipath;
            auto-export;
        }
        protocols {
            evpn {
                ip-prefix-routes {
                    advertise direct-nexthop;
                    encapsulation vxlan;
                    vni $VNI;
                    export $IP_PREFIX_EXPORT_POL;
                }
            }
        }
        forwarding-options {
            dhcp-relay {
                forward-only;
                server-group {
                    blue {
                        10.10.0.200;
                    }
                }
                group $DHCP_RELAY_GROUP {
                    active-server-group blue;
                    relay-option-82 {
                        server-id-override;
                    }
                    interface $IRB_IFL_1 {
                        overrides {
                            relay-source $LOOPBACK_IFL;
                        }
                    }
                }
            }
        }
        interface $IRB_IFL_1;
        interface $IRB_IFL_2;
        interface $IRB_IFL_3;
        interface $IRB_IFL_4;
        interface $IRB_IFL_5;
        interface $IRB_IFL_6;
        interface $IRB_IFL_7;
        interface $IRB_IFL_8;
        interface $IRB_IFL_9;
        interface $IRB_IFL_10;
        interface $LOOPBACK_IFL;
        route-distinguisher $LOOPBACK_V4:3;
        vrf-target target:20002:1;
    }
}
