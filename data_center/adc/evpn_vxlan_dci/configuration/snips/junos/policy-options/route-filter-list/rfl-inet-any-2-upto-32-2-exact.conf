 *   dc1-dc3_type2_seamless/dc3_leaf2_qfx5120-48y 2
 *   total 4
 * Pair with: none
 * Peers with: n/a
 * Variables (example values from dc1-dc3_type2_seamless/dc3_leaf1_qfx5120-48y):
 *   $ROUTE_FILTER_LIST  e.g. RoutesToExt-red-external_router
 *   $PREFIX_1           e.g. 10.0.0.0/21
 *   $PREFIX_2           e.g. 10.0.8.0/23
