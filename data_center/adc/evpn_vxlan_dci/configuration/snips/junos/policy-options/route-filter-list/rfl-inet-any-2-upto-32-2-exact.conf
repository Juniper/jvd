 */
policy-options {
    route-filter-list $ROUTE_FILTER_LIST {
        0.0.0.0/0 prefix-length-range /1-/32;
        $PREFIX_1 upto /32;
        $PREFIX_2 upto /32;
        $PREFIX_3 exact;
