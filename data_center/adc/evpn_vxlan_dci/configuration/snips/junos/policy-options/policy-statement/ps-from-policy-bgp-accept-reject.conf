policy-options {
    policy-statement $BGP_EXPORT_POL {
        term $TERM_NAME_1 {
            from policy $POLICY_NAME;
            then accept;
        }
        term $TERM_NAME_2 {
            from protocol bgp;
            then accept;
        }
        term $TERM_NAME_3 {
            then reject;
        }
    }
}
