/*
 * Topic: Policy that accepts the routes another policy accepts and rejects everything else
 * Seen on:
 *   Junos: dc1-dc3_type2_seamless/dc1_leaf1_qfx5120-48y dc1-dc3_type2_seamless/dc1_leaf2_qfx5120-48y dc1-dc3_type2_seamless/dc1_leaf3_qfx5120-48y
 *   EVO: (none)
 * Count:
 *   dc1-dc3_type2_seamless/dc1_leaf1_qfx5120-48y 4
 *   dc1-dc3_type2_seamless/dc1_leaf2_qfx5120-48y 3
 *   dc1-dc3_type2_seamless/dc1_leaf3_qfx5120-48y 3
 *   total 10
 * Pair with: none
 * Peers with: n/a
 * Variables (example values from dc1-dc3_type2_seamless/dc1_leaf1_qfx5120-48y):
 *   $BGP_EXPORT_POL  e.g. BGP-AOS-Policy-blue
 *   $TERM_NAME_1     e.g. BGP-AOS-Policy-blue-10
 *   $POLICY_NAME     e.g. AllPodNetworks-blue
 *   $TERM_NAME_2     e.g. BGP-AOS-Policy-blue-100
 */
policy-options {
    policy-statement $BGP_EXPORT_POL {
        term $TERM_NAME_1 {
            from policy $POLICY_NAME;
            then accept;
        }
        term $TERM_NAME_2 {
            then reject;
        }
    }
}
