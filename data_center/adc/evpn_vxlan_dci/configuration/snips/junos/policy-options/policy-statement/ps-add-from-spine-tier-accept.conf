/*
 * Topic: Spine export policy that tags every route FROM_SPINE_FABRIC_TIER and accepts it
 * Seen on:
 *   Junos: dc1-dc2_ott/dc2_spine1_qfx5120-48y-8c dc1-dc2_ott/dc2_spine2_qfx5120-48y-8c dc1-dc4_type2_type5_seamless/dc4_compute-spine1_qfx5210-64c dc1-dc4_type2_type5_seamless/dc4_compute-spine2_qfx5210-64c dc1-dc4_type2_type5_seamless/dc4_services-spine1_qfx5210-64c dc1-dc4_type2_type5_seamless/dc4_services-spine2_qfx5210-64c
 *   EVO: (none)
 * Count:
 *   dc1-dc2_ott/dc2_spine1_qfx5120-48y-8c 1
 *   dc1-dc2_ott/dc2_spine2_qfx5120-48y-8c 1
 *   dc1-dc4_type2_type5_seamless/dc4_compute-spine1_qfx5210-64c 1
 *   dc1-dc4_type2_type5_seamless/dc4_compute-spine2_qfx5210-64c 1
 *   dc1-dc4_type2_type5_seamless/dc4_services-spine1_qfx5210-64c 1
 *   dc1-dc4_type2_type5_seamless/dc4_services-spine2_qfx5210-64c 1
 *   total 6
 * Pair with:
 *  - junos/policy-options/community/from-spine-fabric-tier.conf
 *
 * Peers with: n/a
 * Variables (example values from dc1-dc2_ott/dc2_spine1_qfx5120-48y-8c):
 *   $BGP_EXPORT_POL  e.g. SPINE_TO_LEAF_FABRIC_OUT
 *   $TERM_NAME       e.g. SPINE_TO_LEAF_FABRIC_OUT-10
 */
policy-options {
    policy-statement $BGP_EXPORT_POL {
        term $TERM_NAME {
            then {
                community add FROM_SPINE_FABRIC_TIER;
                accept;
            }
        }
    }
}
