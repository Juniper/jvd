/*
 * Topic: Spine export policy toward the superspines that rejects BGP routes tagged FROM_SUPERSPINE_FABRIC_TIER and accepts every other route
 * Seen on:
 *   Junos: dc1-dc4_type2_type5_seamless/dc4_compute-spine1_qfx5210-64c dc1-dc4_type2_type5_seamless/dc4_compute-spine2_qfx5210-64c dc1-dc4_type2_type5_seamless/dc4_services-spine1_qfx5210-64c dc1-dc4_type2_type5_seamless/dc4_services-spine2_qfx5210-64c
 *   EVO: (none)
 * Count:
 *   dc1-dc4_type2_type5_seamless/dc4_compute-spine1_qfx5210-64c 1
 *   dc1-dc4_type2_type5_seamless/dc4_compute-spine2_qfx5210-64c 1
 *   dc1-dc4_type2_type5_seamless/dc4_services-spine1_qfx5210-64c 1
 *   dc1-dc4_type2_type5_seamless/dc4_services-spine2_qfx5210-64c 1
 *   total 4
 * Pair with:
 *  - junos/policy-options/community/from-superspine-fabric-tier.conf
 *
 * Peers with: n/a
 * Variables (example values from dc1-dc4_type2_type5_seamless/dc4_compute-spine1_qfx5210-64c):
 *   $BGP_EXPORT_POL  e.g. SPINE_TO_SUPERSPINE_FABRIC_OUT
 *   $TERM_NAME_1     e.g. SPINE_TO_SUPERSPINE_FABRIC_OUT-10
 *   $TERM_NAME_2     e.g. SPINE_TO_SUPERSPINE_FABRIC_OUT-20
 */
policy-options {
    policy-statement $BGP_EXPORT_POL {
        term $TERM_NAME_1 {
            from {
                protocol bgp;
                community FROM_SUPERSPINE_FABRIC_TIER;
            }
            then reject;
        }
        term $TERM_NAME_2 {
            then accept;
        }
    }
}
