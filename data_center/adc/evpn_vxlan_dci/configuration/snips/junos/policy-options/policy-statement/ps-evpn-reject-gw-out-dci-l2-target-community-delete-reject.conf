/*
 * Topic: EVPN export policy toward the DCI gateway peers that rejects routes tagged EVPN_GW_OUT, accepts EVPN_DCI_L2_TARGET routes with FABRIC_COMMUNITIES removed, and rejects other EVPN routes
 * Seen on:
 *   Junos: dc1-dc3_type2_seamless/dc3_leaf1_qfx5120-48y dc1-dc3_type2_seamless/dc3_leaf2_qfx5120-48y
 *   EVO: (none)
 * Count:
 *   dc1-dc3_type2_seamless/dc3_leaf1_qfx5120-48y 1
 *   dc1-dc3_type2_seamless/dc3_leaf2_qfx5120-48y 1
 *   total 2
 * Pair with:
 *  - junos/policy-options/community/cm-instance-target.conf
 *  - junos/policy-options/community/evpn-gw-out.conf
 *  - junos/policy-options/community/fabric-communities.conf
 *
 * Peers with: n/a
 * Variables (example values from dc1-dc3_type2_seamless/dc3_leaf1_qfx5120-48y):
 *   $BGP_EXPORT_POL  e.g. EVPN_GW_OUT
 *   $TERM_NAME_1     e.g. EVPN_GW_OUT-10
 *   $TERM_NAME_2     e.g. EVPN_GW_OUT-20
 *   $TERM_NAME_3     e.g. EVPN_GW_OUT-30
 */
policy-options {
    policy-statement $BGP_EXPORT_POL {
        term $TERM_NAME_1 {
            from {
                family evpn;
                community EVPN_GW_OUT;
            }
            then reject;
        }
        term $TERM_NAME_2 {
            from {
                family evpn;
                community EVPN_DCI_L2_TARGET;
            }
            then {
                community delete FABRIC_COMMUNITIES;
                accept;
            }
        }
        term $TERM_NAME_3 {
            from family evpn;
            then reject;
        }
    }
}
