/*
 * Topic: EVPN Type 5 VRF with an EVPN interconnect toward the remote data center, ten IRB units and a loopback unit
 * Seen on:
 *   Junos: (none)
 *   EVO: dc1-dc4_type2_type5_seamless/dc1_borderleaf1_qfx5130-32cd dc1-dc4_type2_type5_seamless/dc1_borderleaf2_qfx5130-32cd dc1-dc4_type2_type5_seamless/dc4_services-leaf1_qfx5130-48c dc1-dc4_type2_type5_seamless/dc4_services-leaf2_qfx5130-48c
 * Count:
 *   dc1-dc4_type2_type5_seamless/dc1_borderleaf1_qfx5130-32cd 1
 *   dc1-dc4_type2_type5_seamless/dc1_borderleaf2_qfx5130-32cd 1
 *   dc1-dc4_type2_type5_seamless/dc4_services-leaf1_qfx5130-48c 1
 *   dc1-dc4_type2_type5_seamless/dc4_services-leaf2_qfx5130-48c 1
 *   total 4
 * Pair with: none
 * Variables (example values from dc1-dc4_type2_type5_seamless/dc1_borderleaf1_qfx5130-32cd):
 *   $INSTANCE_NAME         e.g. green
 *   $LOOPBACK_V4           e.g. 192.168.255.2
 *   $VNI                   e.g. 20004
 *   $IP_PREFIX_EXPORT_POL  e.g. BGP-AOS-Policy-green
 *   $IRB_IFL_1             e.g. irb.2700
 *   $IRB_IFL_2             e.g. irb.2701
 *   $IRB_IFL_3             e.g. irb.2702
 *   $IRB_IFL_4             e.g. irb.2703
 *   $IRB_IFL_5             e.g. irb.2704
 *   $IRB_IFL_6             e.g. irb.2705
 *   $IRB_IFL_7             e.g. irb.2706
 *   $IRB_IFL_8             e.g. irb.2707
 *   $IRB_IFL_9             e.g. irb.2708
 *   $IRB_IFL_10            e.g. irb.2709
 *   $LOOPBACK_IFL          e.g. lo0.4
 */
routing-instances {
    $INSTANCE_NAME {
        instance-type vrf;
        routing-options {
            rib $INSTANCE_NAME.inet6.0 {
                multipath;
            }
            graceful-restart;
            multipath;
            auto-export;
        }
        protocols {
            evpn {
                interconnect {
                    vrf-target target:65655L:3333;
                    route-distinguisher $LOOPBACK_V4:65529;
                }
                ip-prefix-routes {
                    advertise direct-nexthop;
                    encapsulation vxlan;
                    vni $VNI;
                    export $IP_PREFIX_EXPORT_POL;
                }
            }
        }
        interface $IRB_IFL_1;
        interface $IRB_IFL_2;
        interface $IRB_IFL_3;
        interface $IRB_IFL_4;
        interface $IRB_IFL_5;
        interface $IRB_IFL_6;
        interface $IRB_IFL_7;
        interface $IRB_IFL_8;
        interface $IRB_IFL_9;
        interface $IRB_IFL_10;
        interface $LOOPBACK_IFL;
        route-distinguisher $LOOPBACK_V4:4;
        vrf-target target:20004:1;
    }
}
