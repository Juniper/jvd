/*
 * Topic: Border EVPN Type 5 VRF with eBGP (IPv4 and IPv6) to the external router, an EVPN interconnect toward the remote data center, DHCP relay, twenty IRB units and a loopback unit (blue tenant)
 * Seen on:
 *   Junos: (none)
 *   EVO: dc1-dc4_type2_type5_seamless/dc1_borderleaf1_qfx5130-32cd dc1-dc4_type2_type5_seamless/dc1_borderleaf2_qfx5130-32cd dc1-dc4_type2_type5_seamless/dc4_services-leaf1_qfx5130-48c dc1-dc4_type2_type5_seamless/dc4_services-leaf2_qfx5130-48c
 * Count:
 *   dc1-dc4_type2_type5_seamless/dc1_borderleaf1_qfx5130-32cd 1
 *   dc1-dc4_type2_type5_seamless/dc1_borderleaf2_qfx5130-32cd 1
 *   dc1-dc4_type2_type5_seamless/dc4_services-leaf1_qfx5130-48c 1
 *   dc1-dc4_type2_type5_seamless/dc4_services-leaf2_qfx5130-48c 1
 *   total 4
 * Pair with: none
 * Variables (example values from dc1-dc4_type2_type5_seamless/dc1_borderleaf1_qfx5130-32cd):
 *   $INSTANCE_NAME         e.g. blue
 *   $BGP_GROUP             e.g. l3rtr
 *   $CE_PEER_V6            e.g. 2001:db8:dc1:10:200::5
 *   $DESCRIPTION           e.g. facing_dc1-borderleaf-001-sys001
 *   $PE_LOCAL_V6           e.g. 2001:db8:dc1:10:200::4
 *   $BGP_IMPORT_POL        e.g. RoutesFromExt-blue-external_router
 *   $BGP_EXPORT_POL        e.g. RoutesToExt-blue-external_router
 *   $ASN_CUSTOMER          e.g. 65000
 *   $CE_PEER_V4            e.g. 10.200.0.5
 *   $PE_LOCAL_V4           e.g. 10.200.0.4
 *   $LOOPBACK_V4           e.g. 192.168.255.2
 *   $VNI                   e.g. 20002
 *   $IP_PREFIX_EXPORT_POL  e.g. BGP-AOS-Policy-blue
 *   $DHCP_RELAY_GROUP      e.g. blue
 *   $AC_IFL                e.g. et-0/0/8:0.299
 *   $IRB_IFL_1             e.g. irb.1400
 *   $IRB_IFL_2             e.g. irb.1401
 *   $IRB_IFL_3             e.g. irb.1402
 *   $IRB_IFL_4             e.g. irb.1403
 *   $IRB_IFL_5             e.g. irb.1404
 *   $IRB_IFL_6             e.g. irb.1405
 *   $IRB_IFL_7             e.g. irb.1406
 *   $IRB_IFL_8             e.g. irb.1407
 *   $IRB_IFL_9             e.g. irb.1408
 *   $IRB_IFL_10            e.g. irb.1409
 *   $IRB_IFL_11            e.g. irb.1600
 *   $IRB_IFL_12            e.g. irb.1601
 *   $IRB_IFL_13            e.g. irb.1602
 *   $IRB_IFL_14            e.g. irb.1603
 *   $IRB_IFL_15            e.g. irb.1604
 *   $IRB_IFL_16            e.g. irb.1605
 *   $IRB_IFL_17            e.g. irb.1606
 *   $IRB_IFL_18            e.g. irb.1607
 *   $IRB_IFL_19            e.g. irb.1608
 *   $IRB_IFL_20            e.g. irb.1609
 *   $LOOPBACK_IFL          e.g. lo0.2
 */
routing-instances {
    $INSTANCE_NAME {
        instance-type vrf;
        routing-options {
            rib $INSTANCE_NAME.inet6.0 {
                multipath;
            }
            graceful-restart;
            multipath;
            auto-export;
        }
        protocols {
            bgp {
                group $BGP_GROUP {
                    type external;
                    multihop {
                        ttl 1;
                    }
                    family inet {
                        unicast {
                            loops 2;
                        }
                    }
                    family inet6 {
                        unicast {
                            loops 2;
                        }
                    }
                    multipath {
                        multiple-as;
                    }
                    neighbor $CE_PEER_V6 {
                        description $DESCRIPTION;
                        multihop {
                            ttl 2;
                        }
                        local-address $PE_LOCAL_V6;
                        import ( $BGP_IMPORT_POL );
                        family inet6 {
                            unicast;
                        }
                        export ( $BGP_EXPORT_POL );
                        peer-as $ASN_CUSTOMER;
                    }
                    neighbor $CE_PEER_V4 {
                        description $DESCRIPTION;
                        multihop {
                            ttl 2;
                        }
                        local-address $PE_LOCAL_V4;
                        import ( $BGP_IMPORT_POL );
                        family inet {
                            unicast;
                        }
                        export ( $BGP_EXPORT_POL );
                        peer-as $ASN_CUSTOMER;
                    }
                }
                graceful-restart {
                    dont-help-shared-fate-bfd-down;
                }
            }
            evpn {
                interconnect {
                    vrf-target target:65655L:2222;
                    route-distinguisher $LOOPBACK_V4:65530;
                }
                ip-prefix-routes {
                    advertise direct-nexthop;
                    encapsulation vxlan;
                    vni $VNI;
                    export $IP_PREFIX_EXPORT_POL;
                }
            }
        }
        forwarding-options {
            dhcp-relay {
                forward-only;
                server-group {
                    blue {
                        10.10.0.200;
                    }
                }
                group $DHCP_RELAY_GROUP {
                    active-server-group blue;
                    relay-option-82 {
                        server-id-override;
                    }
                }
            }
        }
        interface $AC_IFL;
        interface $IRB_IFL_1;
        interface $IRB_IFL_2;
        interface $IRB_IFL_3;
        interface $IRB_IFL_4;
        interface $IRB_IFL_5;
        interface $IRB_IFL_6;
        interface $IRB_IFL_7;
        interface $IRB_IFL_8;
        interface $IRB_IFL_9;
        interface $IRB_IFL_10;
        interface $IRB_IFL_11;
        interface $IRB_IFL_12;
        interface $IRB_IFL_13;
        interface $IRB_IFL_14;
        interface $IRB_IFL_15;
        interface $IRB_IFL_16;
        interface $IRB_IFL_17;
        interface $IRB_IFL_18;
        interface $IRB_IFL_19;
        interface $IRB_IFL_20;
        interface $LOOPBACK_IFL;
        route-distinguisher $LOOPBACK_V4:3;
        vrf-target target:20002:1;
    }
}
