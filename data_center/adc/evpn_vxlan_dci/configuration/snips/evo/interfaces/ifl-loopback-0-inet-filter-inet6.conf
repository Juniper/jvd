interfaces {
    lo0 {
        unit 0 {
            family inet {
                filter {
                    input cpp-filter-v1;
                }
                address $LOOPBACK_V4_PFX;
            }
            family inet6 {
                address $LOOPBACK_V6_PFX;
            }
        }
    }
}
