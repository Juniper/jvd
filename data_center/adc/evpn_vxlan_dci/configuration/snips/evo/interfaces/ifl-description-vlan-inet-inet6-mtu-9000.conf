/*
 * Topic: VLAN-tagged unit with a description, an IPv4 and an IPv6 address and a 9000-byte family MTU
 * Seen on:
 *   Junos: (none)
 *   EVO: dc1-dc2_ott/dc1_borderleaf1_qfx5130-32cd dc1-dc2_ott/dc1_borderleaf2_qfx5130-32cd dc1-dc2_ott/dc2_borderleaf1_qfx5700 dc1-dc2_ott/dc2_borderleaf2_qfx5700
 * Count:
 *   dc1-dc2_ott/dc1_borderleaf1_qfx5130-32cd 1
 *   dc1-dc2_ott/dc1_borderleaf2_qfx5130-32cd 1
 *   dc1-dc2_ott/dc2_borderleaf1_qfx5700 1
 *   dc1-dc2_ott/dc2_borderleaf2_qfx5700 1
 *   total 4
 * Pair with: none
 * Peers with: n/a
 * Variables (example values from dc1-dc2_ott/dc1_borderleaf1_qfx5130-32cd):
 *   $AC_INTF      e.g. et-0/0/12:2
 *   $UNIT         e.g. 3000
 *   $DESCRIPTION  e.g. "VRF default to BL1_DCI_link1"
 *   $VLAN         e.g. 3000
 *   $AC_ADDR_V4   e.g. 172.17.10.1/24
 *   $AC_ADDR_V6   e.g. 2001:db8:dc1:17:10::1/80
 */
interfaces {
    $AC_INTF {
        unit $UNIT {
            description $DESCRIPTION;
            vlan-id $VLAN;
            family inet {
                mtu 9000;
                address $AC_ADDR_V4;
            }
            family inet6 {
                mtu 9000;
                address $AC_ADDR_V6;
            }
        }
    }
}
