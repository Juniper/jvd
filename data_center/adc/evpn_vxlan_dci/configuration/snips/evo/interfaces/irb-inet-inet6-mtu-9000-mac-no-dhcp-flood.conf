/*
 * Topic: IRB unit with IPv4 and IPv6 gateway addresses, a 9000-byte family MTU, a MAC address and no DHCP flooding
 * Seen on:
 *   Junos: (none)
 *   EVO: dc1-dc3_type2_seamless/dc1_borderleaf1_qfx5130-32cd dc1-dc3_type2_seamless/dc1_borderleaf2_qfx5130-32cd
 * Count:
 *   dc1-dc3_type2_seamless/dc1_borderleaf1_qfx5130-32cd 2
 *   dc1-dc3_type2_seamless/dc1_borderleaf2_qfx5130-32cd 2
 *   total 4
 * Pair with: none
 * Peers with: n/a
 * Variables (example values from dc1-dc3_type2_seamless/dc1_borderleaf1_qfx5130-32cd):
 *   $IRB_UNIT     e.g. 400
 *   $IRB_ADDR     e.g. 10.0.0.1/24
 *   $IRB_ADDR_V6  e.g. 2001:db8:dc1:10:00:00::1/96
 *   $IRB_MAC      e.g. 00:1c:73:00:00:01
 */
interfaces {
    irb {
        unit $IRB_UNIT {
            family inet {
                mtu 9000;
                address $IRB_ADDR;
            }
            family inet6 {
                mtu 9000;
                address $IRB_ADDR_V6;
            }
            mac $IRB_MAC;
            no-dhcp-flood;
        }
    }
}
