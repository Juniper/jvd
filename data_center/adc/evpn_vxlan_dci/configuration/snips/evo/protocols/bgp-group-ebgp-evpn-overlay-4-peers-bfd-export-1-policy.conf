/*
 * Topic: Spine eBGP EVPN overlay group with four loopback peers (two leaves and two superspines), BFD and one export policy per peer
 * Seen on:
 *   Junos: (none)
 *   EVO: dc1-dc4_type2_type5_seamless/dc4_storage-spine1_qfx5220-32cd dc1-dc4_type2_type5_seamless/dc4_storage-spine2_qfx5220-32cd
 * Count:
 *   dc1-dc4_type2_type5_seamless/dc4_storage-spine1_qfx5220-32cd 1
 *   dc1-dc4_type2_type5_seamless/dc4_storage-spine2_qfx5220-32cd 1
 *   total 2
 * Pair with: none
 * Peers with:
 *   [dc1-dc4_type2_type5_seamless/dc4_storage-leaf1_qfx5130-32cd] <-> [dc1-dc4_type2_type5_seamless/dc4_storage-spine1_qfx5220-32cd]
 *   [dc1-dc4_type2_type5_seamless/dc4_storage-leaf1_qfx5130-32cd] <-> [dc1-dc4_type2_type5_seamless/dc4_storage-spine2_qfx5220-32cd]
 *   [dc1-dc4_type2_type5_seamless/dc4_storage-leaf2_qfx5130-32cd] <-> [dc1-dc4_type2_type5_seamless/dc4_storage-spine1_qfx5220-32cd]
 *   [dc1-dc4_type2_type5_seamless/dc4_storage-leaf2_qfx5130-32cd] <-> [dc1-dc4_type2_type5_seamless/dc4_storage-spine2_qfx5220-32cd]
 *   [dc1-dc4_type2_type5_seamless/dc4_storage-spine1_qfx5220-32cd] <-> [dc1-dc4_type2_type5_seamless/dc4_superspine1_qfx5230-64cd]
 *   [dc1-dc4_type2_type5_seamless/dc4_storage-spine1_qfx5220-32cd] <-> [dc1-dc4_type2_type5_seamless/dc4_superspine2_qfx5230-64cd]
 *   [dc1-dc4_type2_type5_seamless/dc4_storage-spine2_qfx5220-32cd] <-> [dc1-dc4_type2_type5_seamless/dc4_superspine1_qfx5230-64cd]
 *   [dc1-dc4_type2_type5_seamless/dc4_storage-spine2_qfx5220-32cd] <-> [dc1-dc4_type2_type5_seamless/dc4_superspine2_qfx5230-64cd]
 * Variables (example values from dc1-dc4_type2_type5_seamless/dc4_storage-spine1_qfx5220-32cd):
 *   $BGP_GROUP          e.g. l3clos-s-evpn
 *   $OVERLAY_PEER_V4_1  e.g. 192.168.252.10
 *   $DESCRIPTION_1      e.g. facing_leaf003-001-1-evpn-overlay
 *   $LOOPBACK_V4        e.g. 192.168.252.4
 *   $BGP_EXPORT_POL_1   e.g. SPINE_TO_LEAF_EVPN_OUT
 *   $ASN_FABRIC_PEER_1  e.g. 64712
 *   $OVERLAY_PEER_V4_2  e.g. 192.168.252.11
 *   $DESCRIPTION_2      e.g. facing_leaf003-001-2-evpn-overlay
 *   $ASN_FABRIC_PEER_2  e.g. 64713
 *   $OVERLAY_PEER_V4_3  e.g. 192.168.252.12
 *   $DESCRIPTION_3      e.g. facing_sspine001-1-evpn-overlay
 *   $BGP_EXPORT_POL_2   e.g. SPINE_TO_SUPERSPINE_EVPN_OUT
 *   $ASN_FABRIC_PEER_3  e.g. 64701
 *   $OVERLAY_PEER_V4_4  e.g. 192.168.252.13
 *   $DESCRIPTION_4      e.g. facing_sspine001-2-evpn-overlay
 */
protocols {
    bgp {
        group $BGP_GROUP {
            type external;
            multihop {
                ttl 1;
                no-nexthop-change;
            }
            family evpn {
                signaling {
                    loops 2;
                }
            }
            multipath {
                multiple-as;
            }
            bfd-liveness-detection {
                minimum-interval 3000;
                multiplier 3;
            }
            neighbor $OVERLAY_PEER_V4_1 {
                description $DESCRIPTION_1;
                local-address $LOOPBACK_V4;
                family evpn {
                    signaling;
                }
                export ( $BGP_EXPORT_POL_1 );
                peer-as $ASN_FABRIC_PEER_1;
            }
            neighbor $OVERLAY_PEER_V4_2 {
                description $DESCRIPTION_2;
                local-address $LOOPBACK_V4;
                family evpn {
                    signaling;
                }
                export ( $BGP_EXPORT_POL_1 );
                peer-as $ASN_FABRIC_PEER_2;
            }
            neighbor $OVERLAY_PEER_V4_3 {
                description $DESCRIPTION_3;
                local-address $LOOPBACK_V4;
                family evpn {
                    signaling;
                }
                export ( $BGP_EXPORT_POL_2 );
                peer-as $ASN_FABRIC_PEER_3;
            }
            neighbor $OVERLAY_PEER_V4_4 {
                description $DESCRIPTION_4;
                local-address $LOOPBACK_V4;
                family evpn {
                    signaling;
                }
                export ( $BGP_EXPORT_POL_2 );
                peer-as $ASN_FABRIC_PEER_3;
            }
            vpn-apply-export;
        }
    }
}
