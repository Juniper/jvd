 *   dc1-dc4_type2_type5_seamless/dc4_services-leaf2_qfx5130-48c 1
 *   dc1-dc4_type2_type5_seamless/dc4_storage-leaf1_qfx5130-32cd 1
 *   dc1-dc4_type2_type5_seamless/dc4_storage-leaf2_qfx5130-32cd 1
 *   total 4
 * Pair with: none
 * Peers with:
 *   [dc1-dc4_type2_type5_seamless/dc4_services-leaf1_qfx5130-48c] <-> [dc1-dc4_type2_type5_seamless/dc4_services-spine1_qfx5210-64c]
 *   [dc1-dc4_type2_type5_seamless/dc4_services-leaf1_qfx5130-48c] <-> [dc1-dc4_type2_type5_seamless/dc4_services-spine2_qfx5210-64c]
 *   [dc1-dc4_type2_type5_seamless/dc4_services-leaf2_qfx5130-48c] <-> [dc1-dc4_type2_type5_seamless/dc4_services-spine1_qfx5210-64c]
 *   [dc1-dc4_type2_type5_seamless/dc4_services-leaf2_qfx5130-48c] <-> [dc1-dc4_type2_type5_seamless/dc4_services-spine2_qfx5210-64c]
 *   [dc1-dc4_type2_type5_seamless/dc4_storage-leaf1_qfx5130-32cd] <-> [dc1-dc4_type2_type5_seamless/dc4_storage-spine1_qfx5220-32cd]
 *   [dc1-dc4_type2_type5_seamless/dc4_storage-leaf1_qfx5130-32cd] <-> [dc1-dc4_type2_type5_seamless/dc4_storage-spine2_qfx5220-32cd]
 *   [dc1-dc4_type2_type5_seamless/dc4_storage-leaf2_qfx5130-32cd] <-> [dc1-dc4_type2_type5_seamless/dc4_storage-spine1_qfx5220-32cd]
 *   [dc1-dc4_type2_type5_seamless/dc4_storage-leaf2_qfx5130-32cd] <-> [dc1-dc4_type2_type5_seamless/dc4_storage-spine2_qfx5220-32cd]
 * Variables (example values from dc1-dc4_type2_type5_seamless/dc4_services-leaf1_qfx5130-48c):
 *   $BGP_GROUP          e.g. l3clos-l-evpn
 *   $OVERLAY_PEER_V4_1  e.g. 192.168.252.2
 *   $DESCRIPTION_1      e.g. facing_spine002-001-1-evpn-overlay
 *   $LOOPBACK_V4        e.g. 192.168.252.8
 *   $BGP_EXPORT_POL_1   e.g. LEAF_TO_SPINE_EVPN_OUT
 *   $BGP_EXPORT_POL_2   e.g. EVPN_EXPORT
 *   $ASN_FABRIC_PEER    e.g. 64706
 *   $OVERLAY_PEER_V4_2  e.g. 192.168.252.3
 *   $DESCRIPTION_2      e.g. facing_spine002-001-2-evpn-overlay
 */
protocols {
    bgp {
        group $BGP_GROUP {
            type external;
            multihop {
                ttl 1;
                no-nexthop-change;
            }
            family evpn {
                signaling {
                    loops 2;
                }
            }
            multipath {
                multiple-as;
            }
            bfd-liveness-detection {
                minimum-interval 3000;
                multiplier 3;
            }
            neighbor $OVERLAY_PEER_V4_1 {
                description $DESCRIPTION_1;
                local-address $LOOPBACK_V4;
                family evpn {
                    signaling;
                }
                export ( $BGP_EXPORT_POL_1 && $BGP_EXPORT_POL_2 );
                peer-as $ASN_FABRIC_PEER;
            }
            neighbor $OVERLAY_PEER_V4_2 {
                description $DESCRIPTION_2;
                local-address $LOOPBACK_V4;
                family evpn {
                    signaling;
                }
                export ( $BGP_EXPORT_POL_1 && $BGP_EXPORT_POL_2 );
                peer-as $ASN_FABRIC_PEER;
            }
            vpn-apply-export;
        }
    }
}
