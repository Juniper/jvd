/*
 * Topic: Spine eBGP EVPN overlay group with five leaf loopback peers, each in its own AS, BFD and one export policy
 * Seen on:
 *   Junos: (none)
 *   EVO: dc1-dc2_ott/dc1_spine1_qfx5220-32cd dc1-dc2_ott/dc1_spine2_qfx5220-32cd dc1-dc3_type2_seamless/dc1_spine1_qfx5220-32cd dc1-dc3_type2_seamless/dc1_spine2_qfx5220-32cd dc1-dc4_type2_type5_seamless/dc1_spine1_qfx5220-32cd dc1-dc4_type2_type5_seamless/dc1_spine2_qfx5220-32cd
 * Count:
 *   dc1-dc2_ott/dc1_spine1_qfx5220-32cd 1
 *   dc1-dc2_ott/dc1_spine2_qfx5220-32cd 1
 *   dc1-dc3_type2_seamless/dc1_spine1_qfx5220-32cd 1
 *   dc1-dc3_type2_seamless/dc1_spine2_qfx5220-32cd 1
 *   dc1-dc4_type2_type5_seamless/dc1_spine1_qfx5220-32cd 1
 *   dc1-dc4_type2_type5_seamless/dc1_spine2_qfx5220-32cd 1
 *   total 6
 * Pair with: none
 * Variables (example values from dc1-dc2_ott/dc1_spine1_qfx5220-32cd):
 *   $BGP_GROUP          e.g. l3clos-s-evpn
 *   $OVERLAY_PEER_V4_1  e.g. 192.168.255.2
 *   $DESCRIPTION_1      e.g. facing_dc1-borderleaf-001-leaf1-evpn-overlay
 *   $LOOPBACK_V4        e.g. 192.168.255.0
 *   $BGP_EXPORT_POL     e.g. SPINE_TO_LEAF_EVPN_OUT
 *   $ASN_FABRIC_PEER_1  e.g. 64514
 *   $OVERLAY_PEER_V4_2  e.g. 192.168.255.3
 *   $DESCRIPTION_2      e.g. facing_dc1-borderleaf-001-leaf2-evpn-overlay
 *   $ASN_FABRIC_PEER_2  e.g. 64515
 *   $OVERLAY_PEER_V4_3  e.g. 192.168.255.4
 *   $DESCRIPTION_3      e.g. facing_dc1-esi-001-leaf1-evpn-overlay
 *   $ASN_FABRIC_PEER_3  e.g. 64516
 *   $OVERLAY_PEER_V4_4  e.g. 192.168.255.5
 *   $DESCRIPTION_4      e.g. facing_dc1-esi-001-leaf2-evpn-overlay
 *   $ASN_FABRIC_PEER_4  e.g. 64517
 *   $OVERLAY_PEER_V4_5  e.g. 192.168.255.6
 *   $DESCRIPTION_5      e.g. facing_dc1-single-001-leaf1-evpn-overlay
 *   $ASN_FABRIC_PEER_5  e.g. 64518
 */
protocols {
    bgp {
        group $BGP_GROUP {
            type external;
            multihop {
                ttl 1;
                no-nexthop-change;
            }
            family evpn {
                signaling {
                    loops 2;
                }
            }
            multipath {
                multiple-as;
            }
            bfd-liveness-detection {
                minimum-interval 3000;
                multiplier 3;
            }
            neighbor $OVERLAY_PEER_V4_1 {
                description $DESCRIPTION_1;
                local-address $LOOPBACK_V4;
                family evpn {
                    signaling;
                }
                export ( $BGP_EXPORT_POL );
                peer-as $ASN_FABRIC_PEER_1;
            }
            neighbor $OVERLAY_PEER_V4_2 {
                description $DESCRIPTION_2;
                local-address $LOOPBACK_V4;
                family evpn {
                    signaling;
                }
                export ( $BGP_EXPORT_POL );
                peer-as $ASN_FABRIC_PEER_2;
            }
            neighbor $OVERLAY_PEER_V4_3 {
                description $DESCRIPTION_3;
                local-address $LOOPBACK_V4;
                family evpn {
                    signaling;
                }
                export ( $BGP_EXPORT_POL );
                peer-as $ASN_FABRIC_PEER_3;
            }
            neighbor $OVERLAY_PEER_V4_4 {
                description $DESCRIPTION_4;
                local-address $LOOPBACK_V4;
                family evpn {
                    signaling;
                }
                export ( $BGP_EXPORT_POL );
                peer-as $ASN_FABRIC_PEER_4;
            }
            neighbor $OVERLAY_PEER_V4_5 {
                description $DESCRIPTION_5;
                local-address $LOOPBACK_V4;
                family evpn {
                    signaling;
                }
                export ( $BGP_EXPORT_POL );
                peer-as $ASN_FABRIC_PEER_5;
            }
            vpn-apply-export;
        }
    }
}
