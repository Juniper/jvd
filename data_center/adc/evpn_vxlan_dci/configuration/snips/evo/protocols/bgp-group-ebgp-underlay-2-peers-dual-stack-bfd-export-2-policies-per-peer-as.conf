/*
 * Topic: Leaf eBGP underlay group with two spine peers, each in its own AS, over IPv4 and IPv6, BFD and a two-policy export chain
 * Seen on:
 *   Junos: (none)
 *   EVO: dc1-dc2_ott/dc1_borderleaf1_qfx5130-32cd dc1-dc2_ott/dc1_borderleaf2_qfx5130-32cd dc1-dc2_ott/dc2_borderleaf1_qfx5700 dc1-dc2_ott/dc2_borderleaf2_qfx5700 dc1-dc3_type2_seamless/dc1_borderleaf1_qfx5130-32cd dc1-dc3_type2_seamless/dc1_borderleaf2_qfx5130-32cd dc1-dc4_type2_type5_seamless/dc1_borderleaf1_qfx5130-32cd dc1-dc4_type2_type5_seamless/dc1_borderleaf2_qfx5130-32cd dc1-dc4_type2_type5_seamless/dc4_services-leaf1_qfx5130-48c dc1-dc4_type2_type5_seamless/dc4_services-leaf2_qfx5130-48c dc1-dc4_type2_type5_seamless/dc4_storage-leaf1_qfx5130-32cd dc1-dc4_type2_type5_seamless/dc4_storage-leaf2_qfx5130-32cd
 * Count:
 *   dc1-dc2_ott/dc1_borderleaf1_qfx5130-32cd 1
 *   dc1-dc2_ott/dc1_borderleaf2_qfx5130-32cd 1
 *   dc1-dc2_ott/dc2_borderleaf1_qfx5700 1
 *   dc1-dc2_ott/dc2_borderleaf2_qfx5700 1
 *   dc1-dc3_type2_seamless/dc1_borderleaf1_qfx5130-32cd 1
 *   dc1-dc3_type2_seamless/dc1_borderleaf2_qfx5130-32cd 1
 *   dc1-dc4_type2_type5_seamless/dc1_borderleaf1_qfx5130-32cd 1
 *   dc1-dc4_type2_type5_seamless/dc1_borderleaf2_qfx5130-32cd 1
 *   dc1-dc4_type2_type5_seamless/dc4_services-leaf1_qfx5130-48c 1
 *   dc1-dc4_type2_type5_seamless/dc4_services-leaf2_qfx5130-48c 1
 *   dc1-dc4_type2_type5_seamless/dc4_storage-leaf1_qfx5130-32cd 1
 *   dc1-dc4_type2_type5_seamless/dc4_storage-leaf2_qfx5130-32cd 1
 *   total 12
 * Pair with: none
 * Variables (example values from dc1-dc2_ott/dc1_borderleaf1_qfx5130-32cd):
 *   $BGP_GROUP            e.g. l3clos-l
 *   $UNDERLAY_PEER_V6_1   e.g. fdf6:ed70:1fac:f2d1::
 *   $DESCRIPTION_1        e.g. facing_spine1
 *   $UNDERLAY_LOCAL_V6_1  e.g. fdf6:ed70:1fac:f2d1::1
 *   $BGP_EXPORT_POL_1     e.g. LEAF_TO_SPINE_FABRIC_OUT
 *   $BGP_EXPORT_POL_2     e.g. BGP-AOS-Policy
 *   $ASN_FABRIC_PEER_1    e.g. 64512
 *   $UNDERLAY_PEER_V6_2   e.g. fdf6:ed70:1fac:f2d1::a
 *   $DESCRIPTION_2        e.g. facing_spine2
 *   $UNDERLAY_LOCAL_V6_2  e.g. fdf6:ed70:1fac:f2d1::b
 *   $ASN_FABRIC_PEER_2    e.g. 64513
 *   $UNDERLAY_PEER_V4_1   e.g. 10.0.1.0
 *   $UNDERLAY_LOCAL_V4_1  e.g. 10.0.1.1
 *   $UNDERLAY_PEER_V4_2   e.g. 10.0.1.10
 *   $UNDERLAY_LOCAL_V4_2  e.g. 10.0.1.11
 */
protocols {
    bgp {
        group $BGP_GROUP {
            type external;
            multipath {
                multiple-as;
            }
            bfd-liveness-detection {
                minimum-interval 1000;
                multiplier 3;
            }
            neighbor $UNDERLAY_PEER_V6_1 {
                description $DESCRIPTION_1;
                local-address $UNDERLAY_LOCAL_V6_1;
                family inet6 {
                    unicast;
                }
                export ( $BGP_EXPORT_POL_1 && $BGP_EXPORT_POL_2 );
                peer-as $ASN_FABRIC_PEER_1;
            }
            neighbor $UNDERLAY_PEER_V6_2 {
                description $DESCRIPTION_2;
                local-address $UNDERLAY_LOCAL_V6_2;
                family inet6 {
                    unicast;
                }
                export ( $BGP_EXPORT_POL_1 && $BGP_EXPORT_POL_2 );
                peer-as $ASN_FABRIC_PEER_2;
            }
            neighbor $UNDERLAY_PEER_V4_1 {
                description $DESCRIPTION_1;
                local-address $UNDERLAY_LOCAL_V4_1;
                family inet {
                    unicast;
                }
                export ( $BGP_EXPORT_POL_1 && $BGP_EXPORT_POL_2 );
                peer-as $ASN_FABRIC_PEER_1;
            }
            neighbor $UNDERLAY_PEER_V4_2 {
                description $DESCRIPTION_2;
                local-address $UNDERLAY_LOCAL_V4_2;
                family inet {
                    unicast;
                }
                export ( $BGP_EXPORT_POL_1 && $BGP_EXPORT_POL_2 );
                peer-as $ASN_FABRIC_PEER_2;
            }
            vpn-apply-export;
        }
    }
}
