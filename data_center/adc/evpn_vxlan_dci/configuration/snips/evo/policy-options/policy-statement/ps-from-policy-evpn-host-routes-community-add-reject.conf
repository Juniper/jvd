/*
 * Topic: EVPN Type 5 export policy that accepts the routes another policy accepts, adds a community to EVPN IPv4 /32 and IPv6 /128 host routes, and rejects everything else
 * Seen on:
 *   Junos: (none)
 *   EVO: dc1-dc4_type2_type5_seamless/dc4_storage-leaf1_qfx5130-32cd dc1-dc4_type2_type5_seamless/dc4_storage-leaf2_qfx5130-32cd
 * Count:
 *   dc1-dc4_type2_type5_seamless/dc4_storage-leaf1_qfx5130-32cd 1
 *   dc1-dc4_type2_type5_seamless/dc4_storage-leaf2_qfx5130-32cd 1
 *   total 2
 * Pair with: none
 * Peers with: n/a
 * Variables (example values from dc1-dc4_type2_type5_seamless/dc4_storage-leaf1_qfx5130-32cd):
 *   $IP_PREFIX_EXPORT_POL  e.g. BGP-AOS-Policy-green
 *   $TERM_NAME_1           e.g. BGP-AOS-Policy-green-10
 *   $POLICY_NAME           e.g. AllPodNetworks-green
 *   $TERM_NAME_2           e.g. BGP-AOS-Policy-green-50
 *   $COMMUNITY_NAME_1      e.g. GREEN_COMMUNITY_V4
 *   $TERM_NAME_3           e.g. BGP-AOS-Policy-green-60
 *   $COMMUNITY_NAME_2      e.g. GREEN_COMMUNITY_V6
 *   $TERM_NAME_4           e.g. BGP-AOS-Policy-green-100
 */
policy-options {
    policy-statement $IP_PREFIX_EXPORT_POL {
        term $TERM_NAME_1 {
            from policy $POLICY_NAME;
            then accept;
        }
        term $TERM_NAME_2 {
            from {
                protocol evpn;
                route-filter 0.0.0.0/0 prefix-length-range /32-/32;
            }
            then {
                community add $COMMUNITY_NAME_1;
                accept;
            }
        }
        term $TERM_NAME_3 {
            from {
                protocol evpn;
                route-filter 0::0/0 prefix-length-range /128-/128;
            }
            then {
                community add $COMMUNITY_NAME_2;
                accept;
            }
        }
        term $TERM_NAME_4 {
            then reject;
        }
    }
}
