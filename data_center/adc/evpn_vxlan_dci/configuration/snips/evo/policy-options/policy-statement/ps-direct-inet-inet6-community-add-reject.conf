policy-options {
    policy-statement $POLICY_NAME {
        term $TERM_NAME_1 {
            from {
                family inet;
                protocol direct;
            }
            then {
                community add $COMMUNITY_NAME_1;
                accept;
            }
        }
        term $TERM_NAME_2 {
            from {
                family inet6;
                protocol direct;
            }
            then {
                community add $COMMUNITY_NAME_2;
                accept;
            }
        }
        term $TERM_NAME_3 {
            then reject;
        }
    }
}
