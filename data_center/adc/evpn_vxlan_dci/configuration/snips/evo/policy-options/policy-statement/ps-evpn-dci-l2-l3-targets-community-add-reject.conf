/*
 * Topic: EVPN import policy from the DCI gateway peers that accepts EVPN_DCI_L2_TARGET routes (adding a community and NO_ADVERTISE) and each VRF's EVPN_DCI_L3_TARGET routes in its route-filter lists (adding a community), and rejects other EVPN routes
 * Seen on:
 *   Junos: (none)
 *   EVO: dc1-dc4_type2_type5_seamless/dc1_borderleaf1_qfx5130-32cd dc1-dc4_type2_type5_seamless/dc1_borderleaf2_qfx5130-32cd dc1-dc4_type2_type5_seamless/dc4_services-leaf1_qfx5130-48c dc1-dc4_type2_type5_seamless/dc4_services-leaf2_qfx5130-48c
 * Count:
 *   dc1-dc4_type2_type5_seamless/dc1_borderleaf1_qfx5130-32cd 1
 *   dc1-dc4_type2_type5_seamless/dc1_borderleaf2_qfx5130-32cd 1
 *   dc1-dc4_type2_type5_seamless/dc4_services-leaf1_qfx5130-48c 1
 *   dc1-dc4_type2_type5_seamless/dc4_services-leaf2_qfx5130-48c 1
 *   total 4
 * Pair with:
 *  - evo/policy-options/community/cm-instance-target.conf
 *  - evo/policy-options/community/no-advertise.conf
 *
 * Peers with: n/a
 * Variables (example values from dc1-dc4_type2_type5_seamless/dc1_borderleaf1_qfx5130-32cd):
 *   $BGP_IMPORT_POL       e.g. EVPN_GW_IN
 *   $TERM_NAME_1          e.g. EVPN_GW_IN-10
 *   $COMMUNITY_NAME       e.g. EVPN_GW_IN
 *   $TERM_NAME_2          e.g. EVPN_GW_IN-30
 *   $ROUTE_FILTER_LIST_1  e.g. EVPN_DCI_L3_IN-blue-blue-DCI
 *   $TERM_NAME_3          e.g. EVPN_GW_IN-35
 *   $ROUTE_FILTER_LIST_2  e.g. EVPN_DCI_L3_INV6-blue-blue-DCI
 *   $TERM_NAME_4          e.g. EVPN_GW_IN-40
 *   $ROUTE_FILTER_LIST_3  e.g. EVPN_DCI_L3_IN-red-red-DCI
 *   $TERM_NAME_5          e.g. EVPN_GW_IN-45
 *   $ROUTE_FILTER_LIST_4  e.g. EVPN_DCI_L3_INV6-red-red-DCI
 *   $TERM_NAME_6          e.g. EVPN_GW_IN-50
 *   $ROUTE_FILTER_LIST_5  e.g. EVPN_DCI_L3_IN-green-green-DCI
 *   $TERM_NAME_7          e.g. EVPN_GW_IN-55
 *   $ROUTE_FILTER_LIST_6  e.g. EVPN_DCI_L3_INV6-green-green-DCI
 *   $TERM_NAME_8          e.g. EVPN_GW_IN-60
 */
policy-options {
    policy-statement $BGP_IMPORT_POL {
        term $TERM_NAME_1 {
            from {
                family evpn;
                community EVPN_DCI_L2_TARGET;
            }
            then {
                community add $COMMUNITY_NAME;
                community add NO_ADVERTISE;
                accept;
            }
        }
        term $TERM_NAME_2 {
            from {
                family evpn;
                community EVPN_DCI_L3_TARGET_blue;
                route-filter-list $ROUTE_FILTER_LIST_1;
            }
            then {
                community add $COMMUNITY_NAME;
                accept;
            }
        }
        term $TERM_NAME_3 {
            from {
                family evpn;
                community EVPN_DCI_L3_TARGET_blue;
                route-filter-list $ROUTE_FILTER_LIST_2;
            }
            then {
                community add $COMMUNITY_NAME;
                accept;
            }
        }
        term $TERM_NAME_4 {
            from {
                family evpn;
                community EVPN_DCI_L3_TARGET_red;
                route-filter-list $ROUTE_FILTER_LIST_3;
            }
            then {
                community add $COMMUNITY_NAME;
                accept;
            }
        }
        term $TERM_NAME_5 {
            from {
                family evpn;
                community EVPN_DCI_L3_TARGET_red;
                route-filter-list $ROUTE_FILTER_LIST_4;
            }
            then {
                community add $COMMUNITY_NAME;
                accept;
            }
        }
        term $TERM_NAME_6 {
            from {
                family evpn;
                community EVPN_DCI_L3_TARGET_green;
                route-filter-list $ROUTE_FILTER_LIST_5;
            }
            then {
                community add $COMMUNITY_NAME;
                accept;
            }
        }
        term $TERM_NAME_7 {
            from {
                family evpn;
                community EVPN_DCI_L3_TARGET_green;
                route-filter-list $ROUTE_FILTER_LIST_6;
            }
            then {
                community add $COMMUNITY_NAME;
                accept;
            }
        }
        term $TERM_NAME_8 {
            from family evpn;
            then reject;
        }
    }
}
