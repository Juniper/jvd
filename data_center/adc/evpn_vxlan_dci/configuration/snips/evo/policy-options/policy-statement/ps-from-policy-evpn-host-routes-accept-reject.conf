/*
 * Topic: Export policy that accepts the routes another policy accepts and EVPN IPv4 /32 and IPv6 /128 host routes, and rejects everything else
 * Seen on:
 *   Junos: (none)
 *   EVO: dc1-dc4_type2_type5_seamless/dc4_storage-leaf1_qfx5130-32cd dc1-dc4_type2_type5_seamless/dc4_storage-leaf2_qfx5130-32cd
 * Count:
 *   dc1-dc4_type2_type5_seamless/dc4_storage-leaf1_qfx5130-32cd 1
 *   dc1-dc4_type2_type5_seamless/dc4_storage-leaf2_qfx5130-32cd 1
 *   total 2
 * Pair with: none
 * Peers with: n/a
 * Variables (example values from dc1-dc4_type2_type5_seamless/dc4_storage-leaf1_qfx5130-32cd):
 *   $BGP_EXPORT_POL  e.g. BGP-AOS-Policy
 *   $TERM_NAME_1     e.g. BGP-AOS-Policy-10
 *   $POLICY_NAME     e.g. AllPodNetworks
 *   $TERM_NAME_2     e.g. BGP-AOS-Policy-50
 *   $TERM_NAME_3     e.g. BGP-AOS-Policy-60
 *   $TERM_NAME_4     e.g. BGP-AOS-Policy-100
 */
policy-options {
    policy-statement $BGP_EXPORT_POL {
        term $TERM_NAME_1 {
            from policy $POLICY_NAME;
            then accept;
        }
        term $TERM_NAME_2 {
            from {
                protocol evpn;
                route-filter 0.0.0.0/0 prefix-length-range /32-/32;
            }
            then accept;
        }
        term $TERM_NAME_3 {
            from {
                protocol evpn;
                route-filter 0::0/0 prefix-length-range /128-/128;
            }
            then accept;
        }
        term $TERM_NAME_4 {
            then reject;
        }
    }
}
