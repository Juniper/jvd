/*
 * Topic: EVPN export policy toward the DCI gateway peers that rejects routes tagged EVPN_GW_OUT, accepts EVPN_DCI_L2_TARGET routes and each VRF's EVPN_DCI_L3_TARGET routes in its route-filter lists with FABRIC_COMMUNITIES removed, and rejects other EVPN routes
 * Seen on:
 *   Junos: (none)
 *   EVO: dc1-dc4_type2_type5_seamless/dc1_borderleaf1_qfx5130-32cd dc1-dc4_type2_type5_seamless/dc1_borderleaf2_qfx5130-32cd dc1-dc4_type2_type5_seamless/dc4_services-leaf1_qfx5130-48c dc1-dc4_type2_type5_seamless/dc4_services-leaf2_qfx5130-48c
 * Count:
 *   dc1-dc4_type2_type5_seamless/dc1_borderleaf1_qfx5130-32cd 1
 *   dc1-dc4_type2_type5_seamless/dc1_borderleaf2_qfx5130-32cd 1
 *   dc1-dc4_type2_type5_seamless/dc4_services-leaf1_qfx5130-48c 1
 *   dc1-dc4_type2_type5_seamless/dc4_services-leaf2_qfx5130-48c 1
 *   total 4
 * Pair with:
 *  - evo/policy-options/community/cm-instance-target.conf
 *  - evo/policy-options/community/evpn-gw-out.conf
 *  - evo/policy-options/community/fabric-communities.conf
 *
 * Peers with: n/a
 * Variables (example values from dc1-dc4_type2_type5_seamless/dc1_borderleaf1_qfx5130-32cd):
 *   $BGP_EXPORT_POL       e.g. EVPN_GW_OUT
 *   $TERM_NAME_1          e.g. EVPN_GW_OUT-10
 *   $TERM_NAME_2          e.g. EVPN_GW_OUT-20
 *   $TERM_NAME_3          e.g. EVPN_GW_OUT-40
 *   $ROUTE_FILTER_LIST_1  e.g. EVPN_DCI_L3_OUT-blue-blue-DCI
 *   $TERM_NAME_4          e.g. EVPN_GW_OUT-45
 *   $ROUTE_FILTER_LIST_2  e.g. EVPN_DCI_L3_OUTV6-blue-blue-DCI
 *   $TERM_NAME_5          e.g. EVPN_GW_OUT-50
 *   $ROUTE_FILTER_LIST_3  e.g. EVPN_DCI_L3_OUT-red-red-DCI
 *   $TERM_NAME_6          e.g. EVPN_GW_OUT-55
 *   $ROUTE_FILTER_LIST_4  e.g. EVPN_DCI_L3_OUTV6-red-red-DCI
 *   $TERM_NAME_7          e.g. EVPN_GW_OUT-60
 *   $ROUTE_FILTER_LIST_5  e.g. EVPN_DCI_L3_OUT-green-green-DCI
 *   $TERM_NAME_8          e.g. EVPN_GW_OUT-65
 *   $ROUTE_FILTER_LIST_6  e.g. EVPN_DCI_L3_OUTV6-green-green-DCI
 *   $TERM_NAME_9          e.g. EVPN_GW_OUT-70
 */
policy-options {
    policy-statement $BGP_EXPORT_POL {
        term $TERM_NAME_1 {
            from {
                family evpn;
                community EVPN_GW_OUT;
            }
            then reject;
        }
        term $TERM_NAME_2 {
            from {
                family evpn;
                community EVPN_DCI_L2_TARGET;
            }
            then {
                community delete FABRIC_COMMUNITIES;
                accept;
            }
        }
        term $TERM_NAME_3 {
            from {
                family evpn;
                community EVPN_DCI_L3_TARGET_blue;
                route-filter-list $ROUTE_FILTER_LIST_1;
            }
            then {
                community delete FABRIC_COMMUNITIES;
                accept;
            }
        }
        term $TERM_NAME_4 {
            from {
                family evpn;
                community EVPN_DCI_L3_TARGET_blue;
                route-filter-list $ROUTE_FILTER_LIST_2;
            }
            then {
                community delete FABRIC_COMMUNITIES;
                accept;
            }
        }
        term $TERM_NAME_5 {
            from {
                family evpn;
                community EVPN_DCI_L3_TARGET_red;
                route-filter-list $ROUTE_FILTER_LIST_3;
            }
            then {
                community delete FABRIC_COMMUNITIES;
                accept;
            }
        }
        term $TERM_NAME_6 {
            from {
                family evpn;
                community EVPN_DCI_L3_TARGET_red;
                route-filter-list $ROUTE_FILTER_LIST_4;
            }
            then {
                community delete FABRIC_COMMUNITIES;
                accept;
            }
        }
        term $TERM_NAME_7 {
            from {
                family evpn;
                community EVPN_DCI_L3_TARGET_green;
                route-filter-list $ROUTE_FILTER_LIST_5;
            }
            then {
                community delete FABRIC_COMMUNITIES;
                accept;
            }
        }
        term $TERM_NAME_8 {
            from {
                family evpn;
                community EVPN_DCI_L3_TARGET_green;
                route-filter-list $ROUTE_FILTER_LIST_6;
            }
            then {
                community delete FABRIC_COMMUNITIES;
                accept;
            }
        }
        term $TERM_NAME_9 {
            from family evpn;
            then reject;
        }
    }
}
