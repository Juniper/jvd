/*
 * Topic: Superspine export policy that tags every route FROM_SUPERSPINE_FABRIC_TIER and accepts it
 * Seen on:
 *   Junos: (none)
 *   EVO: dc1-dc4_type2_type5_seamless/dc4_superspine1_qfx5230-64cd dc1-dc4_type2_type5_seamless/dc4_superspine2_qfx5230-64cd
 * Count:
 *   dc1-dc4_type2_type5_seamless/dc4_superspine1_qfx5230-64cd 1
 *   dc1-dc4_type2_type5_seamless/dc4_superspine2_qfx5230-64cd 1
 *   total 2
 * Pair with:
 *  - evo/policy-options/community/from-superspine-fabric-tier.conf
 *
 * Peers with: n/a
 * Variables (example values from dc1-dc4_type2_type5_seamless/dc4_superspine1_qfx5230-64cd):
 *   $BGP_EXPORT_POL  e.g. SUPERSPINE_TO_SPINE_FABRIC_OUT
 *   $TERM_NAME       e.g. SUPERSPINE_TO_SPINE_FABRIC_OUT-10
 */
policy-options {
    policy-statement $BGP_EXPORT_POL {
        term $TERM_NAME {
            then {
                community add FROM_SUPERSPINE_FABRIC_TIER;
                accept;
            }
        }
    }
}
