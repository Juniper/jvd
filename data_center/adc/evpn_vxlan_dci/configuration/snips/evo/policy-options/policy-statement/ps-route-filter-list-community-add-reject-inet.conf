 * Variables (example values from dc1-dc2_ott/dc1_borderleaf1_qfx5130-32cd):
 *   $BGP_IMPORT_POL     e.g. RoutesFromExt-default-DCI1
 *   $TERM_NAME_1        e.g. RoutesFromExt-default-DCI1-10
 *   $ROUTE_FILTER_LIST  e.g. RoutesFromExt-default-DCI1
 *   $COMMUNITY_NAME     e.g. RoutesFromExt-default-DCI1
 *   $TERM_NAME_2        e.g. RoutesFromExt-default-DCI1-30
 */
policy-options {
    policy-statement $BGP_IMPORT_POL {
        term $TERM_NAME_1 {
            from {
                family inet;
                route-filter-list $ROUTE_FILTER_LIST;
            }
            then {
                community add $COMMUNITY_NAME;
                accept;
            }
        }
        term $TERM_NAME_2 {
            from family inet;
            then reject;
        }
    }
}
