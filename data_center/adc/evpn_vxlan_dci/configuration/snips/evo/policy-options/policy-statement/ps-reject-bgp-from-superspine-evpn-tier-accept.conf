/*
 * Topic: Spine EVPN export policy toward the superspines that rejects BGP routes tagged FROM_SUPERSPINE_EVPN_TIER and accepts every other route
 * Seen on:
 *   Junos: (none)
 *   EVO: dc1-dc4_type2_type5_seamless/dc4_storage-spine1_qfx5220-32cd dc1-dc4_type2_type5_seamless/dc4_storage-spine2_qfx5220-32cd
 * Count:
 *   dc1-dc4_type2_type5_seamless/dc4_storage-spine1_qfx5220-32cd 1
 *   dc1-dc4_type2_type5_seamless/dc4_storage-spine2_qfx5220-32cd 1
 *   total 2
 * Pair with:
 *  - evo/policy-options/community/from-superspine-evpn-tier.conf
 *
 * Peers with: n/a
 * Variables (example values from dc1-dc4_type2_type5_seamless/dc4_storage-spine1_qfx5220-32cd):
 *   $BGP_EXPORT_POL  e.g. SPINE_TO_SUPERSPINE_EVPN_OUT
 *   $TERM_NAME_1     e.g. SPINE_TO_SUPERSPINE_EVPN_OUT-10
 *   $TERM_NAME_2     e.g. SPINE_TO_SUPERSPINE_EVPN_OUT-20
 */
policy-options {
    policy-statement $BGP_EXPORT_POL {
        term $TERM_NAME_1 {
            from {
                protocol bgp;
                community FROM_SUPERSPINE_EVPN_TIER;
            }
            then reject;
        }
        term $TERM_NAME_2 {
            then accept;
        }
    }
}
