/*
 * Topic: EVPN export policy toward the DCI gateway peers that rejects routes tagged EVPN_GW_OUT and removes FABRIC_COMMUNITIES from the rest
 * Seen on:
 *   Junos: (none)
 *   EVO: dc1-dc2_ott/dc1_borderleaf1_qfx5130-32cd dc1-dc2_ott/dc1_borderleaf2_qfx5130-32cd dc1-dc2_ott/dc2_borderleaf1_qfx5700 dc1-dc2_ott/dc2_borderleaf2_qfx5700
 * Count:
 *   dc1-dc2_ott/dc1_borderleaf1_qfx5130-32cd 1
 *   dc1-dc2_ott/dc1_borderleaf2_qfx5130-32cd 1
 *   dc1-dc2_ott/dc2_borderleaf1_qfx5700 1
 *   dc1-dc2_ott/dc2_borderleaf2_qfx5700 1
 *   total 4
 * Pair with:
 *  - evo/policy-options/community/evpn-gw-out.conf
 *  - evo/policy-options/community/fabric-communities.conf
 *
 * Peers with: n/a
 * Variables (example values from dc1-dc2_ott/dc1_borderleaf1_qfx5130-32cd):
 *   $BGP_EXPORT_POL  e.g. EVPN_GW_OUT
 *   $TERM_NAME_1     e.g. EVPN_GW_OUT-10
 *   $TERM_NAME_2     e.g. EVPN_GW_OUT-20
 */
policy-options {
    policy-statement $BGP_EXPORT_POL {
        term $TERM_NAME_1 {
            from {
                family evpn;
                community EVPN_GW_OUT;
            }
            then reject;
        }
        term $TERM_NAME_2 {
            from family evpn;
            then {
                community delete FABRIC_COMMUNITIES;
                accept;
            }
        }
    }
}
