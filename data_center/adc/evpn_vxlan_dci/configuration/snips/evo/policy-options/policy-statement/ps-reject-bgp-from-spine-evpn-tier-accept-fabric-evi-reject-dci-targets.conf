/*
 * Topic: Border-leaf EVPN export policy toward the spines that rejects BGP routes tagged FROM_SPINE_EVPN_TIER, accepts FABRIC_EVI_TARGET routes, rejects the DCI Layer 2 and Layer 3 targets and accepts every other route
 * Seen on:
 *   Junos: (none)
 *   EVO: dc1-dc4_type2_type5_seamless/dc1_borderleaf1_qfx5130-32cd dc1-dc4_type2_type5_seamless/dc1_borderleaf2_qfx5130-32cd dc1-dc4_type2_type5_seamless/dc4_services-leaf1_qfx5130-48c dc1-dc4_type2_type5_seamless/dc4_services-leaf2_qfx5130-48c
 * Count:
 *   dc1-dc4_type2_type5_seamless/dc1_borderleaf1_qfx5130-32cd 1
 *   dc1-dc4_type2_type5_seamless/dc1_borderleaf2_qfx5130-32cd 1
 *   dc1-dc4_type2_type5_seamless/dc4_services-leaf1_qfx5130-48c 1
 *   dc1-dc4_type2_type5_seamless/dc4_services-leaf2_qfx5130-48c 1
 *   total 4
 * Pair with:
 *  - evo/policy-options/community/cm-instance-target.conf
 *  - evo/policy-options/community/from-spine-evpn-tier.conf
 *
 * Peers with: n/a
 * Variables (example values from dc1-dc4_type2_type5_seamless/dc1_borderleaf1_qfx5130-32cd):
 *   $BGP_EXPORT_POL  e.g. LEAF_TO_SPINE_EVPN_OUT
 *   $TERM_NAME_1     e.g. LEAF_TO_SPINE_EVPN_OUT-10
 *   $TERM_NAME_2     e.g. LEAF_TO_SPINE_EVPN_OUT-20
 *   $TERM_NAME_3     e.g. LEAF_TO_SPINE_EVPN_OUT-30
 *   $TERM_NAME_4     e.g. LEAF_TO_SPINE_EVPN_OUT-40
 */
policy-options {
    policy-statement $BGP_EXPORT_POL {
        term $TERM_NAME_1 {
            from {
                protocol bgp;
                community FROM_SPINE_EVPN_TIER;
            }
            then reject;
        }
        term $TERM_NAME_2 {
            from {
                protocol [ bgp evpn ];
                community FABRIC_EVI_TARGET;
            }
            then accept;
        }
        term $TERM_NAME_3 {
            from {
                protocol [ bgp evpn ];
                community [ EVPN_DCI_L2_TARGET EVPN_DCI_L3_TARGET_blue EVPN_DCI_L3_TARGET_green EVPN_DCI_L3_TARGET_red ];
            }
            then reject;
        }
        term $TERM_NAME_4 {
            then accept;
        }
    }
}
