/*
 * Topic: EVPN import policy from the DCI gateway peers that accepts routes with the EVPN_DCI_L2_TARGET target, adding a community and NO_ADVERTISE, and rejects other EVPN routes
 * Seen on:
 *   Junos: (none)
 *   EVO: dc1-dc3_type2_seamless/dc1_borderleaf1_qfx5130-32cd dc1-dc3_type2_seamless/dc1_borderleaf2_qfx5130-32cd
 * Count:
 *   dc1-dc3_type2_seamless/dc1_borderleaf1_qfx5130-32cd 1
 *   dc1-dc3_type2_seamless/dc1_borderleaf2_qfx5130-32cd 1
 *   total 2
 * Pair with:
 *  - evo/policy-options/community/cm-instance-target.conf
 *  - evo/policy-options/community/no-advertise.conf
 *
 * Peers with: n/a
 * Variables (example values from dc1-dc3_type2_seamless/dc1_borderleaf1_qfx5130-32cd):
 *   $BGP_IMPORT_POL  e.g. EVPN_GW_IN
 *   $TERM_NAME_1     e.g. EVPN_GW_IN-10
 *   $COMMUNITY_NAME  e.g. EVPN_GW_IN
 *   $TERM_NAME_2     e.g. EVPN_GW_IN-20
 */
policy-options {
    policy-statement $BGP_IMPORT_POL {
        term $TERM_NAME_1 {
            from {
                family evpn;
                community EVPN_DCI_L2_TARGET;
            }
            then {
                community add $COMMUNITY_NAME;
                community add NO_ADVERTISE;
                accept;
            }
        }
        term $TERM_NAME_2 {
            from family evpn;
            then reject;
        }
    }
}
