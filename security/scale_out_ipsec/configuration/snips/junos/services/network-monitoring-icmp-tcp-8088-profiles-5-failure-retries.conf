services {
    network-monitoring {
        profile icmp-profile {
            icmp;
            probe-interval 1;
            failure-retries 5;
            recovery-retries 1;
        }
        profile tcp-profile1 {
            tcp {
                port 8088;
            }
            probe-interval 1;
            failure-retries 5;
            recovery-retries 1;
