/*
 * Topic: Policy that accepts BGP routes with next-hop self and rejects everything else
 * Seen on:
 *   Junos: mx1_mx304
 *   EVO: (none)
 * Count:
 *   mx1_mx304 1
 *   total 1
 * Pair with: none
 * Peers with: n/a
 * Variables (example values from mx1_mx304):
 *   $POLICY_NAME  e.g. mnha-mx-to-srx-export
 *   $TERM_NAME_1  e.g. 1
 *   $TERM_NAME_2  e.g. 2
 */
policy-options {
    policy-statement $POLICY_NAME {
        term $TERM_NAME_1 {
            from protocol bgp;
            then {
                next-hop self;
                accept;
            }
        }
        term $TERM_NAME_2 {
            then reject;
        }
    }
}
