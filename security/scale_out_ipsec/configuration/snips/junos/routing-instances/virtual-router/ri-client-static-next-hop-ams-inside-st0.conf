/*
 * Topic: client virtual router with a static route to the client prefix, the AMS inside units and the st0 tunnel units
 * Seen on:
 *   Junos: ipsec_initiator_gateway_mx304
 *   EVO: (none)
 * Count:
 *   ipsec_initiator_gateway_mx304 1
 *   total 1
 * Pair with: none
 * Variables (example values from ipsec_initiator_gateway_mx304):
 *   $NEXT_HOP_V4  e.g. 172.16.8.1
 *   $IFL_1        e.g. et-0/1/2.0
 *   $IFL_2        e.g. ams1.1
 *   $IFL_3        e.g. ams1.2
 *   $IFL_4        e.g. ams1.3
 *   $IFL_5        e.g. ams1.4
 *   $IFL_6        e.g. ams1.5
 *   $IFL_7        e.g. st0.1
 *   $IFL_8        e.g. st0.2
 *   $IFL_9        e.g. st0.3
 *   $IFL_10       e.g. st0.4
 *   $IFL_11       e.g. st0.5
 */
routing-instances {
    client {
        instance-type virtual-router;
        routing-options {
            static {
                route 172.80.0.0/16 next-hop $NEXT_HOP_V4;
            }
        }
        interface $IFL_1;
        interface $IFL_2;
        interface $IFL_3;
        interface $IFL_4;
        interface $IFL_5;
        interface $IFL_6;
        interface $IFL_7;
        interface $IFL_8;
        interface $IFL_9;
        interface $IFL_10;
        interface $IFL_11;
    }
}
