/*
 * Topic: Loopback unit with one IPv4 address
 * Seen on:
 *   Junos: mx1_mx304
 *   EVO: (none)
 * Count:
 *   mx1_mx304 1
 *   total 1
 * Pair with: none
 * Peers with: n/a
 * Variables (example values from mx1_mx304):
 *   $UNIT             e.g. 1
 *   $LOOPBACK_V4_PFX  e.g. 192.168.10.251/32
 */
interfaces {
    lo0 {
        unit $UNIT {
            family inet {
                address $LOOPBACK_V4_PFX;
            }
        }
    }
}
