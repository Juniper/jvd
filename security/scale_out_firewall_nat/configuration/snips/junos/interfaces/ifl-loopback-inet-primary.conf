/*
 * Topic: Primary IPv4 loopback address
 * Seen on:
 *   Junos: srx1a_srx4600 srx1b_srx4600 srx2a_srx4600 srx2b_srx4600
 *   EVO: (none)
 * Count:
 *   srx1a_srx4600 1
 *   srx1b_srx4600 1
 *   srx2a_srx4600 1
 *   srx2b_srx4600 1
 *   total 4
 * Pair with: none
 * Peers with: n/a
 * Variables (example values from srx1a_srx4600):
 *   $LOOPBACK_V4_PFX  e.g. 192.168.0.1/32
 */
interfaces {
    lo0 {
        unit 0 {
            family inet {
                address $LOOPBACK_V4_PFX {
                    primary;
                }
            }
        }
    }
}
