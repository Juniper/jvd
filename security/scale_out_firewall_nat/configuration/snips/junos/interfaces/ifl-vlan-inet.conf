/*
 * Topic: Single-tagged routed logical interface carrying an IPv4 customer address
 * Seen on:
 *   Junos: mx1_mx304 srx1a_srx4600 srx1b_srx4600 srx2a_srx4600 srx2b_srx4600
 *   EVO: (none)
 * Count:
 *   mx1_mx304 4
 *   srx1a_srx4600 1
 *   srx1b_srx4600 1
 *   srx2a_srx4600 1
 *   srx2b_srx4600 1
 *   total 8
 * Pair with: none
 * Peers with: n/a
 * Variables (example values from mx1_mx304):
 *   $IFD         e.g. ae1
 *   $UNIT        e.g. 100
 *   $VLAN        e.g. 100
 *   $AC_ADDR_V4  e.g. 10.3.1.1/30
 */
interfaces {
    $IFD {
        unit $UNIT {
            vlan-id $VLAN;
            family inet {
                address $AC_ADDR_V4;
            }
        }
    }
}
