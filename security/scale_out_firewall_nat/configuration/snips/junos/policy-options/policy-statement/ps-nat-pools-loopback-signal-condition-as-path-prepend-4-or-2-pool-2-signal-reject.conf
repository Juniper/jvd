/*
 * Topic: Policy advertising the NAT pool routes and one direct prefix with AS-path prepends, rejecting the second pool route while the MNHA signal route exists
 * Seen on:
 *   Junos: srx2b_srx4600
 *   EVO: (none)
 * Count:
 *   srx2b_srx4600 1
 *   total 1
 * Pair with: none
 * Peers with: n/a
 * Variables (example values from srx2b_srx4600):
 *   $BGP_EXPORT_POL     e.g. untrust_export_policy
 *   $TERM_NAME_1        e.g. 1
 *   $NAT_POOL_V4_PFX_1  e.g. 100.64.3.0/24
 *   $CONDITION_NAME     e.g. srg_sig_route_exist
 *   $TERM_NAME_2        e.g. 2
 *   $TERM_NAME_3        e.g. 3
 *   $NAT_POOL_V4_PFX_2  e.g. 100.64.4.0/24
 *   $TERM_NAME_4        e.g. 4
 *   $TERM_NAME_5        e.g. 5
 *   $PREFIX             e.g. 192.168.10.2/32
 *   $TERM_NAME_6        e.g. 6
 *   $TERM_NAME_7        e.g. 7
 */
policy-options {
    policy-statement $BGP_EXPORT_POL {
        term $TERM_NAME_1 {
            from {
                protocol static;
                route-filter $NAT_POOL_V4_PFX_1 exact;
                condition $CONDITION_NAME;
            }
            then {
                as-path-prepend "65000 65000 65000 65000";
                next-hop self;
                accept;
            }
        }
        term $TERM_NAME_2 {
            from {
                protocol static;
                route-filter $NAT_POOL_V4_PFX_1 exact;
            }
            then {
                as-path-prepend "65000 65000";
                next-hop self;
                accept;
            }
        }
        term $TERM_NAME_3 {
            from {
                protocol static;
                route-filter $NAT_POOL_V4_PFX_2 exact;
                condition $CONDITION_NAME;
            }
            then {
                as-path-prepend "65000 65000 65000 65000";
                next-hop self;
                reject;
            }
        }
        term $TERM_NAME_4 {
            from {
                protocol static;
                route-filter $NAT_POOL_V4_PFX_2 exact;
            }
            then {
                as-path-prepend "65000 65000";
                next-hop self;
                accept;
            }
        }
        term $TERM_NAME_5 {
            from {
                protocol direct;
                route-filter $PREFIX exact;
                condition $CONDITION_NAME;
            }
            then {
                as-path-prepend "65000 65000 65000 65000";
                next-hop self;
                accept;
            }
        }
        term $TERM_NAME_6 {
            from {
                protocol direct;
                route-filter $PREFIX exact;
            }
            then {
                as-path-prepend "65000 65000";
                next-hop self;
                accept;
            }
        }
        term $TERM_NAME_7 {
            then reject;
        }
    }
}
