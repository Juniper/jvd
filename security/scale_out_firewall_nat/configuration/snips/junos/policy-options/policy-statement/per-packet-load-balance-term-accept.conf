/*
 * Topic: Per-packet load-balance policy in one term with accept
 * Seen on:
 *   Junos: mx1_mx304
 *   EVO: (none)
 * Count:
 *   mx1_mx304 1
 *   total 1
 * Pair with: none
 * Peers with: n/a
 * Variables (example values from mx1_mx304):
 *   $PPLB_NAME  e.g. pfe_lb_hash
 *   $TERM_NAME  e.g. ALL-ELSE
 */
policy-options {
    policy-statement $PPLB_NAME {
        term $TERM_NAME {
            then {
                load-balance per-packet;
                accept;
            }
        }
    }
}
