/*
 * Topic: Policy accepting the BGP IPv4 default route with next-hop self and rejecting everything else
 * Seen on:
 *   Junos: srx1a_srx4600 srx2a_srx4600
 *   EVO: (none)
 * Count:
 *   srx1a_srx4600 1
 *   srx2a_srx4600 1
 *   total 2
 * Pair with: none
 * Peers with: n/a
 * Variables (example values from srx1a_srx4600):
 *   $POLICY_NAME  e.g. trust_export_policy_mx2
 *   $TERM_NAME_1  e.g. 1
 *   $TERM_NAME_2  e.g. 2
 */
policy-options {
    policy-statement $POLICY_NAME {
        term $TERM_NAME_1 {
            from {
                protocol bgp;
                route-filter 0.0.0.0/0 exact;
            }
            then {
                next-hop self;
                accept;
            }
        }
        term $TERM_NAME_2 {
            then reject;
        }
    }
}
