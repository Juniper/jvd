 * Seen on:
 *   Junos: (none)
 *   EVO: cr1_acx7100-48l
 * Count:
 *   cr1_acx7100-48l 1
 *   total 1
 * Highlights:
 *  - A VLAN sub-interface with its own description and IPv4 subnet.
 * Pair with: none
 * Peers with: n/a
 * Variables (example values from cr1_acx7100-48l):
 *   $IFD           e.g. et-0/0/42
 *   $UNIT          e.g. 100
 *   $DESCRIPTION   e.g. For_OSPF_route_Push
 *   $VLAN          e.g. 100
 *   $AC_ADDR_V4    e.g. 10.101.201.1/24
 */
interfaces {
    $IFD {
        unit $UNIT {
            description $DESCRIPTION;
            vlan-id $VLAN;
            family inet {
                address $AC_ADDR_V4;
            }
        }
    }
}
