/*
 * Topic: 10G tunnel services on a PIC
 * Seen on:
 *   Junos: ap1_mx304 cr2_mx480 wanedge1_mx304 wanedge2_mx10004
 *   EVO: (none)
 * Count:
 *   ap1_mx304 1
 *   cr2_mx480 1
 *   wanedge1_mx304 1
 *   wanedge2_mx10004 1
 *   total 4
 * Highlights:
 *  - Reserves 10G of PIC bandwidth for tunnel services.
 * Pair with: none
 * Peers with: n/a
 * Variables (example values from ap1_mx304):
 *   $FPC_SLOT   e.g. 0
 *   $PIC_SLOT   e.g. 0
 */
chassis {
    fpc $FPC_SLOT {
        pic $PIC_SLOT {
            tunnel-services {
                bandwidth 10g;
            }
        }
    }
}
