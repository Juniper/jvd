/*
 * Topic: Static PIM rendezvous point with one PIM interface in the default mode
 * Seen on:
 *   Junos: (none)
 *   EVO: wanedge3_acx7509
 * Count:
 *   wanedge3_acx7509 1
 *   total 1
 * Pair with: none
 * Variables (example values from wanedge3_acx7509):
 *   $PIM_RP_V4  e.g. 192.168.0.17
 *   $IFD        e.g. et-1/0/10
 *   $UNIT       e.g. 0
 */
protocols {
    pim {
        rp {
            static {
                address $PIM_RP_V4;
            }
        }
        interface $IFD.$UNIT;
    }
}
