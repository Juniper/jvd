/*
 * Topic: VLAN-tagged IPv4 unit with MPLS
 * Seen on:
 *   Junos: wanedge1_mx304
 *   EVO: (none)
 * Count:
 *   wanedge1_mx304 1
 *   total 1
 * Pair with: none
 * Peers with: n/a
 * Variables (example values from wanedge1_mx304):
 *   $IFD         e.g. xe-0/0/15:3
 *   $UNIT        e.g. 900
 *   $VLAN        e.g. 900
 *   $AC_ADDR_V4  e.g. 220.220.1.2/24
 */
interfaces {
    $IFD {
        unit $UNIT {
            vlan-id $VLAN;
            family inet {
                address $AC_ADDR_V4;
            }
            family mpls;
        }
    }
}
