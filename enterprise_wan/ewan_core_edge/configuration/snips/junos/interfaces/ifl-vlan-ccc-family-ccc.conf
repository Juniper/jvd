/*
 * Topic: VLAN-tagged circuit cross-connect unit with family ccc
 * Seen on:
 *   Junos: wanedge1_mx304 wanedge2_mx10008
 *   EVO: (none)
 * Count:
 *   wanedge1_mx304 2500
 *   wanedge2_mx10008 500
 *   total 3000
 * Pair with: none
 * Peers with: n/a
 * Variables (example values from wanedge1_mx304):
 *   $IFD   e.g. ae1
 *   $UNIT  e.g. 1501
 *   $VLAN  e.g. 1501
 */
interfaces {
    $IFD {
        unit $UNIT {
            encapsulation vlan-ccc;
            vlan-id $VLAN;
            family ccc;
        }
    }
}
