/*
 * Topic: Loopback unit with one IPv4 address
 * Seen on:
 *   Junos: wanedge1_mx304 wanedge2_mx10008
 *   EVO: (none)
 * Count:
 *   wanedge1_mx304 100
 *   wanedge2_mx10008 100
 *   total 200
 * Pair with: none
 * Peers with: n/a
 * Variables (example values from wanedge1_mx304):
 *   $UNIT             e.g. 1
 *   $LOOPBACK_V4_PFX  e.g. 10.11.11.1/32
 */
interfaces {
    lo0 {
        unit $UNIT {
            family inet {
                address $LOOPBACK_V4_PFX;
            }
        }
    }
}
