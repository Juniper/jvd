/*
 * Topic: Static PIM rendezvous point with one PIM interface in the default mode
 * Seen on:
 *   Junos: wanedge1_mx304
 *   EVO: (none)
 * Count:
 *   wanedge1_mx304 1
 *   total 1
 * Pair with: none
 * Variables (example values from wanedge1_mx304):
 *   $PIM_RP_V4  e.g. 192.168.0.17
 *   $IFD        e.g. xe-0/0/15:3
 *   $UNIT       e.g. 0
 */
protocols {
    pim {
        rp {
            static {
                address $PIM_RP_V4;
            }
        }
        interface $IFD.$UNIT;
    }
}
