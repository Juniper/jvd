chassis {
    aggregated-devices {
        ethernet {
            device-count 25;
        }
    }
    fpc 2 {
        pic 0 {
            port 0 {
                number-of-sub-ports 1;
                speed 40g;
            }
            port 1 {
                number-of-sub-ports 4;
                speed 25g;
            }
            port 2 {
                number-of-sub-ports 1;
                speed 40g;
            }
            port 3 {
                number-of-sub-ports 1;
                speed 40g;
            }
            port 4 {
                number-of-sub-ports 1;
                speed 40g;
            }
            port 5 {
                number-of-sub-ports 4;
                speed 10g;
            }
            port 6 {
                number-of-sub-ports 4;
                speed 10g;
            }
            port 7 {
                number-of-sub-ports 4;
                speed 10g;
            }
            port 8 {
                number-of-sub-ports 4;
                speed 10g;
            }
            port 9 {
                number-of-sub-ports 4;
                speed 10g;
            }
        }
    }
    network-services enhanced-ip;
}
interfaces {
    et-0/0/0 {
        disable;
        unit 0 {
            family inet {
                address 10.0.15.1/30;
            }
            family mpls;
        }
    }
    et-0/0/1 {
        disable;
        unit 0 {
            family inet {
                address 10.0.14.1/30;
            }
            family mpls;
        }
    }
    et-0/0/2 {
        unit 0 {
            family inet {
                address 10.0.11.2/30;
            }
            family mpls;
        }
    }
    et-0/0/3 {
        unit 0 {
            family inet {
                address 10.0.10.2/30;
            }
            family mpls;
        }
    }
    et-1/0/1 {
        description "P1Node to P2Node";
        unit 0 {
            family inet {
                address 192.168.67.1/24;
            }
            family mpls;
        }
    }
    et-1/0/3 {
        description "P1Node to WANEdge4";
        unit 0 {
            family inet {
                address 192.168.78.1/24;
            }
            family mpls;
        }
    }
    et-1/0/4 {
        description "P1Node to WANEdge3";
        unit 0 {
            family inet {
                address 192.168.23.1/24;
            }
            family mpls;
        }
    }
    et-1/0/5 {
        gigether-options {
            802.3ad ae2;
        }
    }
    et-1/0/6 {
        description "L2_P1Node to WANEdge1";
        gigether-options {
            802.3ad ae2;
        }
    }
    et-1/0/7 {
        description "L3_P1Node to WANEdge1";
        gigether-options {
            802.3ad ae2;
        }
    }
    ae2 {
        description "P1Node to WANEdge1";
        aggregated-ether-options {
            lacp {
                active;
                periodic fast;
            }
        }
        unit 0 {
            family inet {
                address 192.168.12.2/24;
            }
            family mpls;
        }
    }
}
forwarding-options {
    hash-key {
        family mpls {
            label-1;
            label-2;
            label-3;
        }
    }
    enhanced-hash-key {
        family mpls {
            no-payload;
        }
    }
}
policy-options {
    policy-statement load-balance {
        term 1 {
            then {
                load-balance per-packet;
            }
        }
    }
    policy-statement pplb {
        then {
            load-balance per-packet;
            accept;
        }
    }
    policy-statement send-ospf {
        term 2 {
            from protocol ospf;
            then accept;
        }
    }
}
class-of-service {
    classifiers {
        exp myexp {
            forwarding-class af {
                loss-priority low code-points 010;
            }
            forwarding-class af1 {
                loss-priority low code-points 110;
            }
            forwarding-class be {
                loss-priority low code-points 000;
            }
            forwarding-class be1 {
                loss-priority low code-points 100;
            }
            forwarding-class ef {
                loss-priority high code-points 001;
            }
            forwarding-class ef1 {
                loss-priority high code-points 101;
            }
            forwarding-class nc {
                loss-priority high code-points 011;
            }
            forwarding-class nc1 {
                loss-priority high code-points 111;
            }
        }
    }
    forwarding-classes {
        class af queue-num 2;
        class af1 queue-num 6;
        class be queue-num 0;
        class be1 queue-num 4;
        class ef queue-num 1;
        class ef1 queue-num 5;
        class nc queue-num 3;
        class nc1 queue-num 7;
    }
    rewrite-rules {
        exp myexp_rw {
            forwarding-class af {
                loss-priority low code-point 101;
            }
            forwarding-class af1 {
                loss-priority low code-point 001;
            }
            forwarding-class be {
                loss-priority low code-point 111;
            }
            forwarding-class be1 {
                loss-priority low code-point 011;
            }
            forwarding-class ef {
                loss-priority high code-point 110;
            }
            forwarding-class ef1 {
                loss-priority high code-point 010;
            }
            forwarding-class nc {
                loss-priority high code-point 100;
            }
            forwarding-class nc1 {
                loss-priority high code-point 000;
            }
        }
    }
}
routing-options {
    router-id 1.1.1.8;
    autonomous-system 64512;
    forwarding-table {
        export [ pplb load-balance ];
        ecmp-fast-reroute;
    }
}
protocols {
    bgp {
        group ibgp {
            type internal;
            local-address 1.1.1.8;
            family inet {
                any;
            }
            family inet-vpn {
                any;
            }
            family l2vpn {
                signaling;
            }
            export send-ospf;
            cluster 1.1.1.8;
            local-as 64512;
            graceful-restart;
            multipath;
            bfd-liveness-detection {
                minimum-interval 10;
                multiplier 3;
            }
            neighbor 2.2.2.2;
            neighbor 4.4.4.4;
            neighbor 5.5.5.5;
            neighbor 7.7.7.7;
        }
        advertise-peer-as;
    }
    ldp {
        auto-targeted-session {
            teardown-delay 90;
            maximum-sessions 100;
        }
        interface et-0/0/0.0;
        interface et-0/0/1.0;
        interface et-0/0/2.0;
        interface et-0/0/3.0;
        interface et-1/0/1.0;
        interface et-1/0/3.0;
        interface et-1/0/4.0;
        interface ae2.0;
        interface lo0.0;
        p2mp;
    }
    mpls {
        interface et-0/0/1.0;
        interface et-0/0/0.0;
        interface et-0/0/2.0;
        interface et-0/0/3.0;
        interface ae2.0;
        interface et-1/0/3.0;
        interface et-1/0/4.0;
        interface et-1/0/1.0;
    }
    ospf {
        backup-spf-options {
            remote-backup-calculation;
            per-prefix-calculation all;
            node-link-degradation;
        }
        traffic-engineering;
        area 0.0.0.0 {
            interface lo0.0 {
                passive;
            }
            interface fxp0.0 {
                disable;
            }
            interface et-0/0/1.0 {
                node-link-protection;
                bfd-liveness-detection {
                    minimum-interval 10;
                    multiplier 3;
                    full-neighbors-only;
                }
                ldp-synchronization;
            }
            interface et-0/0/0.0 {
                node-link-protection;
                bfd-liveness-detection {
                    minimum-interval 10;
                    multiplier 3;
                    full-neighbors-only;
                }
                ldp-synchronization;
            }
            interface et-0/0/2.0 {
                node-link-protection;
                bfd-liveness-detection {
                    minimum-interval 10;
                    multiplier 3;
                    full-neighbors-only;
                }
                ldp-synchronization;
            }
            interface et-0/0/3.0 {
                node-link-protection;
                bfd-liveness-detection {
                    minimum-interval 10;
                    multiplier 3;
                    full-neighbors-only;
                }
                ldp-synchronization;
            }
            interface et-1/0/1.0 {
                node-link-protection;
                bfd-liveness-detection {
                    minimum-interval 10;
                    multiplier 3;
                    full-neighbors-only;
                }
                ldp-synchronization;
            }
            interface et-1/0/3.0 {
                node-link-protection;
                bfd-liveness-detection {
                    minimum-interval 10;
                    multiplier 3;
                    full-neighbors-only;
                }
                ldp-synchronization;
            }
            interface et-1/0/4.0 {
                node-link-protection;
                bfd-liveness-detection {
                    minimum-interval 10;
                    multiplier 3;
                    full-neighbors-only;
                }
                ldp-synchronization;
            }
            interface ae2.0 {
                node-link-protection;
                bfd-liveness-detection {
                    minimum-interval 10;
                    multiplier 3;
                    full-neighbors-only;
                }
                ldp-synchronization;
            }
        }
    }
    pim {
        rp {
            local {
                address 1.1.1.8;
                process-non-null-as-null-register;
            }
        }
        interface et-1/0/4.0 {
            mode sparse;
        }
        interface et-1/0/3.0 {
            mode sparse;
        }
        interface et-1/0/1.0 {
            mode sparse;
        }
        interface lo0.0 {
            mode sparse;
        }
        interface ae2.0 {
            mode sparse;
        }
    }
}
