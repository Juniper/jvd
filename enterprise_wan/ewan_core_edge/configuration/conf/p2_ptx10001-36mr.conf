chassis {
    aggregated-devices {
        ethernet {
            device-count 25;
        }
    }
    network-services enhanced-ip;
}
interfaces {
    et-0/0/4 {
        description "P2Node to WANEdge2";
        unit 0 {
            family inet {
                address 192.168.34.2/24;
            }
            family mpls;
        }
    }
    et-0/0/5 {
        description "P2Node to P1Node";
        unit 0 {
            family inet {
                address 192.168.67.2/24;
            }
            family mpls;
        }
    }
    et-0/0/6 {
        description "P2Node to WANEdge3";
        unit 0 {
            family inet {
                address 192.168.89.1/24;
            }
            family mpls;
        }
    }
    et-0/0/7 {
        gigether-options {
            802.3ad ae4;
        }
    }
    et-0/1/4 {
        gigether-options {
            802.3ad ae4;
        }
    }
    ae4 {
        description "P2 Node to WANEdge4";
        aggregated-ether-options {
            link-speed mixed;
            lacp {
                active;
                periodic fast;
            }
        }
        unit 0 {
            family inet {
                address 192.168.45.1/24;
            }
            family mpls;
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 6.6.6.6/32;
            }
        }
    }
}
policy-options {
    policy-statement send-ospf {
        term 2 {
            from protocol ospf;
            then accept;
        }
    }
}
routing-options {
    router-id 6.6.6.6;
    autonomous-system 64512;
}
protocols {
    bgp {
        group ibgp {
            type internal;
            local-address 6.6.6.6;
            family inet-vpn {
                any;
            }
            family l2vpn {
                signaling;
            }
            export send-ospf;
            cluster 6.6.6.6;
            bfd-liveness-detection {
                minimum-interval 100;
                multiplier 3;
            }
            neighbor 2.2.2.2;
            neighbor 4.4.4.4;
            neighbor 5.5.5.5;
            neighbor 7.7.7.7;
        }
    }
    ldp {
        interface et-0/0/4.0;
        interface et-0/0/6.0;
        interface ae4.0;
        interface lo0.0;
    }
    mpls {
        interface et-0/0/4.0;
        interface et-0/0/5.0;
        interface et-0/0/6.0;
        interface ae4.0;
    }
    ospf {
        backup-spf-options {
            remote-backup-calculation;
            per-prefix-calculation all;
            node-link-degradation;
        }
        traffic-engineering;
        area 0.0.0.0 {
            interface lo0.0 {
                passive;
            }
            interface fxp0.0 {
                disable;
            }
            interface et-0/0/5.0 {
                node-link-protection;
                bfd-liveness-detection {
                    minimum-interval 10;
                    multiplier 3;
                    full-neighbors-only;
                }
                ldp-synchronization;
            }
            interface et-0/0/4.0 {
                node-link-protection;
                bfd-liveness-detection {
                    minimum-interval 10;
                    multiplier 3;
                    full-neighbors-only;
                }
                ldp-synchronization;
            }
            interface et-0/0/6.0 {
                node-link-protection;
                bfd-liveness-detection {
                    minimum-interval 10;
                    multiplier 3;
                    full-neighbors-only;
                }
                ldp-synchronization;
            }
            interface ae4.0 {
                node-link-protection;
                bfd-liveness-detection {
                    minimum-interval 10;
                    multiplier 3;
                    full-neighbors-only;
                }
                ldp-synchronization;
            }
        }
    }
}
