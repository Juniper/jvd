/*
 * Topic: VLAN bridge domain with two units
 * Seen on:
 *   Junos: ce4_mx480
 *   EVO: (none)
 * Count:
 *   ce4_mx480 2500
 *   total 2500
 * Highlights:
 *   - Bridges one VLAN across the listed units.
 * Pair with: none
 *
 * Peers with: n/a
 * Variables (example values from ce4_mx480):
 *   $BD_NAME   e.g. VPWS1
 *   $VLAN      e.g. 1
 *   $AC_IFL_A  e.g. xe-3/1/10.1
 *   $AC_IFL_B  e.g. ae0.1
 */
bridge-domains {
    $BD_NAME {
        vlan-id $VLAN;
        interface $AC_IFL_A;
        interface $AC_IFL_B;
    }
}
