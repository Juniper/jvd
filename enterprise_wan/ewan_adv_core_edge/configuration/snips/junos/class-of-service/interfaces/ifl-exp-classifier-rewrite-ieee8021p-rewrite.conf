class-of-service {
    interfaces {
        $COS_INTF {
            unit $UNIT {
                classifiers {
                    exp EXP;
                }
                rewrite-rules {
                    exp EXP-REWRITE;
                    ieee-802.1 8021P-REWRITE;
                }
            }
        }
    }
}
