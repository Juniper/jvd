/*
 * Topic: VLAN-tagged circuit cross-connect unit with family ccc
 * Seen on:
 *   Junos: wanedge1_mx304 wanedge2_mx10004
 *   EVO: (none)
 * Count:
 *   wanedge1_mx304 300
 *   wanedge2_mx10004 300
 *   total 600
 * Pair with: none
 * Peers with: n/a
 * Variables (example values from wanedge1_mx304):
 *   $IFD   e.g. xe-0/0/9:0
 *   $UNIT  e.g. 1
 *   $VLAN  e.g. 1
 */
interfaces {
    $IFD {
        unit $UNIT {
            encapsulation vlan-ccc;
            vlan-id $VLAN;
            family ccc;
        }
    }
}
