 *   ce4_mx480 5001
 *   wanedge1_mx304 1075
 *   wanedge2_mx10004 1052
 *   total 7128
 * Highlights:
 *   - `encapsulation vlan-bridge` places the unit in a bridge domain or VLAN.
 * Pair with: none
 * Peers with: n/a
 * Variables (example values from ce4_mx480):
 *   $IFD   e.g. ae0
 *   $UNIT  e.g. 1
 *   $VLAN  e.g. 1
