/*
 * Topic: VLAN-tagged IPv4 unit with MPLS
 * Seen on:
 *   Junos: wanedge2_mx10004
 *   EVO: (none)
 * Count:
 *   wanedge2_mx10004 1
 *   total 1
 * Pair with: none
 * Peers with: n/a
 * Variables (example values from wanedge2_mx10004):
 *   $IFD         e.g. et-3/3/0
 *   $UNIT        e.g. 0
 *   $VLAN        e.g. 1
 *   $AC_ADDR_V4  e.g. 192.168.34.1/24
 */
interfaces {
    $IFD {
        unit $UNIT {
            vlan-id $VLAN;
            family inet {
                address $AC_ADDR_V4;
            }
            family mpls;
        }
    }
}
