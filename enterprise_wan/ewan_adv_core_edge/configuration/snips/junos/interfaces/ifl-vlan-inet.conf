/*
 * Topic: VLAN-tagged IPv4 unit
 * Seen on:
 *   Junos: wanedge1_mx304 wanedge2_mx10004
 *   EVO: (none)
 * Count:
 *   wanedge1_mx304 12
 *   wanedge2_mx10004 12
 *   total 24
 * Pair with: none
 * Peers with: n/a
 * Variables (example values from wanedge1_mx304):
 *   $IFD         e.g. xe-0/0/9:0
 *   $UNIT        e.g. 3000
 *   $VLAN        e.g. 3000
 *   $AC_ADDR_V4  e.g. 200.200.1.1/24
 */
interfaces {
    $IFD {
        unit $UNIT {
            vlan-id $VLAN;
            family inet {
                address $AC_ADDR_V4;
            }
        }
    }
}
