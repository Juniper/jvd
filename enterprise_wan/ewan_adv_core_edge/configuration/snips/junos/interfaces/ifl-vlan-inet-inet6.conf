/*
 * Topic:   VLAN logical interface with IPv4 and IPv6 addresses
 * Seen on:
 *   Junos: wanedge2_mx10004
 *   EVO: (none)
 * Count:
 *   wanedge2_mx10004 400
 *   total 400
 * Pair with: none
 * Peers with: n/a
 * Variables (example values from wanedge2_mx10004):
 *   $IFD         e.g. xe-0/0/11
 *   $UNIT        e.g. 1801
 *   $VLAN        e.g. 1801
 *   $AC_ADDR_V4  e.g. 35.1.1.2/24
 *   $AC_ADDR_V6  e.g. 3500::2/64
 */
interfaces {
    $IFD {
        unit $UNIT {
            vlan-id $VLAN;
            family inet {
                address $AC_ADDR_V4;
            }
            family inet6 {
                address $AC_ADDR_V6;
            }
        }
    }
}
