/*
 * Topic:   IRB unit carrying a single IPv4 address
 * Seen on:
 *   Junos: wanedge1_mx304 wanedge2_mx10004
 *   EVO: (none)
 * Count:
 *   wanedge1_mx304 200
 *   wanedge2_mx10004 175
 *   total 375
 * Pair with: none
 * Peers with: n/a
 * Variables (example values from wanedge1_mx304):
 *   $UNIT      e.g. 100
 *   $IRB_ADDR  e.g. 100.100.100.1/24
 */
interfaces {
    irb {
        unit $UNIT {
            family inet {
                address $IRB_ADDR;
            }
        }
    }
}
