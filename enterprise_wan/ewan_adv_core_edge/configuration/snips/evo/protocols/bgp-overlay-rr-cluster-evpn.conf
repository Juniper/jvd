/*
 * Topic: iBGP route reflector for IPv4 and EVPN
 * Seen on:
 *   Junos: (none)
 *   EVO: p1_ptx10003
 * Count:
 *   p1_ptx10003 1
 *   total 1
 * Highlights:
 *   - Route reflector cluster with four PE clients; graceful restart and BFD.
 * Pair with: none
 * Peers with:
 *   [p1_ptx10003] <-> [wanedge1_mx304]
 *   [p1_ptx10003] <-> [wanedge2_mx10004]
 *   [p1_ptx10003] <-> [wanedge3_acx7509]
 *   [p1_ptx10003] <-> [wanedge4_acx7100-48l]
 * Variables (example values from p1_ptx10003):
 *   $LOOPBACK_V4  e.g. 3.3.3.3
 *   $ASN          e.g. 64512
 *   $PE1_V4       e.g. 2.2.2.2
 *   $PE2_V4       e.g. 5.5.5.5
 *   $PE3_V4       e.g. 4.4.4.4
 *   $PE4_V4       e.g. 7.7.7.7
 */
protocols {
    bgp {
        group ibgp {
            type internal;
            local-address $LOOPBACK_V4;
            family inet {
                unicast;
            }
            family evpn {
                signaling;
            }
            cluster $LOOPBACK_V4;
            local-as $ASN;
            graceful-restart;
            bfd-liveness-detection {
                minimum-interval 100;
                multiplier 3;
            }
            neighbor $PE1_V4;
            neighbor $PE2_V4;
            neighbor $PE3_V4;
            neighbor $PE4_V4;
        }
    }
}
