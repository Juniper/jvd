/*
 * Topic: VLAN-tagged IPv4 unit
 * Seen on:
 *   Junos: (none)
 *   EVO: wanedge3_acx7509 wanedge4_acx7100-48l
 * Count:
 *   wanedge3_acx7509 12
 *   wanedge4_acx7100-48l 12
 *   total 24
 * Pair with: none
 * Peers with: n/a
 * Variables (example values from wanedge3_acx7509):
 *   $IFD         e.g. et-0/0/2
 *   $UNIT        e.g. 3000
 *   $VLAN        e.g. 3000
 *   $AC_ADDR_V4  e.g. 211.211.2.1/24
 */
interfaces {
    $IFD {
        unit $UNIT {
            vlan-id $VLAN;
            family inet {
                address $AC_ADDR_V4;
            }
        }
    }
}
