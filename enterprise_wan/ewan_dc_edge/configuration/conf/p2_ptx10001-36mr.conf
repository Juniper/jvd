    }
    intSpeeds {
        chassis {
            fpc 0 {
                pic 0 {
                    port 0 {
                        speed 100g;
                    }
                    port 1 {
                        speed 100g;
                    }
                    port 2 {
                        speed 100g;
                    }
                    port 3 {
                        speed 100g;
                    }
                }
            }
        }
    }
}
apply-groups [ global intSpeeds ];
interfaces {
    et-0/0/0 {
        unit 0 {
            family inet {
                address 10.0.11.1/30;
            }
            family mpls;
        }
    }
    et-0/0/1 {
        unit 0 {
            family inet {
                address 10.0.14.2/30;
            }
            family mpls;
        }
    }
    et-0/0/2 {
        unit 0 {
            family inet {
                address 10.0.12.1/30;
            }
            family mpls;
        }
    }
    et-0/0/3 {
        unit 0 {
            family inet {
                address 10.0.18.1/30;
            }
            family mpls;
        }
    }
}
forwarding-options {
    l2circuit-control-passthrough;
}
policy-options {
    policy-statement load-balance {
        term 1 {
            then {
                load-balance per-packet;
            }
        }
    }
}
routing-options {
    router-id 1.1.1.8;
    forwarding-table {
        export load-balance;
    }
}
protocols {
    ldp {
        interface all;
        interface fxp0.0 {
            disable;
        }
        interface lo0.0;
    }
    mpls {
        interface all;
        interface fxp0.0 {
            disable;
        }
    }
    ospf {
        area 0.0.0.0 {
            interface et-0/0/3.0;
            interface et-0/0/2.0;
            interface et-0/0/1.0;
            interface et-0/0/0.0;
            interface lo0.0 {
                passive;
            }
            interface re0:mgmt-0.0 {
                disable;
            }
        }
    }
    lldp {
        interface all;
    }
}
