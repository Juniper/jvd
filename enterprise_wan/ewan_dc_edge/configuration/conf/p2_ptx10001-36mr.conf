                        route 10.0.0.0/10 {
                            next-hop 10.83.153.254;
                            retain;
                            no-readvertise;
                        }
                        /* 10.64/10 */
                        route 10.64.0.0/10 {
                            next-hop 10.83.153.254;
                            retain;
                            no-readvertise;
                        }
                        /* 10.128/10 */
                        route 10.128.0.0/10 {
                            next-hop 10.83.153.254;
                            retain;
                            no-readvertise;
                        }
                        /* 10.192/11 */
                        route 10.192.0.0/11 {
                            next-hop 10.83.153.254;
                            retain;
                            no-readvertise;
                        }
                        /* 10.224/12 */
