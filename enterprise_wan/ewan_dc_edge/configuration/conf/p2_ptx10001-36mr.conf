version 21.4R2.1-EVO;
groups {
    global {
        system {
            host-name p2;
            root-authentication {
                encrypted-password "<REMOVED>"; ## SECRET-DATA
            }
            services {
                finger;
                ftp;
                ssh {
                    root-login allow;
                }
                telnet;
                xnm-clear-text;
                netconf {
                    ssh;
                }
            }
            debugger-on-break;
            dump-on-panic;
            processes {
                routing enable;
                ntp enable;
                management enable;
                watchdog enable;
                snmp enable;
                inet-process enable;
                mib-process enable;
            }
        }
        chassis {
            dump-on-panic;
        }
        interfaces {
            re0:mgmt-0 {
                unit 0 {
                    family inet {
                        address 10.83.153.28/24;
                    }
                }
            }
            lo0 {
                unit 0 {
                    family inet {
                        address 127.0.0.1/32;
                        address 127.0.0.64/32;
                        address 1.1.1.8/32 {
                            primary;
                            preferred;
                        }
                    }
                }
            }
        }
        routing-instances {
            mgmt_junos {
                routing-options {
                    static {
                        /* corperate and alpha net */
                        route 172.16.0.0/12 {
                            next-hop 10.83.153.254;
                            retain;
                            no-readvertise;
                        }
