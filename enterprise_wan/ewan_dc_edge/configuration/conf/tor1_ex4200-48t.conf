version 15.1R7-S9;
groups {
    member0 {
        system {
            host-name tor1;
        }
    }
    global {
        system {
            debugger-on-panic;
            debugger-on-break;
            dump-on-panic;
            root-authentication {
                encrypted-password "<REMOVED>"; ## SECRET-DATA
            }
            services {
                finger;
                ftp;
                ssh {
                    root-login allow;
                }
                telnet;
                xnm-clear-text;
                netconf {
                    ssh;
                }
            }
            processes {
                routing enable;
                ntp enable;
                management enable;
                watchdog enable;
                snmp enable;
                inet-process enable;
                mib-process enable;
            }
        }
        chassis {
            dump-on-panic;
        }
        interfaces {
            lo0 {
                unit 0 {
                    family inet {
                        address 10.255.152.18/32 {
