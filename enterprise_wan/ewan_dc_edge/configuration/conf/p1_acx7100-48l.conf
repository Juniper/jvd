interfaces {
    et-0/0/48 {
        speed 100g;
        unit 0 {
            family inet {
                address 10.0.15.2/30;
            }
            family mpls;
        }
    }
    et-0/0/49 {
        speed 100g;
        unit 0 {
            family inet {
                address 10.0.16.2/30;
            }
            family mpls;
        }
    }
    et-0/0/50 {
        enable;
        speed 100g;
        unit 0 {
            family inet {
                address 10.0.13.2/30;
            }
            family mpls;
        }
    }
    et-0/0/51 {
        speed 100g;
        unit 0 {
            family inet {
                address 10.0.12.2/30;
            }
            family mpls;
        }
