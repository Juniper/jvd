policy-options {
    policy-statement load-balance {
        term 1 {
            then {
                load-balance per-packet;
            }
        }
    }
}
routing-options {
    router-id 1.1.1.7;
    forwarding-table {
        export load-balance;
    }
}
protocols {
    ldp {
        interface et-0/0/48.0;
        interface et-0/0/49.0;
        interface et-0/0/50.0;
        interface et-0/0/51.0;
        interface lo0.0;
    }
    mpls {
        interface et-0/0/49.0;
        interface et-0/0/48.0;
        interface et-0/0/50.0;
        interface et-0/0/51.0;
        interface all;
    }
    ospf {
        backup-spf-options {
            remote-backup-calculation;
            per-prefix-calculation all;
            node-link-degradation;
        }
        area 0.0.0.0 {
            interface et-0/0/49.0 {
                node-link-protection;
                ldp-synchronization;
            }
            interface et-0/0/50.0 {
                node-link-protection;
                ldp-synchronization;
            }
            interface et-0/0/51.0 {
                node-link-protection;
                ldp-synchronization;
            }
            interface et-0/0/48.0 {
                node-link-protection;
                ldp-synchronization;
            }
            interface lo0.0 {
                passive;
            }
            interface fxp0.0;
        }
    }
