routing-options {
    router-id 1.1.1.10;
    autonomous-system 65000;
    forwarding-table {
        export load-balance;
        chained-composite-next-hop {
            ingress {
                evpn;
            }
        }
    }
}
protocols {
    bgp {
        group EVPN-MPLS-IBGP {
            type internal;
            local-address 1.1.1.10;
            family evpn {
                signaling;
            }
            multipath;
            neighbor 1.1.1.5 {
                description DC-WANEdge1;
            }
            neighbor 1.1.1.6 {
                description DC-WANEdge2;
            }
            neighbor 1.1.1.9 {
                description WAN-EDGE2;
            }
        }
    }
    ldp {
        interface et-0/0/0.0;
        interface et-0/0/1.0;
        interface all;
        interface lo0.0;
    }
    mpls {
        interface et-0/0/0.0;
        interface et-0/0/1.0;
    }
    ospf {
        backup-spf-options {
            remote-backup-calculation;
            per-prefix-calculation all;
            node-link-degradation;
        }
        area 0.0.0.0 {
            interface et-0/0/0.0 {
                node-link-protection;
                ldp-synchronization;
            }
            interface et-0/0/1.0 {
                node-link-protection;
                ldp-synchronization;
            }
            interface lo0.0 {
                passive;
            }
            interface fxp0.0 {
                disable;
            }
        }
    }
}
