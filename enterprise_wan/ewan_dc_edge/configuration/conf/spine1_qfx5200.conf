version 21.4R2.1;
groups {
    global {
        system {
            root-authentication {
                encrypted-password "<REMOVED>"; ## SECRET-DATA
            }
            services {
                finger;
                ftp;
                ssh {
                    root-login allow;
                }
                telnet;
                xnm-clear-text;
                netconf {
                    ssh;
                }
            }
            debugger-on-panic;
            debugger-on-break;
            dump-on-panic;
            processes {
                routing enable;
                ntp enable;
                management enable;
                watchdog enable;
                snmp enable;
                inet-process enable;
                mib-process enable;
            }
        }
        chassis {
            dump-on-panic;
        }
        interfaces {
            lo0 {
                unit 0 {
                    family inet {
                        address 10.255.7.232/32;
                        address 1.1.1.3/32 {
                            primary;
                        }
                    }
                    family iso {
                        address 47.0005.80ff.f800.0000.0108.0001.0102.5500.7232.00;
                    }
                    family inet6 {
                        address abcd::10:255:7:232/128 {
                            primary;
                        }
                    }
                }
            }
        }
        routing-options {
            router-id 1.1.1.3;
        }
    }
    member0 {
        system {
            host-name spine1;
        }
    }
}
apply-groups [ global member0 ];
system {
    host-name spine1;
    ports {
        console log-out-on-disconnect;
    }
}
chassis {
    fpc 0 {
        pic 0 {
            port 2 {
                channel-speed 10g;
            }
        }
    }
}
interfaces {
    et-0/0/0 {
        unit 0 {
            family inet {
                address 10.0.6.2/30;
            }
        }
    }
    et-0/0/1 {
        unit 0 {
            family inet {
                address 10.0.9.2/30;
            }
        }
    }
    xe-0/0/2:0 {
        unit 0 {
            family inet {
                address 10.0.1.1/30;
            }
        }
    }
    xe-0/0/2:1 {
        unit 0 {
            family inet {
                address 10.0.4.1/30;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 1.1.1.3/32;
            }
        }
    }
}
policy-options {
    policy-statement lo0 {
        from {
            family inet;
            protocol direct;
            route-filter 0.0.0.0/0 prefix-length-range /32-/32;
        }
        then accept;
    }
    policy-statement load-balance {
        term 1 {
            then {
                load-balance per-packet;
            }
        }
    }
}
routing-options {
    autonomous-system 65000;
    forwarding-table {
        export load-balance;
        ecmp-fast-reroute;
    }
}
protocols {
    bgp {
        group underlay-dcwanedge {
            type external;
            export lo0;
            local-as 65002;
            multipath {
                multiple-as;
            }
            neighbor 10.0.6.1 {
                description dcwanedge1;
                peer-as 65003;
            }
            neighbor 10.0.9.1 {
                description dcwanedge2;
                peer-as 65003;
            }
        }
        group underlay-leaf {
            type external;
            export lo0;
            local-as 65002;
            multipath {
                multiple-as;
            }
            neighbor 10.0.1.2 {
                description leaf1;
                peer-as 65001;
            }
            neighbor 10.0.4.2 {
                description leaf2;
                peer-as 65001;
            }
        }
    }
}
