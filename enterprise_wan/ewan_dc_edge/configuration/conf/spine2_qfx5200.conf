policy-options {
    policy-statement lo0 {
        from {
            family inet;
            protocol direct;
            route-filter 0.0.0.0/0 prefix-length-range /32-/32;
        }
        then accept;
    }
    policy-statement load-balance {
        term 1 {
            then {
                load-balance per-packet;
            }
        }
    }
}
routing-options {
    router-id 1.1.1.4;
    forwarding-table {
        export load-balance;
        ecmp-fast-reroute;
    }
}
protocols {
    bgp {
        group underlay-dcwanedge {
            type external;
            export lo0;
            local-as 65002;
            multipath {
                multiple-as;
            }
            neighbor 10.0.7.1 {
                description dcwanedge-2;
                peer-as 65003;
            }
            neighbor 10.0.8.1 {
                description dcwanedge-1;
                peer-as 65003;
            }
        }
        group underlay-leaf {
            type external;
            export lo0;
            local-as 65002;
            multipath {
                multiple-as;
            }
            neighbor 10.0.2.2 {
                description leaf1;
                peer-as 65001;
            }
            neighbor 10.0.5.2 {
                description leaf2;
                peer-as 65001;
            }
        }
    }
}
