/*
 * Topic: Complete deployed BGP form for leaf2_qfx5120-48t
 * Seen on:
 *   Junos: leaf2_qfx5120-48t
 *   EVO: (none)
 * Count:
 *   leaf2_qfx5120-48t 1
 *   total 1
 * Variant group: ewan-bgp-overlay
 *   Provides: evpn
 * Highlights:
 *   - Same two-group leaf form as leaf1 with this leaf's own loopback and underlay neighbour addresses.
 * Pair with:
 *  - junos/policy-options/policy-statement/ps-export-loopback.conf
 * Variables: none
 */
protocols {
    bgp {
        group underlay-spine {
            type external;
            export lo0;
            local-as 65001;
            multipath {
                multiple-as;
            }
            neighbor 10.0.4.1 {
                description spine1;
                peer-as 65002;
            }
            neighbor 10.0.5.1 {
                description spine2;
                peer-as 65002;
            }
        }
        group OVERLAY_VXLAN {
            type internal;
            local-address 1.1.1.2;
            family evpn {
                signaling;
            }
            multipath;
            bfd-liveness-detection {
                minimum-interval 350;
                multiplier 3;
            }
            neighbor 1.1.1.5;
            neighbor 1.1.1.6;
        }
    }
}
