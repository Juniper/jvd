/*
 * Topic: Complete deployed BGP form for spine2_qfx5200
 * Seen on:
 *   Junos: spine2_qfx5200
 *   EVO: (none)
 * Count:
 *   spine2_qfx5200 1
 *   total 1
 * Highlights:
 *   - Same underlay-only spine form as spine1 with this spine's own neighbour addresses.
 * Pair with:
 *  - junos/policy-options/policy-statement/ps-export-loopback.conf
 * Variables: none
 */
protocols {
    bgp {
        group underlay-dcwanedge {
            type external;
            export lo0;
            local-as 65002;
            multipath {
                multiple-as;
            }
            neighbor 10.0.7.1 {
                description dcwanedge-2;
                peer-as 65003;
            }
            neighbor 10.0.8.1 {
                description dcwanedge-1;
                peer-as 65003;
            }
        }
        group underlay-leaf {
            type external;
            export lo0;
            local-as 65002;
            multipath {
                multiple-as;
            }
            neighbor 10.0.2.2 {
                description leaf1;
                peer-as 65001;
            }
            neighbor 10.0.5.2 {
                description leaf2;
                peer-as 65001;
            }
        }
    }
}
