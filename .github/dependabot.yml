version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/portal"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      portal-patches-and-minors:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"