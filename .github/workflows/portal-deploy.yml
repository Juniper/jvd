name: Build and Deploy Portal

on:
  push:
    branches: [main]
    paths:
      - 'portal/**'
      - '**/configuration/snips/**'
      - '.github/workflows/portal-deploy.yml'
  pull_request:
    paths:
      - 'portal/**'
      - '**/configuration/snips/**'
      - '.github/workflows/portal-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned (not "latest"): an exact version lets setup-bun build the
          # release download URL directly and skip the api.github.com tags
          # lookup, which is flaky under GitHub API rate-limits / 503s.
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify snip library parses
        run: node -e 'JSON.parse(require("node:fs").readFileSync("src/data/snips.json","utf8")); JSON.parse(require("node:fs").readFileSync("public/snips.json","utf8"))'

      - name: Build
        run: bun run build

      - name: Stamp the publishing commit into the built corpus
        # Runs in the build job, so pull-request CI exercises it. Never
        # committed: the tracked export has to stay reproducible from the
        # sources alone. Excluded from exportDigest, so stamping cannot
        # invalidate what it stamps.
        run: |
          node -e '
            const fs = require("node:fs");
            const f = "dist/snips.json";
            const b = JSON.parse(fs.readFileSync(f, "utf8"));
            b.publishedCommit = process.env.GITHUB_SHA;
            fs.writeFileSync(f, JSON.stringify(b, null, 2) + "\n");
            console.log(`stamped ${f} with ${b.publishedCommit}`);
          '

      - name: Copy index.html to 404.html (SPA fallback)
        run: cp dist/index.html dist/404.html

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: portal-dist
          path: portal/dist
          retention-days: 7

  deploy:
    needs: build
    permissions:
      contents: write
    # Publish on a push to main, or when manually re-run (workflow_dispatch) —
    # the latter is needed to recover a deploy after a GitHub Actions/Pages incident.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: portal-dist
          path: dist

      - name: Deploy to gh-pages/portal
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          destination_dir: portal
          keep_files: true
          commit_message: "Deploy portal: ${{ github.sha }}"
