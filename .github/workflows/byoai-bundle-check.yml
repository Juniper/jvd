name: BYOAI bundle assembly consistency

# Ensures jvd-mebs-snips.md and jvd-mebs-byoai-prompt.txt are
# reassembled whenever any source file under the MEBS snips/
# tree (or the byoai/ companion files) changes.
#
# Public CI has no builder, so it runs regenerate-bundle.sh --public-only:
# bundle assembly consistency using committed public artifacts
# (TIERS.md/MANIFEST.json as committed). This is not regeneration,
# freshness verification or qualification; trusted-builder qualification
# remains responsible for semantic freshness before publication.
#
# Fails the PR if the committed bundle does not match what
# regenerate-bundle.sh --public-only would assemble right now.

on:
  pull_request:
    paths:
      - 'service_provider/metro_ethernet_business_services/configuration/snips/**'
  push:
    branches: [main]
    paths:
      - 'service_provider/metro_ethernet_business_services/configuration/snips/**'

permissions:
  contents: read

jobs:
  check-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Bundle assembly consistency using committed public artifacts
        working-directory: service_provider/metro_ethernet_business_services/configuration/snips/byoai
        run: ./regenerate-bundle.sh --public-only

      - name: Verify bundle is up to date
        run: |
          if ! git diff --exit-code -- \
              'service_provider/metro_ethernet_business_services/configuration/snips/byoai/jvd-mebs-snips.md' \
              'service_provider/metro_ethernet_business_services/configuration/snips/byoai/jvd-mebs-byoai-prompt.txt'; then
            echo ""
            echo "::error::BYOAI bundle is stale. Run regenerate-bundle.sh (with JVD_BUILDER set) from the byoai/ folder and commit the result."
            exit 1
          fi
          echo "Bundle is up to date."
