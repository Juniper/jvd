name: Snip contract

# Public acceptance only. Deep generation, reconstruction and qualification run in the
# private builder; this workflow verifies public-product properties with no credentials:
# header contract shape of changed snippets, catalog/manifest presence and parse, and the
# detached qualification record for the candidate tree when one is supplied.

on:
  pull_request:
    paths:
      - '**/configuration/**'
      - 'portal/public/snips.json'
      - 'portal/src/data/**'
      - '.github/**'

permissions:
  contents: read

jobs:
  accept:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Public artifacts parse
        run: |
          node -e '
            const fs = require("node:fs");
            for (const file of ["portal/src/data/snips.json", "portal/public/snips.json"]) JSON.parse(fs.readFileSync(file, "utf8"));
            for (const file of fs.globSync("**/configuration/snips/byoai/MANIFEST.json")) JSON.parse(fs.readFileSync(file, "utf8"));
            for (const file of fs.globSync("**/configuration/snips/_snip-library.json")) {
              const meta = JSON.parse(fs.readFileSync(file, "utf8"));
              if (meta.schemaVersion !== 1) throw new Error(`${file}: unsupported schemaVersion`);
            }
            console.log("public artifacts parse");
          '
      - name: Changed snippets keep the header contract shape
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE"...HEAD -- '**/configuration/snips/junos/**/*.conf' '**/configuration/snips/evo/**/*.conf' || true)
          [ -z "$changed" ] && { echo "no snippet changes"; exit 0; }
          status=0
          for f in $changed; do
            [ -f "$f" ] || continue
            head -1 "$f" | grep -q '^/\*' || { echo "::error file=$f::header must open with /*"; status=1; }
            grep -Eq '^ \* (Topic|Apply-groups?):' "$f" || { echo "::error file=$f::missing Topic"; status=1; }
            grep -q '^ \* Seen on:' "$f" || { echo "::error file=$f::missing Seen on"; status=1; }
            grep -q '^ \* Pair with' "$f" || { echo "::error file=$f::missing Pair with"; status=1; }
            grep -Eq '^ \*  - required:' "$f" && { echo "::error file=$f::unapproved Pair with sub-grammar"; status=1; }
          done
          exit $status
      - name: Detached qualification record (diagnostic structural check)
        # Public CI cannot be the release gate: a candidate must not supply the verifier or policy that decides
        # whether it is trusted. This step only checks that a record attached under .github/qualification/ is
        # structurally complete and bound to this exact commit/tree (checks, independent results, evidence
        # references, hashes, freshness) and fails if not. Release acceptance — detached attestation verified
        # against the builder's trust policy — happens in the trusted builder workflow.
        if: hashFiles('.github/qualification/*.qualification.json') != ''
        run: |
          set -e
          for record in .github/qualification/*.qualification.json; do
            node .github/scripts/accept-qualification.mjs --record "$record" --policy .github/qualification/trust-policy.json
          done
