name: Snip contract

on:
  pull_request:
    paths:
      - '**/configuration/snips/**'
      - 'portal/scripts/snip-parse.mjs'
      - 'portal/scripts/snip-validate.mjs'
      - 'portal/scripts/snip-validate.test.mjs'
      - 'portal/scripts/variant-resolve.mjs'
      - 'portal/scripts/variant.test.mjs'
      - 'portal/scripts/bgp-capabilities.mjs'
      - 'portal/scripts/bgp-capabilities.test.mjs'
      - 'portal/scripts/ifl-capabilities.mjs'
      - 'portal/scripts/ifl-capabilities.test.mjs'
      - 'portal/scripts/gr-capabilities.mjs'
      - 'portal/scripts/gr-capabilities.test.mjs'
      - 'portal/scripts/config-objects.mjs'
      - 'portal/scripts/config-objects.test.mjs'
      - 'portal/scripts/object-ownership.mjs'
      - 'portal/scripts/object-ownership.test.mjs'
      - 'portal/scripts/config-references.mjs'
      - 'portal/scripts/config-references.test.mjs'
      - 'portal/scripts/dependency-resolve.mjs'
      - 'portal/scripts/dependency-resolve.test.mjs'
      - 'portal/scripts/library-completeness.mjs'
      - 'portal/scripts/generate-tiers.mjs'
      - 'portal/scripts/composition-validate.mjs'
      - 'portal/scripts/composition-validate.test.mjs'
      - '**/configuration/snips/_composition.json'
      - 'portal/scripts/generate-snips.mjs'
      - '.github/SNIP-CONTRACT.md'
      - '.github/workflows/snip-contract.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history so the changed-snip diff against the PR base resolves
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
        working-directory: portal
      - name: Contract unit tests
        run: >-
          node --test
          portal/scripts/snip-validate.test.mjs
          portal/scripts/variant.test.mjs
          portal/scripts/bgp-capabilities.test.mjs
          portal/scripts/ifl-capabilities.test.mjs
          portal/scripts/gr-capabilities.test.mjs
          portal/scripts/config-objects.test.mjs
          portal/scripts/object-ownership.test.mjs
          portal/scripts/config-references.test.mjs
          portal/scripts/dependency-resolve.test.mjs
          portal/scripts/composition-validate.test.mjs
      - name: snips.json is up to date
        run: node portal/scripts/generate-snips.mjs --check
      - name: Validate changed snips against the contract
        run: node portal/scripts/snip-validate.mjs --base ${{ github.event.pull_request.base.sha }}
      - name: Named objects have exactly one applicable owner
        run: node portal/scripts/object-ownership.mjs
      - name: Composition matrix closes or exposes validated required inputs
        run: node portal/scripts/composition-validate.mjs --audit --expect-required-inputs
      - name: TIERS.md is generated from the matrix
        run: node portal/scripts/generate-tiers.mjs --check
      # Reported, not enforced: two known group constructs are still unreachable
      # for devices that reference them. Promote to a gate once they are closed.
      - name: Referenced constructs are reachable where they are used
        continue-on-error: true
        run: node portal/scripts/library-completeness.mjs --by-construct
