name: Snip contract

on:
  pull_request:
    paths:
      - '**/configuration/**'
      - 'portal/scripts/**'
      - 'portal/package.json'
      - 'portal/bun.lock'
      - 'portal/public/snips.json'
      - 'portal/src/data/**'
      - '.github/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history so the changed-snip diff against the PR base resolves
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
        working-directory: portal
      - name: Select affected JVD checks
        id: scope
        env:
          VALIDATION_BASE: ${{ github.event.pull_request.base.sha }}
        run: node portal/scripts/validation-scope.mjs --base "$VALIDATION_BASE" --jvd service_provider/metro_ethernet_business_services >> "$GITHUB_OUTPUT"
      - name: Contract tests and affected corpus cases
        env:
          SNIP_VALIDATION_BASE: ${{ github.event.pull_request.base.sha }}
        run: npm --prefix portal run snips:test
      - name: snips.json is up to date
        run: node portal/scripts/generate-snips.mjs --check
      - name: Validate changed snips against the contract
        run: node portal/scripts/snip-validate.mjs --base ${{ github.event.pull_request.base.sha }}
      - name: Verify enrolled Count and peer evidence
        env:
          VALIDATION_BASE: ${{ github.event.pull_request.base.sha }}
        run: npm --prefix portal run snips:evidence -- --base "$VALIDATION_BASE"
      - name: Named objects have exactly one applicable owner
        if: steps.scope.outputs.required == 'true'
        run: node portal/scripts/object-ownership.mjs --jvd service_provider/metro_ethernet_business_services
      - name: Composition matrix closes or exposes validated required inputs
        if: steps.scope.outputs.required == 'true'
        run: node portal/scripts/composition-validate.mjs --jvd service_provider/metro_ethernet_business_services --audit --expect-required-inputs
      - name: TIERS.md is generated from the matrix
        if: steps.scope.outputs.required == 'true'
        run: node portal/scripts/generate-tiers.mjs --jvd service_provider/metro_ethernet_business_services --check
      # Reported, not enforced: two known group constructs are still unreachable
      # for devices that reference them. Promote to a gate once they are closed.
      - name: Referenced constructs are reachable where they are used
        if: steps.scope.outputs.required == 'true'
        continue-on-error: true
        run: node portal/scripts/library-completeness.mjs --jvd service_provider/metro_ethernet_business_services --by-construct
