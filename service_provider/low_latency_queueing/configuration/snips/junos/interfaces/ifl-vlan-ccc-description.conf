/*
 * Topic: VLAN unit with vlan-ccc encapsulation and a description
 * Seen on:
 *   Junos: sag_mx304
 *   EVO: (none)
 * Count:
 *   sag_mx304 400
 *   total 400
 * Pair with: none
 * Peers with: n/a
 * Variables (example values from sag_mx304):
 *   $IFD          e.g. xe-0/1/3:3
 *   $UNIT         e.g. 501
 *   $DESCRIPTION  e.g. L2-MBH-EVPN-VPWS-SH-TO-AN4-501
 *   $VLAN         e.g. 501
 */
interfaces {
    $IFD {
        unit $UNIT {
            description $DESCRIPTION;
            encapsulation vlan-ccc;
            vlan-id $VLAN;
        }
    }
}
