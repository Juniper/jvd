/*
 * Topic: FPC with tunnel services on one PIC and two ports split into four 10GbE sub-ports on another
 * Seen on:
 *   Junos: sag_mx304
 *   EVO: (none)
 * Count:
 *   sag_mx304 1
 *   total 1
 * Pair with: none
 * Peers with: n/a
 * Variables (example values from sag_mx304):
 *   $FPC_SLOT  e.g. 0
 *   $TS_PIC    e.g. 0
 *   $PIC_SLOT  e.g. 1
 */
chassis {
    fpc $FPC_SLOT {
        pic $TS_PIC {
            tunnel-services;
        }
        pic $PIC_SLOT {
            port 1 {
                number-of-sub-ports 4;
                speed 10g;
            }
            port 3 {
                number-of-sub-ports 4;
                speed 10g;
            }
        }
    }
}
