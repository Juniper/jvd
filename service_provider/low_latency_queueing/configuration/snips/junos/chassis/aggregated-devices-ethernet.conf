 * Seen on:
 *   Junos: ag2_1_mx204 ag2_2_mx204 ag3_1_mx480 ag3_2_mx480 du_qfx5210 sag_mx304
 *   EVO: (none)
 * Count:
 *   ag2_1_mx204 1
 *   ag2_2_mx204 1
 *   ag3_1_mx480 1
 *   ag3_2_mx480 1
 *   du_qfx5210 1
 *   sag_mx304 1
 *   total 6
 * Pair with: none
 * Peers with: n/a
 * Variables (example values from ag2_1_mx204):
 *   $AE_DEVICE_COUNT  e.g. 25
 */
chassis {
    aggregated-devices {
        ethernet {
            device-count $AE_DEVICE_COUNT;
        }
    }
}
