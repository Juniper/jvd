class-of-service {
    interfaces {
        irb {
            unit $UNIT {
                forwarding-class FC-REALTIME;
                rewrite-rules {
                    dscp RR-DSCP;
                    dscp-ipv6 RR-DSCP-IPV6;
                }
            }
        }
    }
}
