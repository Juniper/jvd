/*
 * Topic: Single-tagged routed logical interface carrying an IPv4 customer address
 * Seen on:
 *   Junos: (none)
 *   EVO: ag1_1_acx7509 ag1_2_acx7100-32c an4_acx7024
 * Count:
 *   ag1_1_acx7509 2
 *   ag1_2_acx7100-32c 2
 *   an4_acx7024 2
 *   total 6
 * Pair with: none
 * Peers with: n/a
 * Variables (example values from ag1_1_acx7509):
 *   $IFD         e.g. et-1/0/1
 *   $UNIT        e.g. 3801
 *   $VLAN        e.g. 3801
 *   $AC_ADDR_V4  e.g. 10.92.1.1/24
 */
interfaces {
    $IFD {
        unit $UNIT {
            vlan-id $VLAN;
            family inet {
                address $AC_ADDR_V4;
            }
        }
    }
}
