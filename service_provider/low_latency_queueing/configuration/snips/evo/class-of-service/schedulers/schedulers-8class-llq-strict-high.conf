/*
 * Topic: Schedulers for the eight forwarding classes: SC-LLQ shaped at priority strict-high, SC-SIGNALING high, SC-REALTIME medium-high
 * Seen on:
 *   Junos: (none)
 *   EVO: cr1_ptx10001-36mr cr2_ptx10001-36mr
 * Count:
 *   cr1_ptx10001-36mr 1
 *   cr2_ptx10001-36mr 1
 *   total 2
 * Pair with: none
 * Peers with: n/a
 * Variables: none
 */
class-of-service {
    schedulers {
        SC-BEST-EFFORT {
            transmit-rate {
                remainder;
            }
            buffer-size {
                remainder;
            }
            priority low;
        }
        SC-CONTROL {
            shaping-rate percent 5;
            buffer-size percent 5;
            priority high;
        }
        SC-HIGH {
            transmit-rate percent 40;
            buffer-size percent 30;
            priority low;
        }
        SC-LLQ {
            shaping-rate percent 40;
            buffer-size percent 10;
            priority strict-high;
        }
        SC-LOW {
            transmit-rate percent 20;
            priority low;
        }
        SC-MEDIUM {
            transmit-rate percent 30;
            buffer-size percent 20;
            priority low;
        }
        SC-REALTIME {
            shaping-rate percent 30;
            buffer-size percent 20;
            priority medium-high;
        }
        SC-SIGNALING {
            shaping-rate percent 5;
            buffer-size percent 5;
            priority high;
        }
    }
}
