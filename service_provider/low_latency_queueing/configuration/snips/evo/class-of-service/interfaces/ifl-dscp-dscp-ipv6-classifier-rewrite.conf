class-of-service {
    interfaces {
        $COS_INTF {
            unit $UNIT {
                classifiers {
                    dscp CL-DSCP;
                    dscp-ipv6 CL-DSCP-IPV6;
                }
                rewrite-rules {
                    dscp RR-DSCP;
                    dscp-ipv6 RR-DSCP-IPV6;
                }
            }
        }
    }
}
