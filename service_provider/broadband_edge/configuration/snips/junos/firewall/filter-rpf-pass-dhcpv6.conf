/*
 * Topic: IPv6 RPF-fail filter rpf-pass-dhcpv6 that passes DHCPv6
 * Seen on:
 *   Junos: bng1_mx304 bng2_mx204 bng3_mx10004 bng4_mx480
 *   EVO: (none)
 * Count:
 *   bng1_mx304 1
 *   bng2_mx204 1
 *   bng3_mx10004 1
 *   bng4_mx480 1
 *   total 4
 * Highlights:
 *  - Lets DHCPv6 through when the RPF check fails and discards everything else.
 * Pair with: none
 *
 * Peers with: n/a
 * Variables: none
 */
firewall {
    family inet6 {
        filter rpf-pass-dhcpv6 {
            term allow-dhcpv6 {
                from {
                    destination-address {
                        ffff::ffff/128;
                    }
                    destination-port dhcp;
                }
                then accept;
            }
            term default {
                then discard;
            }
        }
    }
}
