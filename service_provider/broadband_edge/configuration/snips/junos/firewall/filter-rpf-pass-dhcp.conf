/*
 * Topic: IPv4 RPF-fail filter rpf-pass-dhcp that passes DHCP broadcasts
 * Seen on:
 *   Junos: bng1_mx304 bng2_mx204 bng3_mx10004 bng4_mx480
 *   EVO: (none)
 * Count:
 *   bng1_mx304 1
 *   bng2_mx204 1
 *   bng3_mx10004 1
 *   bng4_mx480 1
 *   total 4
 * Highlights:
 *  - Lets limited-broadcast DHCP through when the RPF check fails and discards everything else.
 * Pair with: none
 *
 * Peers with: n/a
 * Variables: none
 */
firewall {
    family inet {
        filter rpf-pass-dhcp {
            term allow-dhcp {
                from {
                    destination-address {
                        255.255.255.255/32;
                    }
                    destination-port dhcp;
                }
                then accept;
            }
            term default {
                then {
                    discard;
                }
            }
        }
    }
}
