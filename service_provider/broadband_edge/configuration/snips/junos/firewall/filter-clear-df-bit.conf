/*
 * Topic: Interface-specific IPv4 filter clear-df-bit that clears the Don't Fragment bit
 * Seen on:
 *   Junos: bng1_mx304 bng2_mx204 bng3_mx10004 bng4_mx480
 *   EVO: (none)
 * Count:
 *   bng1_mx304 1
 *   bng2_mx204 1
 *   bng3_mx10004 1
 *   bng4_mx480 1
 *   total 4
 * Highlights:
 *  - Accepts all traffic and clears the DF bit, so subscriber packets can be fragmented.
 * Pair with: none
 *
 * Peers with: n/a
 * Variables: none
 */
firewall {
    family inet {
        filter clear-df-bit {
            interface-specific;
            term 1 {
                then {
                    accept;
                    dont-fragment clear;
                }
            }
        }
    }
}
