/*
 * Topic: MX204 FPC with 100G tunnel services, four 100G ports and PIC 1 disabled
 * Seen on:
 *   Junos: bng2_mx204
 *   EVO: (none)
 * Count:
 *   bng2_mx204 1
 *   total 1
 * Highlights:
 *  - Reserves 100G of PIC 0 bandwidth for tunnel services and runs its four ports at 100G.
 *  - `number-of-ports 0` disables PIC 1.
 * Pair with: none
 *
 * Peers with: n/a
 * Variables (example values from bng2_mx204):
 *   $FPC_SLOT  e.g. 0
 */
chassis {
    fpc $FPC_SLOT {
        pic 0 {
            tunnel-services {
                bandwidth 100g;
            }
            port 0 {
                speed 100g;
            }
            port 1 {
                speed 100g;
            }
            port 2 {
                speed 100g;
            }
            port 3 {
                speed 100g;
            }
        }
        pic 1 {
            number-of-ports 0;
        }
    }
}
