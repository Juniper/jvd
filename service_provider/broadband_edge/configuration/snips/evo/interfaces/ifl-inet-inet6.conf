/*
 * Topic: Dual-stack logical interface
 * Seen on:
 *   Junos: (none)
 *   EVO: cr1_ptx10004
 * Count:
 *   cr1_ptx10004 2
 *   total 2
 * Highlights:
 *  - Carries IPv4 and IPv6 toward an attached server or test port.
 * Pair with: none
 *
 * Peers with: n/a
 * Variables (example values from cr1_ptx10004):
 *   $IFD         e.g. et-0/0/20:0
 *   $UNIT        e.g. 0
 *   $AC_ADDR_V4  e.g. 192.0.2.1/24
 *   $AC_ADDR_V6  e.g. 2001:db8::11:11:110:1/120
 */
interfaces {
    $IFD {
        unit $UNIT {
            family inet {
                address $AC_ADDR_V4;
            }
            family inet6 {
                address $AC_ADDR_V6;
            }
        }
    }
}
