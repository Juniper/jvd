 *   total 1
 * Highlights:
 *  - Joins the port to the bundle through `ether-options 802.3ad`.
 * Pair with: none
 *
 * Peers with: n/a
 * Variables (example values from cr1_ptx10004):
 *   $CORE_INTF    e.g. et-0/0/6
