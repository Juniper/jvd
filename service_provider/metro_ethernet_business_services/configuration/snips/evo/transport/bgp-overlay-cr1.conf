/*
 * Topic:   Complete deployed BGP form for cr1_ptx10001-36mr (EVO)
 * Seen on:
 *   Junos: (none)
 *   EVO:   cr1_ptx10001-36mr
 * Variant group: mebs-bgp-overlay
 *   Provides: labeled-unicast
 *
 * Highlights:
 *  - Complete deployed BGP control-plane form for cr1_ptx10001-36mr.
 *
 * Pair with:
 *  - evo/apply-groups/gr-bgp-bcp.conf
 *  - evo/policy/ps-as63536-import.conf
 *  - evo/policy/ps-bgp-export-ring-cr1.conf
 *  - evo/policy/ps-cr-import.conf
 *  - evo/policy/ps-ebgp-mse-export.conf
 *  - evo/policy/ps-ibgp-cr-export-cr1.conf
 *  - evo/policy/ps-metro-fabric-import.conf
 *  - evo/transport/rib-groups.conf
 *
 * Variables: none
 */
protocols {
    bgp {
        apply-groups GR-BGP-BCP;
        group GR-IBGP-MEG-RR {
            type internal;
            local-address 1.1.0.8;
            inactive: import PS-METRO-FABRIC-IMPORT;
            family inet {
                labeled-unicast {
                    rib-group RG-REMOTE-LOOPBACKS;
                    rib {
                        inet.3;
                    }
                    explicit-null connected-only;
                }
                transport {
                    add-path {
                        receive;
                        send {
                            path-count 4;
                        }
                    }
                }
            }
            family inet6 {
                labeled-unicast {
                    rib {
                        inet6.3;
                    }
                }
                transport {
                    add-path {
                        receive;
                        send {
                            path-count 4;
                        }
                    }
                }
            }
            export PS-BGP-EXPORT-RING;
            inactive: cluster 1.1.0.8;
            bfd-liveness-detection {
                minimum-interval 100;
                multiplier 3;
            }
            neighbor 1.1.0.6;
            neighbor 1.1.0.7;
        }
        group GR-EBGP-MSE1-TP {
            type external;
            import PS-AS63536-IMPORT;
            family inet {
                labeled-unicast {
                    rib-group RG-REMOTE-LOOPBACKS;
                    nexthop-resolution {
                        preserve-nexthop-hierarchy;
                    }
                    per-prefix-label;
                    rib {
                        inet.3;
                    }
                    explicit-null connected-only;
                    protection;
                }
                transport {
                    nexthop-resolution {
                        preserve-nexthop-hierarchy;
                    }
                    protection;
                }
            }
            family inet6 {
                labeled-unicast {
                    nexthop-resolution {
                        preserve-nexthop-hierarchy;
                    }
                    per-prefix-label;
                    rib {
                        inet6.3;
                    }
                    protection;
                }
                transport {
                    nexthop-resolution {
                        preserve-nexthop-hierarchy;
                    }
                    protection;
                }
            }
            export PS-EBGP-MSE-EXPORT;
            peer-as 63536;
            bfd-liveness-detection {
                minimum-interval 100;
                multiplier 3;
            }
            neighbor 10.10.0.38;
        }
        group GR-IBGP-CR {
            type internal;
            local-address 1.1.0.8;
            import PS-CR-IMPORT;
            family inet {
                labeled-unicast {
                    rib-group RG-REMOTE-LOOPBACKS;
                    add-path {
                        receive;
                        send {
                            path-count 2;
                            multipath;
                        }
                    }
                    nexthop-resolution {
                        preserve-nexthop-hierarchy;
                    }
                    rib {
                        inet.3;
                    }
                    explicit-null connected-only;
                }
                transport {
                    add-path {
                        receive;
                        send {
                            path-count 4;
                        }
                    }
                    nexthop-resolution {
                        preserve-nexthop-hierarchy;
                    }
                }
            }
            family inet6 {
                labeled-unicast {
                    rib {
                        inet6.3;
                    }
                }
                transport {
                    add-path {
                        receive;
                        send {
                            path-count 4;
                        }
                    }
                    nexthop-resolution {
                        preserve-nexthop-hierarchy;
                    }
                }
            }
            export PS-IBGP-CR-EXPORT;
            bfd-liveness-detection {
                minimum-interval 100;
                multiplier 3;
            }
            neighbor 1.1.0.9 {
                description "CR2 neighbor";
            }
        }
        log-updown;
        graceful-restart;
        multipath;
    }
}
