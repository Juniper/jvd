/*
 * Topic:   Complete deployed BGP form for ma3_acx7100-48l (EVO)
 * Seen on:
 *   Junos: (none)
 *   EVO:   ma3_acx7100-48l
 * Variant group: mebs-bgp-overlay
 *   Provides: evpn, l2vpn, inet-vpn, inet6-vpn, labeled-unicast
 *
 * Highlights:
 *  - Complete deployed BGP control-plane form for ma3_acx7100-48l.
 *
 * Pair with:
 *  - evo/apply-groups/gr-bgp-bcp.conf
 *  - evo/policy/nhs1-ma3.conf
 *  - evo/policy/ps-bgp-transport-export.conf
 *  - evo/transport/rib-groups.conf
 *
 * Variables: none
 */
protocols {
    bgp {
        apply-groups GR-BGP-BCP;
        advertise-from-main-vpn-tables;
        vpn-apply-export;
        group GR-IBGP-MDR {
            type internal;
            local-address 1.1.0.15;
            family inet {
                labeled-unicast {
                    rib-group RG-REMOTE-LOOPBACKS;
                    rib {
                        inet.3;
                    }
                    explicit-null connected-only;
                }
                transport {
                    add-path {
                        receive;
                        send {
                            path-count 4;
                        }
                    }
                }
            }
            family inet6 {
                labeled-unicast {
                    rib {
                        inet6.3;
                    }
                }
                transport {
                    add-path {
                        receive;
                        send {
                            path-count 4;
                        }
                    }
                }
            }
            family route-target {
                nexthop-resolution {
                    no-resolution;
                }
            }
            export PS-BGP-TRANSPORT-EXPORT;
            bfd-liveness-detection {
                minimum-interval 200;
                multiplier 3;
            }
            neighbor 1.1.0.12;
            neighbor 1.1.0.13;
        }
        group mpbgp_ma_rr-client {
            type internal;
            local-address 1.1.0.15;
            family inet-vpn {
                unicast;
            }
            family inet6-vpn {
                unicast;
            }
            family l2vpn {
                signaling;
            }
            family evpn {
                signaling;
            }
            family route-target {
                nexthop-resolution {
                    no-resolution;
                }
            }
            export nhs1;
            bfd-liveness-detection {
                minimum-interval 200;
                multiplier 3;
            }
            neighbor 1.1.0.10;
            neighbor 1.1.0.11;
        }
        log-updown;
        graceful-restart;
        multipath;
    }
}
