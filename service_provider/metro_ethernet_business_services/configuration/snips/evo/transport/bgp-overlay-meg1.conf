/*
 * Topic:   Complete deployed BGP form for meg1_acx7100-32c (EVO)
 * Seen on:
 *   Junos: (none)
 *   EVO:   meg1_acx7100-32c
 * Variant group: mebs-bgp-overlay
 *   Provides: evpn, l2vpn, inet-vpn, inet6-vpn, labeled-unicast
 *
 * Highlights:
 *  - Complete deployed BGP control-plane form for meg1_acx7100-32c.
 *
 * Pair with:
 *  - evo/apply-groups/gr-bgp-bcp.conf
 *  - evo/policy/import-bgp-meg1.conf
 *  - evo/policy/ps-bgp-rr-export.conf
 *  - evo/policy/ps-ibgp-cr-export-meg1.conf
 *  - evo/transport/rib-groups.conf
 *
 * Variables: none
 */
protocols {
    bgp {
        apply-groups GR-BGP-BCP;
        advertise-from-main-vpn-tables;
        vpn-apply-export;
        group GR-IBGP-FABRIC-RR {
            type internal;
            local-address 1.1.0.6;
            import IMPORT-BGP;
            family inet {
                labeled-unicast {
                    rib-group RG-REMOTE-LOOPBACKS;
                    rib {
                        inet.3;
                    }
                    explicit-null connected-only;
                }
                transport {
                    add-path {
                        receive;
                        send {
                            path-count 4;
                        }
                    }
                }
            }
            family inet-vpn {
                unicast;
            }
            family inet6 {
                labeled-unicast {
                    rib {
                        inet6.3;
                    }
                }
                transport {
                    add-path {
                        receive;
                        send {
                            path-count 4;
                        }
                    }
                }
            }
            family inet6-vpn {
                unicast;
            }
            family l2vpn {
                signaling;
            }
            family evpn {
                signaling;
            }
            family route-target {
                nexthop-resolution {
                    no-resolution;
                }
            }
            export PS-BGP-RR-EXPORT;
            cluster 1.1.0.6;
            bfd-liveness-detection {
                minimum-interval 100;
                multiplier 3;
            }
            neighbor 1.1.0.0 {
                description "AN1 - rtme-mx-45";
            }
            neighbor 1.1.0.1 {
                description "AN2 - rtme-acx17";
            }
            neighbor 1.1.0.2 {
                description "AN3 - rtme-acx-48l-05";
            }
            neighbor 1.1.0.3 {
                description "AN4 - rtme-acx710-h";
            }
        }
        group GR-IBGP-CR {
            type internal;
            local-address 1.1.0.6;
            family inet {
                labeled-unicast {
                    rib-group RG-REMOTE-LOOPBACKS;
                    rib {
                        inet.3;
                    }
                    explicit-null connected-only;
                }
                transport {
                    add-path {
                        receive;
                        send {
                            path-count 4;
                        }
                    }
                }
            }
            family inet6 {
                labeled-unicast {
                    rib {
                        inet6.3;
                    }
                }
                transport {
                    add-path {
                        receive;
                        send {
                            path-count 4;
                        }
                    }
                }
            }
            export PS-IBGP-CR-EXPORT;
            bfd-liveness-detection {
                minimum-interval 100;
                multiplier 3;
            }
            neighbor 1.1.0.8;
            neighbor 1.1.0.9;
        }
        group ibgp_meg {
            type internal;
            local-address 1.1.0.6;
            family l2vpn {
                signaling;
            }
            family evpn {
                signaling;
            }
            bfd-liveness-detection {
                minimum-interval 100;
                multiplier 3;
            }
            neighbor 1.1.0.7;
        }
        group ebgp_mse_mpbgp {
            type external;
            multihop {
                no-nexthop-change;
            }
            local-address 1.1.0.6;
            family inet-vpn {
                unicast;
            }
            family inet6-vpn {
                unicast;
            }
            family l2vpn {
                signaling;
            }
            family evpn {
                signaling;
            }
            family route-target {
                external-paths 4;
                nexthop-resolution {
                    no-resolution;
                }
            }
            peer-as 63536;
            multipath;
            bfd-liveness-detection {
                minimum-interval 100;
                multiplier 3;
            }
            neighbor 1.1.0.10;
            neighbor 1.1.0.11;
        }
        log-updown;
        graceful-restart;
        multipath;
    }
}
