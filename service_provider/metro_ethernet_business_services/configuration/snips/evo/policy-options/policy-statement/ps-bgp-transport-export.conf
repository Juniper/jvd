policy-options {
    policy-statement PS-BGP-TRANSPORT-EXPORT {
        term ORIGIN {
            then {
                community add CM-METRO-RING;
                next term;
            }
        }
        term LOOPBACK {
            from protocol [ direct bgp ];
            then {
                next-hop self;
                accept;
            }
        }
        term LU {
            from rib inet.3;
            then reject;
        }
        term CT {
            from rib bgp.transport.3;
            then reject;
        }
        term ACCEPT-NHS {
            then {
                next-hop self;
                accept;
            }
        }
    }
}
