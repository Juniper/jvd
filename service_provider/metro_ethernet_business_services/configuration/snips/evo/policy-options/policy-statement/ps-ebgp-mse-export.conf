 *
 * Pair with:
 *  - evo/policy-options/community/cm-metro-fabric.conf
 *  - evo/policy-options/community/cm-metro-ring.conf
 *  - evo/policy-options/community/cm-service-edge.conf
 *  - evo/policy-options/prefix-list/pl-core-nodes.conf
