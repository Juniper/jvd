policy-options {
    policy-statement PS-EBGP-MSE-EXPORT {
        term LOOP-PREVENT {
            from community [ CM-SERVICE-EDGE CM-METRO-RING ];
            then reject;
        }
        term LOOPBACK {
            from {
                protocol [ bgp direct ];
                prefix-list PL-CORE-NODES;
                prefix-list PL-METRO-FABRIC;
            }
            then {
                community add CM-METRO-FABRIC;
                accept;
            }
        }
    }
}
