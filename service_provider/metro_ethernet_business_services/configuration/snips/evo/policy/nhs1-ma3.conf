 * Topic:   BGP policy nhs1 (EVO)
 * Seen on:
 *   Junos: (none)
 *   EVO:   ma3_acx7100-48l
 *
 * Highlights:
 *  - As-deployed nhs1 routing policy.
 *
 * Pair with:
 *  - evo/policy/communities.conf
 *
 * Variables: none
 */
policy-options {
    policy-statement nhs1 {
        term ORIGIN {
            then {
                community add CM-METRO-RING;
                next term;
            }
        }
        term 2 {
            from {
                family evpn;
                protocol bgp;
            }
            then accept;
        }
        term 3 {
            then {
                next-hop self;
                accept;
            }
        }
    }
}
