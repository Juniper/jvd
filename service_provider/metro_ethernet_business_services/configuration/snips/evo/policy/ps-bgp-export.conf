 *   EVO:   an3_acx7100-48l
 *
 * Highlights:
 *  - As-deployed PS-BGP-EXPORT routing policy.
 *
 * Pair with:
 *  - evo/policy/communities.conf
 *
 * Variables: none
 */
policy-options {
    policy-statement PS-BGP-EXPORT {
        term ORIGIN {
            then {
                community add CM-ACCESS-FABRIC;
                next term;
            }
        }
        term EVPN-NO-NHS {
            from {
                family evpn;
                protocol bgp;
            }
            then accept;
        }
        term LOOPBACK {
            from protocol [ direct bgp ];
            then {
                next-hop self;
                accept;
            }
        }
        term LU {
            from rib inet.3;
            then reject;
        }
        term CT {
            from rib bgp.transport.3;
            then reject;
        }
        term ACCEPT-NHS {
            then {
                next-hop self;
                accept;
            }
        }
    }
}
