/*
 * Topic:   Core interface device
 * Seen on:
 *   Junos: (none)
 *   EVO:   cr1_ptx10001-36mr mdr1_acx7509
 * Pair with:
 *  - evo/groups/gr-core-intf.conf
 * Variables:
 *   $CORE_DESC   e.g. "to MSE1 rtme-mx304-02 rtme-mx304-02"
 *   $IFD   e.g. et-0/0/0
