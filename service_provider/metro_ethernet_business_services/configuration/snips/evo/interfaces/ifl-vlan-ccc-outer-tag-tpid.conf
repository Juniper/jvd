/*
 * Topic: Cross-connect logical interface with an 802.1ad outer VLAN tag
 * Seen on:
 *   Junos: (none)
 *   EVO: ma3_acx7100-48l
 * Pair with:
 *  - evo/interfaces/ifd-core-flexible-100g-ether-tpid.conf
 * Variables:
 *   $IFD          e.g. et-0/0/51
 *   $UNIT         e.g. 4010
 *   $VLAN_OUTER   e.g. 4010
 */
interfaces {
    $IFD {
        unit $UNIT {
            encapsulation vlan-ccc;
            vlan-tags outer 0x88a8.$VLAN_OUTER;
        }
    }
}