/*
 * Topic:   Per-unit 802.1p classifier application
 * Seen on:
 *   Junos: (none)
 *   EVO:   meg2_acx7509
 *
 * Highlights:
 *  - Ingress 802.1p classifier applied to one logical unit.
 *
 * Pair with:
 *  - evo/class-of-service/classifiers/cl-6class.conf
 *
 * Variables:
 *   $COS_INTF    e.g. ae12
 *   $UNIT        e.g. 700
 */
class-of-service {
    interfaces {
        $COS_INTF {
            unit $UNIT {
                classifiers {
                    ieee-802.1 8021P;
                }
            }
        }
    }
}
