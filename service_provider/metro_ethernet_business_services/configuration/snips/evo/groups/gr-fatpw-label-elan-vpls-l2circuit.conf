/*
 * Topic:   Flow labels for port-based EVPN-ELAN, VPLS and L2Circuit
 * Seen on:
 *   Junos: (none)
 *   EVO:   ma1-2_acx7024
 * Variant group: mebs-fatpw-label-form
 *   Provides: gr:fatpw-label
 * Pair with: none
 * Variables: none
 */
groups {
    GR-FATPW-LABEL {
        routing-instances {
            <EVPN_ELAN_PORT_*> {
                protocols {
                    evpn {
                        flow-label;
                        flow-label-static;
                    }
                }
            }
            <vpls_*> {
                protocols {
                    vpls {
                        flow-label-transmit;
                        flow-label-receive;
                    }
                }
            }
        }
        protocols {
            l2circuit {
                neighbor <*> {
                    interface <*> {
                        flow-label-transmit;
                        flow-label-receive;
                    }
                }
            }
        }
    }
}