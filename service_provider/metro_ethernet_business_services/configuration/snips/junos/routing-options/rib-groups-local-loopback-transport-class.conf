routing-options {
    rib-groups {
        RG-LOCAL-LOOPBACK {
            import-rib [ inet.0 inet.3 junos-rti-tc-4000.inet.3 junos-rti-tc-6000.inet.3 ];
            import-policy PS-LOCAL-LOOPBACK;
        }
        RG-REMOTE-LOOPBACKS {
            import-rib [ inet.3 inet.0 inet6.3 ];
            import-policy PS-REMOTE-LOOPBACKS;
        }
    }
}
