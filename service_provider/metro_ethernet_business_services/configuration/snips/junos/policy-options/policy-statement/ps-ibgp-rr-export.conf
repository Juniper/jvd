/*
 * Topic:   BGP policy PS-IBGP-RR-EXPORT (Junos)
 * Seen on:
 *   Junos: mdr2_mx10003
 *   EVO:   (none)
 *
 * Highlights:
 *  - As-deployed PS-IBGP-RR-EXPORT routing policy.
 *
 * Pair with:
 *  - junos/policy-options/community/communities.conf
 *  - junos/policy-options/prefix-list/pl-an-region.conf
 *  - junos/policy-options/prefix-list/pl-mse.conf
 *
 * Variables: none
 */
policy-options {
    policy-statement PS-IBGP-RR-EXPORT {
        term MSE-NHS {
            from {
                protocol bgp;
                prefix-list PL-MSE;
            }
            then {
                next-hop self;
                accept;
            }
        }
        term AS63535 {
            from {
                protocol bgp;
                community [ CM-ACCESS-FABRIC CM-METRO-FABRIC ];
            }
            then {
                next-hop self;
                accept;
            }
        }
        term RING {
            from {
                prefix-list PL-AN-REGION;
            }
            then reject;
        }
    }
}
