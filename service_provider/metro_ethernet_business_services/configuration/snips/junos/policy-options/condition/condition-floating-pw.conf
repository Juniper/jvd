/*
 * Topic:   Floating-pseudowire route condition
 * Seen on:
 *   Junos: mse1_mx304 mse2_mx304
 *   EVO:   (none)
 * Variables:
 *   $CONDITION_NAME   e.g. Floating-PW-Condition
 *   $PS_INTF   e.g. ps0
 */
policy-options {
  condition $CONDITION_NAME {
    if-route-exists {
      address-family {
        ccc {
          $PS_INTF.0;
          table mpls.0;
        }
      }
    }
  }
}
