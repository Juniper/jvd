/*
 * Topic:   Complete deployed BGP form for mse1_mx304 (Junos)
 * Seen on:
 *   Junos: mse1_mx304
 *   EVO:   (none)
 * Variant group: mebs-bgp-overlay
 *   Provides: evpn, l2vpn, inet-vpn, inet6-vpn, labeled-unicast
 *
 * Highlights:
 *  - Complete deployed BGP control-plane form for mse1_mx304.
 *
 * Pair with:
 *  - junos/apply-groups/gr-bgp-bcp.conf
 *  - junos/policy/import-bgp-mse1.conf
 *  - junos/policy/ps-as63535-import.conf
 *  - junos/policy/ps-ebgp-cr-export.conf
 *  - junos/policy/ps-ibgp-mdr-export-mse1.conf
 *  - junos/policy/ps-ibgp-mse-export.conf
 *  - junos/policy/ps-mse-import.conf
 *  - junos/transport/rib-group-remote-loopbacks-mse.conf
 *
 * Variables: none
 */
protocols {
    bgp {
        apply-groups GR-BGP-BCP;
        advertise-from-main-vpn-tables;
        vpn-apply-export;
        group GR-EBGP-CR1-TP {
            type external;
            import PS-AS63535-IMPORT;
            family inet {
                labeled-unicast {
                    rib-group RG-REMOTE-LOOPBACKS;
                    nexthop-resolution {
                        preserve-nexthop-hierarchy;
                    }
                    per-prefix-label;
                    rib {
                        inet.3;
                    }
                    explicit-null connected-only;
                    protection;
                }
                transport {
                    nexthop-resolution {
                        preserve-nexthop-hierarchy;
                    }
                    protection;
                }
            }
            family inet6 {
                labeled-unicast {
                    nexthop-resolution {
                        preserve-nexthop-hierarchy;
                    }
                    per-prefix-label;
                    rib {
                        inet6.3;
                    }
                    protection;
                }
                transport {
                    nexthop-resolution {
                        preserve-nexthop-hierarchy;
                    }
                    protection;
                }
            }
            export PS-EBGP-CR-EXPORT;
            peer-as 63535;
            bfd-liveness-detection {
                minimum-interval 100;
                multiplier 3;
            }
            neighbor 10.10.0.37;
        }
        group ebgp_meg_mpbgp {
            type external;
            multihop {
                no-nexthop-change;
            }
            local-address 1.1.0.10;
            family inet-vpn {
                unicast;
            }
            family inet6-vpn {
                unicast;
            }
            family l2vpn {
                signaling;
            }
            family evpn {
                signaling;
            }
            family route-target {
                external-paths 4;
                nexthop-resolution {
                    no-resolution;
                }
            }
            peer-as 63535;
            local-as 63536;
            multipath;
            bfd-liveness-detection {
                minimum-interval 200;
                multiplier 3;
            }
            neighbor 1.1.0.6;
            neighbor 1.1.0.7;
        }
        group GR-IBGP-MDR {
            type internal;
            local-address 1.1.0.10;
            import IMPORT-BGP;
            family inet {
                labeled-unicast {
                    rib-group RG-REMOTE-LOOPBACKS;
                    rib {
                        inet.3;
                    }
                    explicit-null connected-only;
                }
                transport {
                    add-path {
                        receive;
                        send {
                            path-count 4;
                        }
                    }
                }
            }
            family inet6 {
                labeled-unicast {
                    rib {
                        inet6.3;
                    }
                }
                transport {
                    add-path {
                        receive;
                        send {
                            path-count 4;
                        }
                    }
                }
            }
            export PS-IBGP-MDR-EXPORT;
            bfd-liveness-detection {
                minimum-interval 100;
                multiplier 3;
            }
            neighbor 1.1.0.12;
            neighbor 1.1.0.13;
        }
        group GR-IBGP-MSE {
            type internal;
            local-address 1.1.0.10;
            import PS-MSE-IMPORT;
            family inet {
                labeled-unicast {
                    rib-group RG-REMOTE-LOOPBACKS;
                    add-path {
                        receive;
                        send {
                            path-count 2;
                            multipath;
                        }
                    }
                    nexthop-resolution {
                        preserve-nexthop-hierarchy;
                    }
                    rib {
                        inet.3;
                    }
                    explicit-null connected-only;
                }
                transport {
                    add-path {
                        receive;
                        send {
                            path-count 2;
                        }
                    }
                    nexthop-resolution {
                        preserve-nexthop-hierarchy;
                    }
                }
            }
            family inet-vpn {
                unicast;
            }
            family inet6 {
                labeled-unicast {
                    rib {
                        inet6.3;
                    }
                }
                transport {
                    add-path {
                        receive;
                        send {
                            path-count 4;
                        }
                    }
                    nexthop-resolution {
                        preserve-nexthop-hierarchy;
                    }
                }
            }
            family evpn {
                signaling {
                }
            }
            export PS-IBGP-MSE-EXPORT;
            neighbor 1.1.0.11;
        }
        group mpbgp-ma-rr {
            type internal;
            local-address 1.1.0.10;
            import IMPORT-BGP;
            family inet-vpn {
                unicast;
            }
            family inet6-vpn {
                unicast;
            }
            family l2vpn {
                signaling;
            }
            family evpn {
                signaling;
            }
            family route-target {
                advertise-default;
                nexthop-resolution {
                    no-resolution;
                }
            }
            
            cluster 1.1.0.10;
            bfd-liveness-detection {
                minimum-interval 100;
                multiplier 3;
            }
            neighbor 1.1.0.17;
            neighbor 1.1.0.18;
            neighbor 1.1.0.19;
            neighbor 1.1.0.15;
            neighbor 1.1.0.16;
        }
        log-updown;
        graceful-restart;
        multipath;
    }
}
