/*
 * Topic:   Complete deployed BGP form for ma5_mx204 (Junos)
 * Seen on:
 *   Junos: ma5_mx204
 *   EVO:   (none)
 * Variant group: mebs-bgp-overlay
 *   Provides: evpn, l2vpn, inet-vpn, labeled-unicast
 *
 * Highlights:
 *  - Complete deployed BGP control-plane form for ma5_mx204.
 *
 * Pair with:
 *  - junos/apply-groups/bgp-bcp-ma5.conf
 *  - junos/policy/nhs1.conf
 *  - junos/policy/ps-bgp-transport-export.conf
 *  - junos/transport/rib-groups.conf
 *
 * Variables: none
 */
protocols {
    bgp {
        apply-groups BGP-BCP;
        advertise-from-main-vpn-tables;
        vpn-apply-export;
        group GR-IBGP-MDR {
            type internal;
            local-address 1.1.0.19;
            family inet {
                labeled-unicast {
                    rib-group RG-REMOTE-LOOPBACKS;
                    rib {
                        inet.3;
                    }
                    explicit-null connected-only;
                }
                transport {
                    add-path {
                        receive;
                        send {
                            path-count 4;
                        }
                    }
                }
            }
            family inet6 {
                labeled-unicast {
                    rib {
                        inet6.3;
                    }
                }
                transport {
                    add-path {
                        receive;
                        send {
                            path-count 4;
                        }
                    }
                }
            }
            family route-target {
                nexthop-resolution {
                    no-resolution;
                }
            }
            export PS-BGP-TRANSPORT-EXPORT;
            bfd-liveness-detection {
                minimum-interval 100;
                multiplier 3;
            }
            neighbor 1.1.0.12;
            neighbor 1.1.0.13;
        }
        group ibgp_mse_mpbgp {
            type internal;
            local-address 1.1.0.19;
            family inet-vpn {
                unicast;
            }
            family l2vpn {
                signaling;
            }
            family evpn {
                signaling;
            }
            family route-target {
                nexthop-resolution {
                    no-resolution;
                }
            }
            export nhs1;
            bfd-liveness-detection {
                minimum-interval 100;
                multiplier 3;
            }
            neighbor 1.1.0.10;
            neighbor 1.1.0.11;
        }
        log-updown;
        graceful-restart;
        multipath;
    }
}
