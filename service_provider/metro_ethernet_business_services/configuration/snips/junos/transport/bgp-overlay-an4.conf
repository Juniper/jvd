/*
 * Topic:   Complete deployed BGP form for an4_acx710 (Junos)
 * Seen on:
 *   Junos: an4_acx710
 *   EVO:   (none)
 * Variant group: mebs-bgp-overlay
 *   Provides: evpn, l2vpn, inet-vpn, inet6-vpn, labeled-unicast
 *
 * Highlights:
 *  - Complete deployed BGP control-plane form for an4_acx710.
 *
 * Pair with:
 *  - junos/policy/ps-bgp-export.conf
 *  - junos/transport/rib-groups.conf
 *
 * Variables: none
 */
protocols {
    bgp {
        advertise-from-main-vpn-tables;
        vpn-apply-export;
        group GR-IBGP-MEG-RR {
            type internal;
            local-address 1.1.0.3;
            family inet {
                labeled-unicast {
                    rib-group RG-REMOTE-LOOPBACKS;
                    rib {
                        inet.3;
                    }
                    explicit-null connected-only;
                }
                transport {
                    add-path {
                        receive;
                        send {
                            path-count 4;
                        }
                    }
                }
            }
            family inet-vpn {
                unicast;
            }
            family inet6 {
                labeled-unicast {
                    rib {
                        inet6.3;
                    }
                }
                transport {
                    add-path {
                        receive;
                        send {
                            path-count 4;
                        }
                    }
                }
            }
            family inet6-vpn {
                unicast;
            }
            family l2vpn {
                signaling;
            }
            family evpn {
                signaling;
            }
            family route-target {
                nexthop-resolution {
                    no-resolution;
                }
            }
            export PS-BGP-EXPORT;
            bfd-liveness-detection {
                minimum-interval 100;
                multiplier 3;
            }
            neighbor 1.1.0.6;
            neighbor 1.1.0.7;
        }
        log-updown;
        graceful-restart;
        multipath;
    }
}
