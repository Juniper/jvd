/*
 * Topic:   Complete deployed BGP form for mdr2_mx10003 (Junos)
 * Seen on:
 *   Junos: mdr2_mx10003
 *   EVO:   (none)
 * Variant group: mebs-bgp-overlay
 *   Provides: labeled-unicast
 *
 * Highlights:
 *  - Complete deployed BGP control-plane form for mdr2_mx10003.
 *
 * Pair with:
 *  - junos/apply-groups/gr-bgp-bcp.conf
 *  - junos/policy/ps-bgp-mse-export.conf
 *  - junos/policy/ps-ibgp-mdr-export-mdr2.conf
 *  - junos/policy/ps-ibgp-rr-export.conf
 *  - junos/transport/rib-groups.conf
 *
 * Variables: none
 */
protocols {
    bgp {
        apply-groups GR-BGP-BCP;
        advertise-from-main-vpn-tables;
        vpn-apply-export;
        group GR-IBGP-RING-RR {
            type internal;
            local-address 1.1.0.13;
            family inet {
                labeled-unicast {
                    rib-group RG-REMOTE-LOOPBACKS;
                    rib {
                        inet.3;
                    }
                    explicit-null connected-only;
                }
                transport {
                    add-path {
                        receive;
                        send {
                            path-count 4;
                        }
                    }
                }
            }
            family inet6 {
                labeled-unicast {
                    rib {
                        inet6.3;
                    }
                }
                transport {
                    add-path {
                        receive;
                        send {
                            path-count 4;
                        }
                    }
                }
            }
            export PS-IBGP-RR-EXPORT;
            cluster 1.1.0.13;
            no-client-reflect;
            bfd-liveness-detection {
                minimum-interval 100;
                multiplier 3;
            }
            neighbor 1.1.0.17 {
                description "MA1.1 rtme-acx7024-04";
            }
            neighbor 1.1.0.18 {
                description "MA1.2 rtme-acx7024-01";
            }
            neighbor 1.1.0.19 {
                description "MA5 rtme-mx-59";
            }
            neighbor 1.1.0.15 {
                description "MA3 rtme-acx-48l-07";
            }
            neighbor 1.1.0.16 {
                description "MA4 rtme-mx204-10";
            }
        }
        group GR-IBGP-MSE {
            type internal;
            local-address 1.1.0.13;
            family inet {
                labeled-unicast {
                    rib-group RG-REMOTE-LOOPBACKS;
                    rib {
                        inet.3;
                    }
                    explicit-null connected-only;
                }
                transport {
                    add-path {
                        receive;
                        send {
                            path-count 4;
                        }
                    }
                }
            }
            family inet6 {
                labeled-unicast {
                    rib {
                        inet6.3;
                    }
                }
                transport {
                    add-path {
                        receive;
                        send {
                            path-count 4;
                        }
                    }
                }
            }
            export PS-BGP-MSE-EXPORT;
            bfd-liveness-detection {
                minimum-interval 100;
                multiplier 3;
            }
            neighbor 1.1.0.10;
            neighbor 1.1.0.11;
        }
        group GR-IBGP-MDR {
            type internal;
            local-address 1.1.0.13;
            family inet {
                labeled-unicast {
                    rib-group RG-REMOTE-LOOPBACKS;
                    rib {
                        inet.3;
                    }
                    explicit-null connected-only;
                }
                transport {
                    add-path {
                        receive;
                        send {
                            path-count 4;
                        }
                    }
                }
            }
            family inet6 {
                labeled-unicast {
                    rib {
                        inet6.3;
                    }
                }
                transport {
                    add-path {
                        receive;
                    }
                }
            }
            export PS-IBGP-MDR-EXPORT;
            bfd-liveness-detection {
                minimum-interval 100;
                multiplier 3;
            }
            neighbor 1.1.0.12;
        }
    }
}
