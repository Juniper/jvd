/*
 * Topic: Bridged logical interface with a VLAN identifier
 * Seen on:
 *   Junos: ma5_mx204 mse1_mx304 mse2_mx304
 *   EVO: an3_acx7100-48l ma1-2_acx7024
 * Variables:
 *   $IFD    e.g. xe-0/1/4
 *   $UNIT   e.g. 849
 *   $VLAN   e.g. 849
 */
interfaces {
    $IFD {
        unit $UNIT {
            encapsulation vlan-bridge;
            vlan-id $VLAN;
        }
    }
}