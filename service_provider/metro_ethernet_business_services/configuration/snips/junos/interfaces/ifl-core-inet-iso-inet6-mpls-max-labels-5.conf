/*
 * Topic:   Core logical interface
 * Seen on:
 *   Junos: an4_acx710
 *   EVO:   ag1-1_acx7100-32c
 * Pair with: none
 * Variables:
 *   $CORE_V4_ADDR   e.g. 10.10.0.81/30
 *   $CORE_V6_ADDR   e.g. 2001::10:10:0:51/126
 *   $IFD   e.g. et-0/0/13
 *   $UNIT   e.g. 0
 */
interfaces {
    $IFD {
        unit $UNIT {
            family inet {
                address $CORE_V4_ADDR;
            }
            family iso;
            family inet6 {
                address $CORE_V6_ADDR;
            }
            family mpls {
                maximum-labels 5;
            }
        }
    }
}
