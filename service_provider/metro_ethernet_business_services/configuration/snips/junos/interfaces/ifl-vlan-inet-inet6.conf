/*
 * Topic:   VLAN logical interface with IPv4 and IPv6 addresses
 * Seen on:
 *   Junos: mse1_mx304 mse2_mx304
 *   EVO: (none)
 * Count:
 *   mse1_mx304 1
 *   mse2_mx304 1
 *   total 2
 * Pair with: none
 *
 * Peers with: n/a
 * Variables:
 *   $IFD          e.g. xe-0/0/15:2
 *   $UNIT         e.g. 2001
 *   $VLAN         e.g. 2001
 *   $AC_ADDR_V4   e.g. 22.2.0.1/24
 *   $AC_ADDR_V6   e.g. 2001::22:2:0:1/126
 */
interfaces {
    $IFD {
        unit $UNIT {
            vlan-id $VLAN;
            family inet {
                address $AC_ADDR_V4;
            }
            family inet6 {
                address $AC_ADDR_V6;
            }
        }
    }
}