/*
 * Topic: Dual-tagged VLAN CCC logical interface
 * Seen on:
 *   Junos: mse1_mx304
 *   EVO: (none)
 * Count:
 *   mse1_mx304 20
 *   total 20
 * Pair with: none
 *
 * Variables:
 *   $IFD          e.g. et-0/0/4
 *   $UNIT         e.g. 800
 *   $VLAN_OUTER   e.g. 4090
 *   $VLAN_INNER   e.g. 800
 */
interfaces {
    $IFD {
        unit $UNIT {
            encapsulation vlan-ccc;
            vlan-tags outer $VLAN_OUTER inner $VLAN_INNER;
        }
    }
}