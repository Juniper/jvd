/*
 * Topic:   Core logical interface
 * Seen on:
 *   Junos: mdr2_mx10003
 *   EVO:   (none)
 * Pair with: none
 * Variables:
 *   $CORE_DESC   e.g. "to AG2.1 global"
 *   $CORE_V4_ADDR   e.g. 10.10.0.70/30
 *   $CORE_V6_ADDR   e.g. 2001::10:10:0:46/126
 *   $IFD   e.g. ae22
 *   $UNIT   e.g. 1
 *   $VLAN   e.g. 1
 */
interfaces {
    $IFD {
        unit $UNIT {
            description $CORE_DESC;
            vlan-id $VLAN;
            family inet {
                address $CORE_V4_ADDR;
            }
            family iso;
            family inet6 {
                address $CORE_V6_ADDR;
            }
            family mpls;
        }
    }
}
