system {
    services {
        extension-service {
            request-response {
                grpc {
                    clear-text {
                        port 9339;
                    }
                    max-connections 8;
                    skip-authentication;
                }
            }
        }
        netconf {
            ssh;
            rfc-compliant;
        }
    }
}
