/*
 * Topic: VLAN-tagged IPv4 unit
 * Seen on:
 *   Junos: (none)
 *   EVO: dci1_ptx10001-36mr dci3_acx7100-48l
 * Count:
 *   dci1_ptx10001-36mr 100
 *   dci3_acx7100-48l 100
 *   total 200
 * Pair with: none
 * Peers with: n/a
 * Variables (example values from dci1_ptx10001-36mr):
 *   $IFD         e.g. et-0/0/4
 *   $UNIT        e.g. 1
 *   $VLAN        e.g. 1
 *   $AC_ADDR_V4  e.g. 10.10.1.1/30
 */
interfaces {
    $IFD {
        unit $UNIT {
            vlan-id $VLAN;
            family inet {
                address $AC_ADDR_V4;
            }
        }
    }
}
