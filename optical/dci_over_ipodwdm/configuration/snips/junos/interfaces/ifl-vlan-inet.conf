/*
 * Topic: VLAN-tagged IPv4 unit
 * Seen on:
 *   Junos: dci2_mx304
 *   EVO: (none)
 * Count:
 *   dci2_mx304 100
 *   total 100
 * Pair with: none
 * Peers with: n/a
 * Variables (example values from dci2_mx304):
 *   $IFD         e.g. et-0/0/2
 *   $UNIT        e.g. 1
 *   $VLAN        e.g. 1
 *   $AC_ADDR_V4  e.g. 10.20.1.1/30
 */
interfaces {
    $IFD {
        unit $UNIT {
            vlan-id $VLAN;
            family inet {
                address $AC_ADDR_V4;
            }
        }
    }
}
