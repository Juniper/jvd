/*
 * Topic: Loopback unit with one IPv4 address
 * Seen on:
 *   Junos: dci2_mx304
 *   EVO: (none)
 * Count:
 *   dci2_mx304 1
 *   total 1
 * Pair with: none
 * Peers with: n/a
 * Variables (example values from dci2_mx304):
 *   $UNIT             e.g. 0
 *   $LOOPBACK_V4_PFX  e.g. 10.1.1.2/32
 */
interfaces {
    lo0 {
        unit $UNIT {
            family inet {
                address $LOOPBACK_V4_PFX;
            }
        }
    }
}
