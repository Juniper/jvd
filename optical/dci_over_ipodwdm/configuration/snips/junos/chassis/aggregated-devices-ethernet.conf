/*
 * Topic: Aggregated Ethernet device count
 * Seen on:
 *   Junos: dci2_mx304
 *   EVO: (none)
 * Count:
 *   dci2_mx304 1
 *   total 1
 * Highlights:
 *   - Pre-allocates the aggregated Ethernet interfaces the chassis may create.
 * Pair with: none
 * Peers with: n/a
 * Variables (example values from dci2_mx304):
 *   $AE_DEVICE_COUNT  e.g. 10
 */
chassis {
    aggregated-devices {
        ethernet {
            device-count $AE_DEVICE_COUNT;
        }
    }
}
